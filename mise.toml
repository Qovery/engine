[settings]
# Take the Rust version from rust-toolchain.toml, the same file rustup reads in
# CI, so mise tasks and CI cannot drift. Do NOT pin rust in [tools]: it would
# override that file.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"asdf:Antiarchitect/asdf-helm" = "4.3.0"
python = "3.14"
uv = "latest"

[env]
RUST_LOG = "info"
WORKSPACE_ROOT_DIR = "{{config_root}}/lib-engine"
LIB_ROOT_DIR = "{{config_root}}/lib-engine/lib"
CI_PROJECT_TITLE = "test"
# Helm 4 resolves the Engine post-renderer through this repository-local plugin directory.
# Tasks that invoke Helm prepare the plugin in `test:prepare-post-renderer` or the local launcher.
HELM_PLUGINS = "{{config_root}}/target/helm-plugins"

[tasks."graph:install"]
description = "Install code-review-graph via uv"
run = "uv tool install 'code-review-graph[communities,embeddings]'"

[tasks."graph:build"]
description = "Build code-review-graph for current repo"
run = "code-review-graph build"

[tasks.graph]
description = "Install and build the graph"
depends = ["graph:install", "graph:build"]

[tasks.get-test-secrets]
description = "Get test secrets to be able to launch the engine tests"
tools.glab = "latest"
tools.sops = "latest"
tools.age = "latest"
run = '''
  glab auth login
  AGE_KEY=$(glab variable get AGE_ENGINE_TEST_SECRET_KEY)
  SOPS_AGE_KEY=$AGE_KEY sops decrypt test_secrets.enc.env > /tmp/engine_test_secrets.env
'''

[tasks.edit-test-secrets]
description = "Edit test secrets"
tools.glab = "latest"
tools.sops = "latest"
tools.age = "latest"
run = '''
  glab auth login
  AGE_KEY=$(glab variable get AGE_ENGINE_TEST_SECRET_KEY)
  SOPS_AGE_KEY=$AGE_KEY sops test_secrets.enc.env
'''

[tasks.build]
description = "Build engine app with engine lib"
run = '''
  echo "=> Run app tests"
  cargo test --manifest-path app/Cargo.toml

  echo "=> Run build"
  cargo build --all-features --tests --color=always
'''

[tasks.lint]
description = "Run fast lint (cargo fmt + workspace clippy)"
run = '''
  ./helper.sh lint
'''

[tasks.lint-matrix]
description = "Run full clippy test matrix (dynamic features)"
run = "./helper.sh lint_matrix"

[tasks.fmt]
description = "Run cargo fmt to format code"
run = "cargo fmt --all"

[tasks.unused-deps]
description = "Check for unused Rust dependencies"
run = "find . -name Cargo.toml ! -path '*/.cargo/*' -exec cargo machete {} \\;"


[tasks.unit-tests]
description = "Run unit tests"
dir = "lib-engine"
run = '''
  cargo nextest run \
    --lib --bins \
    --message-format human \
    --manifest-path Cargo.toml \
    --no-fail-fast \
    --profile default \
    --no-tests=pass
'''

[tasks.test]
description = "Run integration tests for a given feature"
usage = 'arg "<feature>" help="Feature flag to test (e.g. test-aws-minimal)"'
depends = ["test:prepare-post-renderer"]
dir = "lib-engine"
run = '''
  set -e
  feature="${usage_feature:?Provide a feature flag, e.g.: mise run test test-aws-minimal}"

  cargo nextest run \
    --lib --tests \
    -E 'kind(test)' \
    --features "$feature" \
    --no-default-features \
    --message-format human \
    --manifest-path Cargo.toml \
    --no-fail-fast \
    --profile default \
    --no-tests=pass
'''

[tasks.single-test]
description = "Run one integration test by feature and exact name"
usage = '''
arg "<feature>" help="Feature flag that enables the test"
arg "<name>" help="Fully-qualified test name"
'''
depends = ["get-test-secrets", "test:prepare-post-renderer"]
dir = "lib-engine"
run = '''
  set -e

  # dotenv does not replace inherited values. The decrypted file contains the complete test credential set.
  unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
  unset AWS_DEFAULT_REGION AWS_REGION AWS_PROFILE AWS_DEFAULT_PROFILE
  unset AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE

  helm_bin="$(mise which helm)"
  export PATH="$(dirname "$helm_bin"):$PATH"
  export HELM_PLUGINS="{{config_root}}/target/helm-plugins"

  feature="${usage_feature:?Provide the feature that enables the test}"
  test_name="${usage_name:?Provide a test name}"

  cargo test --package qovery-engine --test lib \
    --features "$feature" \
    --no-default-features \
    "$test_name" \
    -- --include-ignored --exact
'''

[tasks."blueprint:run-local"]
description = "Run engine locally against a captured BlueprintEngineRequest JSON (e.g. DIFF action). Useful to test the blueprint preview path without q-core/redis/frontend."
usage = 'arg "<json>" help="Path to a BlueprintEngineRequest JSON"'
run = '''
  set -e
  json="${usage_json:?Provide a BlueprintEngineRequest JSON path, e.g.: mise run blueprint:run-local /tmp/req.json}"
  [ -f "$json" ] || { echo "ERROR: $json not found" >&2; exit 1; }

  BIN_VERSION_FILE="{{config_root}}/docker/bin_versions" \
  DEPLOY_FROM_FILE_KIND=blueprint \
  DEPLOY_FROM_FILE="$json" \
  TEST_CLUSTER=true \
    ./scripts/run-engine-local.sh
'''

[tasks."infra:run-local"]
description = "Run Engine locally against a captured infrastructure request JSON"
usage = 'arg "<json>" help="Path to an InfrastructureEngineRequest JSON"'
run = '''
  set -e
  json="${usage_json:?Provide an infrastructure request JSON path, e.g.: mise run infra:run-local /tmp/request.json}"
  [ -f "$json" ] || { echo "ERROR: $json not found" >&2; exit 1; }

  BIN_VERSION_FILE="{{config_root}}/docker/bin_versions" \
  DEPLOY_FROM_FILE_KIND=infra \
  DEPLOY_FROM_FILE="$json" \
  TEST_CLUSTER=true \
    ./scripts/run-engine-local.sh
'''

[tasks."env:run-local"]
description = "Run Engine locally against a captured environment request JSON"
usage = 'arg "<json>" help="Path to an EnvironmentEngineRequest JSON"'
run = '''
  set -e
  json="${usage_json:?Provide an environment request JSON path, e.g.: mise run env:run-local /tmp/request.json}"
  [ -f "$json" ] || { echo "ERROR: $json not found" >&2; exit 1; }

  BIN_VERSION_FILE="{{config_root}}/docker/bin_versions" \
  DEPLOY_FROM_FILE_KIND=env \
  DEPLOY_FROM_FILE="$json" \
  TEST_CLUSTER=true \
    ./scripts/run-engine-local.sh
'''

[tasks."engine:run-local"]
description = "Run Engine locally with the Helm 4 post-renderer configured"
run = "./scripts/run-engine-local.sh"

[tasks.test-local-stack]
description = "Run tests on a local k3d cluster"
depends = ["test:prepare-post-renderer"]
run = '''
  set -e
  if [ -z "$DOCKER_HOST" ]; then unset DOCKER_HOST; fi
  docker run -d --rm -p 5000:5000 --name engine-registry -e REGISTRY_STORAGE_DELETE_ENABLED=true public.ecr.aws/r3m4q3r9/pub-mirror-registry:2.8.1

  kube_cluster_name="kube-test-cluster-$(date +%S%N)"

  k3d cluster create -a 0 \
      --agents 0 \
      --image rancher/k3s:v1.33.4-k3s1 \
      --no-lb \
      --k3s-arg "--disable=traefik" \
      --wait "$kube_cluster_name" || k3d cluster start --wait "$kube_cluster_name"

  sleep 60
  kubectl -n kube-system wait pod --for=condition=Ready --selector app=local-path-provisioner || sleep 60
  kubectl -n kube-system wait pod --for=condition=Ready --selector app=local-path-provisioner

  echo "==========================TEST WITH LOCAL STACK==========================="
  destroy_cluster() { docker kill engine-registry; k3d cluster delete "$kube_cluster_name"; }
  trap "destroy_cluster" EXIT

  if [ -z "$DOCKER_HOST" ]; then unset DOCKER_HOST; fi

  cargo nextest run \
    --lib --tests \
    --features test-all-local \
    --no-default-features \
    --message-format human \
    --manifest-path lib-engine/Cargo.toml \
    --tool-config-file "ci:$(pwd)/lib-engine/nextest.config.toml" \
    --no-fail-fast \
    --profile default \
    --no-tests=pass
'''

[tasks.install-hook]
description = "Install git pre-commit hook that runs lint"
run = '''
  echo "mise run lint" > .git/hooks/pre-commit
  chmod 755 .git/hooks/pre-commit
  echo "Pre-commit hook installed"
'''

[tasks.cargo-version]
description = "Print cargo version"
run = "cargo --version"

[tasks."test:prepare-post-renderer"]
description = "Build and register the Helm post-renderer required by integration tests"
run = '''
  set -e

  cargo build --manifest-path app/Cargo.toml --bin engine_post_renderer
  mkdir -p target/debug/deps
  ln -sfn ../engine_post_renderer target/debug/deps/engine_post_renderer

  helm_bin="$(mise which helm)"
  export PATH="$(dirname "$helm_bin"):$PATH"
  export HELM_PLUGINS="{{config_root}}/target/helm-plugins"
  plugin_dir="$HELM_PLUGINS/qovery-engine-post-renderer"
  mkdir -p "$plugin_dir"
  cp docker/helm-plugins/engine-post-renderer/plugin.yaml "$plugin_dir/plugin.yaml"
  ln -sfn "{{config_root}}/target/debug/engine_post_renderer" "$plugin_dir/engine_post_renderer"
  "$helm_bin" plugin list | awk '$1 == "qovery-engine-post-renderer" && $3 == "postrenderer/v1" { found = 1 } END { exit !found }'
'''

