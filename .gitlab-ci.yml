image: qoveryrd/ci:0976039-cfeb430

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: /builds/qovery/qovery-engine
  DOCKER_BUILDKIT: 1
  CARGO_HOME: $WORKSPACE_ROOT_DIR/.cargo

cache: &global_cache
  key: one-key-to-rule-them-all
  paths:
    - $CARGO_HOME
    - $WORKSPACE_ROOT_DIR/target
  policy: pull

services:
  - docker:dind

stages:
  - build
  - tests
  - build
  - release
  - deploy

#
# Merge request only
#

linter-mr:
  stage: build
  retry: 0
  script:
    - ./helper.sh lint
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    - merge_requests
  interruptible: true

build-mr:
  stage: build
  retry: 0
  script:
    - ./helper.sh build
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    - merge_requests
  interruptible: true

all-self-hosted-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_self_hosted
  only:
  - merge_requests
  when: always
  tags:
    - 2cpu-4gmem-0g
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - linter-mr
    - build-mr
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week
  interruptible: true

all-managed-services-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_managed_services
  only:
    - merge_requests
  when: manual
  tags:
    - 2cpu-4gmem-0g
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - linter-mr
    - build-mr
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week
  interruptible: true

test-all-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh test_all
  only:
    - merge_requests
  dependencies:
    - linter-mr
    - build-mr
  when: manual
  tags:
    - qovery-2cpu-12gb
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week
  interruptible: true

#
# Dev branch
#

linter:
  stage: build
  retry: 0
  script:
    - ./helper.sh lint
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    refs:
      - dev
  interruptible: true

build:
  stage: build
  retry: 0
  script:
    - ./helper.sh build
  cache:
    <<: *global_cache
    policy: pull-push
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    refs:
      - dev

aws-self-hosted:
  stage: tests
  retry: 0
  script:
    - ./helper.sh aws_self_hosted
  dependencies:
    - linter
    - build
  tags:
    - 2cpu-4gmem-0g
  when: always
  only:
    refs:
      - dev
    variables:
      - $TEST_AWS_MANAGED_SERVICES == "true"
      - $TEST_AWS_MANAGED_SERVICES == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 2 week
  interruptible: true

aws-managed-services:
  stage: tests
  retry: 0
  script:
    - ./helper.sh aws_managed_services
  dependencies:
    - linter
    - build
  tags:
    - 2cpu-4gmem-0g
  when: always
  only:
    refs:
      - dev
    variables:
      - $TEST_AWS_MANAGED_SERVICES == "true"
      - $TEST_AWS_MANAGED_SERVICES == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 2 week
  interruptible: true

aws-infra:
  stage: tests
  retry: 0
  script:
    - ./helper.sh aws_infra
  dependencies:
    - linter
    - build
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    refs:
      - dev
    variables:
      - $TEST_AWS_MANAGED_SERVICES == "true"
      - $TEST_AWS_MANAGED_SERVICES == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 2 week
  interruptible: true

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  tags:
    - 2cpu-4gmem-0g
  when: manual
  only:
    refs:
      - dev

#
# Main branch
#

main-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  cache:
    <<: *global_cache
    policy: pull-push
  tags:
    - 2cpu-4gmem-0g
  only:
    refs:
      - main

main-set-ga:
  stage: deploy
  retry: 2
  script:
    - ./helper.sh set_release_ga
  when: manual
  only:
    refs:
      - main

main-deploy_engine:
  stage: deploy
  retry: 0
  script:
    - ./helper.sh release_to_prod
  when: manual
  only:
    refs:
      - main
