image: public.ecr.aws/r3m4q3r9/qovery-ci:b315a61-a5daa79

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: $CI_PROJECT_DIR
  CARGO_HOME: $WORKSPACE_ROOT_DIR/.cargo
  GIT_DEPTH: 10
  ROLLBACK_IMAGE: ""

services:
  - docker:dind

stages:
  - build-and-lint
  - minimal-tests
  - tests
  - deploy
  - deploy-all-clusters

##################
# BUILD AND LINT #
##################

build-and-lint-code:
  stage: build-and-lint
  retry: 0
  script:
    - ./helper.sh lint
    - ./helper.sh build
  when: always
  tags:
    - bm-7cpu-8gmem-0g
  only:
    - merge_requests
  interruptible: true

release-image:
  stage: build-and-lint
  retry: 0
  script:
    - ./helper.sh new_release
  tags:
    - bm-7cpu-12gmem-0g
  when: manual
  interruptible: true
  only:
    - merge_requests

release-image-prod:
  stage: build-and-lint
  retry: 1
  script:
    - ./helper.sh new_release
  tags:
    - bm-7cpu-12gmem-0g
  when: always
  interruptible: true
  only:
    refs:
      - main

gitguardian:
  stage: build-and-lint
  image: gitguardian/ggshield:latest
  retry: 0
  when: always
  only:
    - merge_requests
    - main
  script: ggshield scan ci
  interruptible: true
  tags:
    - vm-250mcpu-1gmem-0g

#################
# MINIMAL TESTS #
#################

unit-tests:
  stage: minimal-tests
  retry: 0
  script:
    - ./helper.sh unit_tests
  tags:
    - bm-2cpu-4gmem-0g
  only:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - build-and-lint-code
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/lib-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

all-minimal-tests:
  stage: minimal-tests
  retry: 0
  timeout: 3 hours
  before_script:
    - docker/wait_docker_available.sh
  script:
    - ./helper.sh all_minimal_tests
  only:
    refs:
      - merge_requests
  tags:
    - bm-2cpu-4gmem-0g
  dependencies:
    - build-and-lint-code
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/lib-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

infra-without-cloud-providers:
  stage: minimal-tests
  before_script:
    - docker/wait_docker_available.sh
  script:
    - ./helper.sh test_local_stack $DOCKER_HOST
  only:
    refs:
      - merge_requests
  dependencies:
    - build-and-lint-code
  tags:
    - bm-2cpu-4gmem-0g

