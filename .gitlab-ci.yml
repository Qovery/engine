# Here is the gitlab CI config for the Qovery Engine
# You can find the kind of instance you can set per job here: https://www.notion.so/qovery/Gitlab-CI-f50907ac7a6b4990a973222250e92111

image: public.ecr.aws/r3m4q3r9/qovery-ci:engine-3fcbbc6aafc93af82c6c298c7979c88ab8734b46

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: $CI_PROJECT_DIR
  GIT_DEPTH: 10

services:
  - docker:dind

stages:
  - build-and-lint
  - minimal-tests
  - tests
  - deploy
  - deploy-all-clusters

##################
# BUILD AND LINT #
##################

build-and-lint-code:
  stage: build-and-lint
  retry: 0
  script:
    - ./helper.sh lint
    - ./helper.sh unused_dependencies
    - ./helper.sh build
  when: always
  tags:
    - bm-7cpu-12gmem-0g
  only:
    - merge_requests
  interruptible: true

build-engine-ci-image:
  stage: build-and-lint
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder "${CI_JOB_NAME}" 7 12
    - ci_helper docker_login_public_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/amd64,linux/arm64
      --target=engine_ci
      -t public.ecr.aws/r3m4q3r9/qovery-ci:engine-${CI_COMMIT_SHA}
      --push .
  tags:
    - vm-1cpu-1gmem-0g
  when: manual
  interruptible: true
  only:
    - merge_requests

release-engine-image:
  stage: build-and-lint
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder "${CI_JOB_NAME}" 7 12
    - ci_helper docker_login_public_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/amd64,linux/arm64
      --build-arg=SCCACHE_REDIS="${CI_SCCACHE_REDIS}"
      -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}
      --push .
  tags:
    - vm-1cpu-1gmem-0g
  when: manual
  interruptible: true
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  - if: $CI_COMMIT_BRANCH == "main"
    when: always
    allow_failure: false

gitguardian:
  stage: build-and-lint
  image: gitguardian/ggshield:latest
  retry: 0
  when: always
  only:
    - merge_requests
    - main
  before_script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
  script: ggshield secret scan ci
  interruptible: true
  tags:
    - vm-250mcpu-1gmem-0g

#################
# MINIMAL TESTS #
#################

unit-tests:
  stage: minimal-tests
  retry: 0
  script:
    - ./helper.sh unit_tests
  tags:
    - bm-2cpu-4gmem-0g
  only:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - build-and-lint-code
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/lib-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

all-minimal-tests:
  stage: minimal-tests
  retry: 1
  timeout: 3 hours
  before_script:
    - ci_helper await_docker_socket
  script:
    - ./helper.sh all_minimal_tests
  only:
    refs:
      - merge_requests
  tags:
    - bm-2cpu-6gmem-0g
  dependencies:
    - build-and-lint-code
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/lib-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

infra-without-cloud-providers:
  stage: minimal-tests
  before_script:
    - ci_helper await_docker_socket
  script:
    - ./helper.sh test_local_stack $DOCKER_HOST
  only:
    refs:
      - merge_requests
  dependencies:
    - build-and-lint-code
  tags:
    - bm-2cpu-8gmem-0g
  interruptible: true

