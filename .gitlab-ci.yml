###########
# RELEASE #
###########

create-multi-arch-image:
  stage: build-final
  extends: [.needs-docker, .resources-image]
  retry: 1
  before_script:
    - ci_helper docker_login_public_prod_ecr
  script:
    - docker buildx imagetools create -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7} public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-amd64 public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-arm64
    - docker buildx imagetools create -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim-amd64 public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim-arm64
  tags:
    - k8s-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^hot-fix/'
      when: always

docker-tag:
  stage: release-tag
  extends: [.needs-docker, .resources-image]
  resource_group: docker-tag-${CI_COMMIT_TAG}
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder "$(echo "${CI_JOB_NAME}" | tr -d ' []:')" 4 20 ${IMAGE_ARCH}
    - ci_helper docker_login_public_prod_ecr
    - ci_helper docker_login_private_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx imagetools create public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7} --tag public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_TAG}
    - docker buildx imagetools create public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim --tag public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_TAG}-slim
  tags:
    - k8s-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: always
      allow_failure: false

gitlab-release:
  stage: release
  extends: [.resources-image]
  retry: 1
  variables:
    GIT_DEPTH: 1
  before_script: |-
    git config --global user.email $GITLAB_USER_EMAIL
    git config --global user.name $GITLAB_USER_LOGIN

  script: |-
    ./helper.sh update_engine_version
    unset GITHUB_TOKEN
    goreleaser release --skip=validate
  

    # Prepare public branch of engine
    mv dist/CHANGELOG.md /tmp/
    mv lib-engine /tmp/
    
    git fetch origin engine-public:engine-public
    git checkout engine-public
    git reset --hard origin/engine-public
    mv /tmp/lib-engine/* .
    mv CHANGELOG.md /tmp/CHANGELOG.md.old
    cat <(cat /tmp/CHANGELOG.md) /tmp/CHANGELOG.md.old | tee CHANGELOG.md
    git add *
    git commit -m "chore(ci): public release"
    git push origin "HEAD:engine-public"

  artifacts:
    paths:
      - CHANGELOG.md
    expire_in: 1 week
  tags:
    - k8s-runner
  rules:
    - if: $CI_COMMIT_TAG
      when: always

