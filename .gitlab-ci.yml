image: qoveryrd/ci:a5918fc-ea81e32

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: /builds/qovery/qovery-engine
  DOCKER_BUILDKIT: 1

services:
  - docker:dind

stages:
  - linting
  - tests
  - build
  - release
  - deploy

# Feat/fix branches

lint-code:
  stage: linting
  retry: 0
  script:
    - ls -lR target
    - ./helper.sh lint
  when: always
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  tags:
    - engine-dedicated
  artifacts:
    paths:
      - target/

wip-fast-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests
  only:
  - merge_requests
  when: always
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  tags:
    - engine-dedicated
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

wip-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  when: manual
  only:
    - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  tags:
    - engine-dedicated
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

# Dev branch

dev-full-test-from-github:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests $LIB_COMMIT_ID
  rules:
    - if: '$TESTS_TYPE == "full"'
  tags:
    - engine-dedicated
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

dev-fast-test-from-github:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests $LIB_COMMIT_ID
  rules:
    - if: '$TESTS_TYPE == "fast"'
  tags:
    - engine-dedicated
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

dev-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  only:
    refs:
      - dev
    variables:
      - $TESTS_TYPE == null
  tags:
    - engine-dedicated
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

dev-fast-tests-sequential:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests_seq
  when: manual
  only:
    refs:
      - dev
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

dev-full-tests-sequential:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests_seq
  when: manual
  only:
    refs:
      - dev
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

dev-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  only:
    refs:
      - dev

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  when: manual
  only:
    refs:
      - dev

# Main branch

main-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  only:
    refs:
      - main

main-set-ga:
  stage: deploy
  retry: 2
  script:
    - ./helper.sh set_release_ga
  when: manual
  only:
    refs:
      - main

main-deploy_engine:
  stage: deploy
  retry: 0
  script:
    - ./helper.sh release_to_prod
  when: manual
  only:
    refs:
      - main
