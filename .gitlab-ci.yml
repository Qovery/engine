upgrade-engine-dev:
  stage: upgrade-dev
  retry: 1
  before_script:
    - apk add bash
  script:
    - $ROLLBACK_IMAGE=$(kubectl -n qovery get statefulset qovery-engine -ojson | jq --raw-output .spec.template.spec.containers[0].image)
    - ./helper.sh upgrade_on_dev || ./helper.sh downgrade_on_dev $ROLLBACK_IMAGE
  tags:
    - vm-1cpu-1gmem-0g
  when: manual
  only:
    refs:
      - dev

e2e-tests:
  stage: e2e-tests
  image: golang:1.16-alpine
  allow_failure: true
  dependencies:
    - upgrade-engine-dev
  tags:
    - vm-2cpu-2gmem-0g
  before_script:
    - apk add bash
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    - ./helper.sh await_docker
  script:
    - apk add --no-cache git build-base
    - mkdir /usr/local/qovery
    - cd /usr/local/qovery
    - git clone https://gitlab.com/qovery/quality-streets.git
    - cd quality-streets/e2e_tests/test
    - go test -timeout 1800s -v
  only:
    refs:
      - dev

downgrade-engine-dev:
  stage: downgrade-dev
  retry: 1
  dependencies:
    - e2e-tests
  before_script:
    - apk add bash
  script:
    - ./helper.sh downgrade_on_dev $ROLLBACK_IMAGE
  tags:
    - vm-1cpu-1gmem-0g
  when: manual
  only:
    refs:
      - dev

