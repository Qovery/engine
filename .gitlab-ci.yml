      - merge_requests
    variables:
      - $CI_MERGE_REQUEST_TITLE !~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      - $CI_MERGE_REQUEST_LABELS =~ /^Tests:.*Quarantine/
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/target/nextest/default/junit.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 2 week
  interruptible: true
  allow_failure: true

