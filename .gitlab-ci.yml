image: qoveryrd/ci:cc55f67074390dedf92c0abd207fc5fbdc789587

variables:
  GIT_SUBMODULE_STRATEGY: recursive

services:
  - docker:dind

stages:
  - tests
  - all-test-remote-lib
  - fast-test-remote-lib
  - build
  - release
  - set_ga
  - deploy_to_qovery_prod

before_script:
  - test -z $KUBERNETES_PORT || export DOCKER_HOST=tcp://127.0.0.1:2375

wip-fast-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests
  only:
  - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results-fast.xml

wip-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  when: manual
  only:
    - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results-full.xml

all-test-from-github:
  stage: all-test-remote-lib
  retry: 0
  script:
    - ./helper.sh all-tests $LIB_COMMIT_ID
  rules:
    - if: '$TEST_TYPE == "full"'
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results-full.xml

fast-test-from-github:
  stage: fast-test-remote-lib
  retry: 0
  script:
    - ./helper.sh fast-tests $LIB_COMMIT_ID
  rules:
    - if: '$TEST_TYPE == "fast"'
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results-fast.xml

dev-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  only:
    refs:
      - dev

dev-fast-tests-sequential:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests_seq
  when: manual
  only:
    refs:
      - dev

dev-full-tests-sequential:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests_seq
  when: manual
  only:
    refs:
      - dev

dev-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  when: manual
  only:
    refs:
      - dev

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  when: manual
  only:
    refs:
      - dev

main-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  only:
    refs:
      - main

main-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  only:
    refs:
      - main

main-set-ga:
  stage: set_ga
  retry: 2
  script:
    - ./helper.sh set_release_ga
  when: manual
  only:
    refs:
      - main

wip-deploy_engine:
  stage: deploy_to_qovery_prod
  retry: 0
  script:
    - ./helper.sh release_to_prod
  when: manual
  only:
    refs:
      - main