image: public.ecr.aws/r3m4q3r9/qovery-ci:df1e5cb-6d6f36c

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: $CI_PROJECT_DIR
  CARGO_HOME: $WORKSPACE_ROOT_DIR/.cargo
  GIT_DEPTH: 10
  ROLLBACK_IMAGE: ""

services:
  - docker:dind

stages:
  - build-and-lint
  - local-test
  - tests
  - upgrade-dev
  - e2e-tests
  - downgrade-dev
  - release
  - deploy
  - deploy-all-clusters

#
# Merge request only
#

gitguardian-mr:
  stage: build-and-lint
  image: gitguardian/ggshield:latest
  retry: 0
  when: always
  script: ggshield scan ci
  tags:
    - vm-250mcpu-1gmem-0g
  only:
    - merge_requests
  interruptible: true

build-and-lint-mr:
  stage: build-and-lint
  retry: 0
  script:
    - ./helper.sh lint
    - ./helper.sh build
  when: always
  tags:
    - bm-2cpu-4gmem-0g
  only:
    - merge_requests
  interruptible: true

release-image-mr:
  stage: build-and-lint
  retry: 1
  script:
    - ./helper.sh new_release
  tags:
    - bm-7cpu-4gmem-0g
  when: manual
  only:
  - merge_requests
  interruptible: true

unit-tests-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh unit_tests
  only:
    - merge_requests
  when: always
  tags:
    - vm-2cpu-4gmem-0g
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - build-and-lint-mr
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/cloned-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

all-self-hosted-mr:
  stage: tests
  retry: 0
  timeout: 3 hours
  script:
    - ./helper.sh all_self_hosted
  only:
  - merge_requests
  when: always
  tags:
    - vm-2cpu-4gmem-0g
