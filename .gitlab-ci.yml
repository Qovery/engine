image: qoveryrd/ci:2fc52f23cf4b8f18f8501be1c6e9d2e05bf0c943

services:
  - docker:dind

stages:
  - build
  - release
  - set_ga

before_script:
  - test -z $KUBERNETES_PORT || export DOCKER_HOST=tcp://127.0.0.1:2375

wip-build:
  stage: build
  retry: 0
  script:
    - ./helper.sh build_image
  except:
    refs:
      - dev
      - master

dev-build:
  stage: build
  retry: 0
  script:
    - ./helper.sh build_image
  only:
    refs:
      - dev

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  only:
    refs:
      - dev

master-build:
  stage: build
  retry: 0
  script:
    - ./helper.sh build_image
  only:
    refs:
      - master

master-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  only:
    refs:
      - master

master-set-ga:
  stage: set_ga
  retry: 2
  script:
    - ./helper.sh set_release_ga
  when: manual
  only:
    refs:
      - master