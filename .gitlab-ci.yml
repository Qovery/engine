# Here is the gitlab CI config for the Qovery Engine
# You can find the kind of instance you can set per job here: https://www.notion.so/qovery/Gitlab-CI-f50907ac7a6b4990a973222250e92111
image: public.ecr.aws/r3m4q3r9/qovery-ci:engine-2025-12-23T15-14-15

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  WORKSPACE_ROOT_DIR: $CI_PROJECT_DIR
  GIT_DEPTH: 10
  # Make Cargo cache paths predictable inside the project workspace
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure

# ------------ Templates (DRY) ------------ #

# Start Docker-in-Docker only when needed
.needs-docker:
  services: [docker:dind]
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: ""
    AWS_EC2_METADATA_DISABLED: "true"

# Reusable Cargo cache for Rust builds/tests
.cargo-cache:
  cache: []
#  cache:
#    key: cargo-${CI_COMMIT_REF_SLUG}
#    paths:
#      - target/
#      - .cargo/.crates.toml
#      - .cargo/.crates2.json
#      - .cargo/bin/
#      - .cargo/registry/index/
#      - .cargo/registry/cache/
#      - .cargo/git/db/

# Reusable artifacts (JUnit + useful logs)
.with-artifacts:
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/target/nextest/default/junit.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 2 weeks

# Factorized buildx init/login/teardown + dind
.buildx:
  extends: [.needs-docker]
  before_script:
    - ci_helper init_buildkit_builder "$(echo "${CI_JOB_NAME}" | tr -d ' []:')" 8 30 ${IMAGE_ARCH}
    - ci_helper docker_login_public_prod_ecr
    - ci_helper docker_login_private_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"

# Resource allocation templates for k8s-runner
.resources-heavy:
  variables:
    KUBERNETES_CPU_REQUEST: "7"
    KUBERNETES_MEMORY_REQUEST: "20Gi"
    KUBERNETES_MEMORY_LIMIT: "20Gi"

.resources-build:
  variables:
    KUBERNETES_CPU_REQUEST: "7"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"

.resources-test:
  variables:
    KUBERNETES_CPU_REQUEST: "3"
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"

.resources-image:
  variables:
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "1Gi"

.resources-minimal:
  variables:
    KUBERNETES_CPU_REQUEST: "250m"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "1Gi"

# Template for test jobs to run in parallel after minimal-tests
.needs-minimal-tests:
  needs:
    - build-and-lint-code
    - azure-minimal-tests
    - job: scw-minimal-tests
      optional: true
    - aws-minimal-tests
    - gcp-minimal-tests
    - infra-without-cloud-providers

# ----------------------------------------- #

stages:
  - build-and-lint
  - build-final
  - minimal-tests
  - tests-aws
  - tests-azure
  - tests-gcp
  - tests-scw
  - tests-quarantine
  - release-tag
  - release
  - deploy-staging
  - deploy-prod

##################
# BUILD AND LINT #
##################

build-and-lint-code:
  stage: build-and-lint
  extends: [.cargo-cache, .resources-heavy]
  retry: 0
  script:
    - ./helper.sh cargo_version
    - ./helper.sh lint
    - ./helper.sh unused_dependencies
    - ./helper.sh build
  tags:
    - k8s-runner
  when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

unit-tests:
  stage: build-and-lint
  extends: [.cargo-cache, .with-artifacts, .resources-build]
  retry: 0
  script:
    - ./helper.sh unit_tests
  tags:
    - k8s-runner
  when: always
  needs: ["build-and-lint-code"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

build-engine-ci-image:
  stage: build-and-lint
  extends: [.needs-docker, .resources-image]
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder "${CI_JOB_NAME}" 4 20
    - ci_helper docker_login_public_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/amd64,linux/arm64
      --target=engine_ci
      -t public.ecr.aws/r3m4q3r9/qovery-ci:engine-$(date +%Y-%m-%dT%H-%M-%S)
      --push .
  tags:
    - k8s-runner
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

release-image:
  stage: build-and-lint
  extends: [.buildx, .resources-image]
  retry: 0
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/${IMAGE_ARCH}
      --cache-from "type=registry,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-${IMAGE_ARCH}"
      --cache-to   "type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-${IMAGE_ARCH}"
      --target=run
      --build-arg CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-${IMAGE_ARCH}
      --push .
  parallel:
    matrix:
      - IMAGE_ARCH: [amd64, arm64]
  tags:
    - k8s-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^hot-fix/'
      when: always
      allow_failure: false

release-image-slim:
  stage: build-and-lint
  extends: [.buildx, .resources-image]
  retry: 0
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/${IMAGE_ARCH}
      --cache-from "type=registry,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-slim-${IMAGE_ARCH}"
      --cache-to   "type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-slim-${IMAGE_ARCH}"
      --target=run-slim
      -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim-${IMAGE_ARCH}
      --push .
  parallel:
    matrix:
      - IMAGE_ARCH: [amd64, arm64]
  tags:
    - k8s-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^hot-fix/'
      when: always
      allow_failure: false

#################
# MINIMAL TESTS #
#################

check-pr-labels-is-set:
  stage: minimal-tests
  extends: [.resources-minimal]
  retry: 0
  script:
    - if [ "$CI_MERGE_REQUEST_LABELS" == "" ] ; then echo "You need to set labels to make the job success" ; exit 1 ; fi
  when: always
  tags:
    - k8s-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

azure-minimal-tests:
  stage: minimal-tests
  extends: [.needs-docker, .with-artifacts, .resources-test]
  retry: 1
  timeout: 3 hours
  before_script:
    - ci_helper await_docker_socket
  script:
    - ./helper.sh azure_minimal_tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - k8s-runner
  dependencies:
    - build-and-lint-code

scw-minimal-tests:
  stage: minimal-tests
