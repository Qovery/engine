# MINIMAL TESTS #
#################

check-pr-labels-is-set:
  stage: minimal-tests
  retry: 0
  script:
    - if [ "$CI_MERGE_REQUEST_LABELS" == "" ] ; then echo "You need to set labels to make the job success" ; exit 1 ; fi
  when: always
  tags:
    - vm-250mcpu-1gmem-0g
  interruptible: true
  only:
    refs:
      - merge_requests

unit-Tests:
  stage: minimal-tests
  retry: 0
  script:
    - ./helper.sh unit_tests
  tags:
    - vm-3cpu-12gmem-0g
  only:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - build-and-lint-code
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/target/nextest/default/junit.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

