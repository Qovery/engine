# Here is the gitlab CI config for the Qovery Engine
# You can find the kind of instance you can set per job here: https://www.notion.so/qovery/Gitlab-CI-f50907ac7a6b4990a973222250e92111
image: public.ecr.aws/r3m4q3r9/qovery-ci:engine-2024-09-06T14-50-33
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: $CI_PROJECT_DIR
  GIT_DEPTH: 10

services:
  - docker:dind

stages:
  - build-and-lint
  - build-final
  - minimal-tests
  - tests
  - tests-quarantine
  - deploy

##################
# BUILD AND LINT #
##################

build-and-lint-code:
  stage: build-and-lint
  retry: 0
  script:
    - ./helper.sh cargo_version
    - ./helper.sh lint
    - ./helper.sh unused_dependencies
    - ./helper.sh build
  when: always
  tags:
    - bm-7cpu-16gmem-0g
  only:
    - merge_requests
  interruptible: true

build-engine-ci-image:
  stage: build-and-lint
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder "${CI_JOB_NAME}" 4 20
    - ci_helper docker_login_public_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/amd64,linux/arm64
      --target=engine_ci
      -t public.ecr.aws/r3m4q3r9/qovery-ci:engine-$(date +%Y-%m-%dT%H-%M-%S)
      --push .
  tags:
    - vm-7cpu-16gmem-0g
  when: manual
  interruptible: true
  only:
    - merge_requests

release-image:
  stage: build-and-lint
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder $(echo "${CI_JOB_NAME}" |  tr -d ' []:') 4 20 ${IMAGE_ARCH}
    - ci_helper docker_login_public_prod_ecr
    - ci_helper docker_login_private_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/${IMAGE_ARCH}
      --cache-from 'type=registry,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-'${IMAGE_ARCH}
      --cache-to 'type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-'${IMAGE_ARCH}
      --target=run
      --build-arg CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-${IMAGE_ARCH}
      --push .
  parallel:
    matrix:
      - IMAGE_ARCH:
          - amd64
          - arm64
  tags:
    - vm-7cpu-16gmem-0g
  when: manual
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
      allow_failure: false

release-image-slim:
  stage: build-and-lint
  retry: 0
  before_script:
    - ci_helper init_buildkit_builder $(echo "${CI_JOB_NAME}" |  tr -d ' []:') 4 20 ${IMAGE_ARCH}
    - ci_helper docker_login_public_prod_ecr
    - ci_helper docker_login_private_prod_ecr
  after_script:
    - ci_helper teardown_buildkit_builder "${CI_JOB_NAME}"
  script:
    - eval $(ci_helper print_aws_ctx 'CI_BUILDER')
    - docker buildx build --platform=linux/${IMAGE_ARCH}
      --cache-from 'type=registry,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-slim-'${IMAGE_ARCH}
      --cache-to 'type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=283389881690.dkr.ecr.eu-west-3.amazonaws.com/engine:cache-slim-'${IMAGE_ARCH}
      --target=run-slim
      --build-arg CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}-slim
      -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim-${IMAGE_ARCH}
      --push .
  parallel:
    matrix:
      - IMAGE_ARCH:
          - amd64
          - arm64
  tags:
    - vm-7cpu-16gmem-0g
  when: manual
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
      allow_failure: false


create-multi-arch-image:
  stage: build-final
  retry: 2
  dependencies:
    - release-image
    - release-image-slim
  before_script:
    - ci_helper docker_login_public_prod_ecr
  script:
    - docker buildx imagetools create -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7} public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-amd64 public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-arm64
    - docker buildx imagetools create -t public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim-amd64 public.ecr.aws/r3m4q3r9/engine:${CI_COMMIT_SHA:0:7}-slim-arm64
  tags:
    - vm-7cpu-16gmem-0g
  only:
    refs:
      - main
  when: always
