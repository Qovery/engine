image: qoveryrd/ci:6ffaa74-31b20d3
variables:
  GIT_SUBMODULE_STRATEGY: recursive

services:
  - docker:dind

stages:
  - tests
  - build
  - release
  - deploy

before_script:
  - test -z $KUBERNETES_PORT || export DOCKER_HOST=tcp://127.0.0.1:2375

# Feat/fix branches

wip-fast-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests
  only:
  - merge_requests
  when: always
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

wip-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  when: manual
  only:
    - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

# Dev branch

dev-full-test-from-github:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests $LIB_COMMIT_ID
  rules:
    - if: '$TESTS_TYPE == "full"'
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

dev-fast-test-from-github:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests $LIB_COMMIT_ID
  rules:
    - if: '$TESTS_TYPE == "fast"'
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

dev-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  only:
    refs:
      - dev
    variables:
      - $TESTS_TYPE == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

dev-fast-tests-sequential:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests_seq
  when: manual
  only:
    refs:
      - dev
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

dev-full-tests-sequential:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests_seq
  when: manual
  only:
    refs:
      - dev
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml

dev-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  only:
    refs:
      - dev

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  when: manual
  only:
    refs:
      - dev

# Main branch

main-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  only:
    refs:
      - main

main-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  only:
    refs:
      - main

main-set-ga:
  stage: deploy
  retry: 2
  script:
    - ./helper.sh set_release_ga
  when: manual
  only:
    refs:
      - main

main-deploy_engine:
  stage: deploy
  retry: 0
  script:
    - ./helper.sh release_to_prod
  when: manual
  only:
    refs:
      - main
