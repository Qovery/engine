image: qoveryrd/ci:a5918fc-ea81e32

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: /builds/qovery/qovery-engine
  DOCKER_BUILDKIT: 1
  CARGO_HOME: $WORKSPACE_ROOT_DIR/.cargo

services:
  - docker:dind

stages:
  - linter
  - tests
  - build
  - release
  - deploy

#
# Merge request only
#

lint-code-mr:
  stage: linter
  retry: 0
  script:
    - ./helper.sh lint
    - ./helper.sh build_image
  when: always
  tags:
    - qovery-2cpu-8gb
  only:
    - merge_requests

all-self-hosted-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_self_hosted
  only:
  - merge_requests
  when: always
  tags:
    - qovery-2cpu-8gb
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - lint-code
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

all-managed-services-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_managed_services
  only:
    - merge_requests
  when: manual
  tags:
    - qovery-2cpu-8gb
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - lint-code
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

test-all-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh test_all
  only:
    - merge_requests
  dependencies:
    - lint-code
  when: manual
  tags:
    - qovery-2cpu-12gb
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 1 week

#
# Dev branch
#

lint-code:
  stage: linter
  retry: 0
  script:
    - ./helper.sh lint
    - ./helper.sh build_image
  when: always
  tags:
    - qovery-2cpu-8gb
  only:
    refs:
      - dev

aws-self-hosted:
  stage: tests
  retry: 0
  script:
    - ./helper.sh aws_self_hosted
  dependencies:
    - lint-code
  tags:
    - qovery-2cpu-4gb
  when: always
  only:
    refs:
      - dev
    variables:
      - $TEST_AWS_MANAGED_SERVICES == "true"
      - $TEST_AWS_MANAGED_SERVICES == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 2 week

aws-managed-services:
  stage: tests
  retry: 0
  script:
    - ./helper.sh aws_managed_services
  dependencies:
    - lint-code
  tags:
    - qovery-2cpu-4gb
  when: always
  only:
    refs:
      - dev
    variables:
      - $TEST_AWS_MANAGED_SERVICES == "true"
      - $TEST_AWS_MANAGED_SERVICES == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 2 week

aws-infra:
  stage: tests
  retry: 0
  script:
    - ./helper.sh aws_infra
  dependencies:
    - lint-code
  when: always
  tags:
    - qovery-2cpu-4gb
  only:
    refs:
      - dev
    variables:
      - $TEST_AWS_MANAGED_SERVICES == "true"
      - $TEST_AWS_MANAGED_SERVICES == null
  artifacts:
    when: always
    reports:
      junit: /builds/qovery/qovery-engine/cloned-engine/results.xml
    paths:
      - /builds/qovery/qovery-engine/gitlab-log-utilities/output/*
      - /builds/qovery/qovery-engine/.qovery-workspace
    expire_in: 2 week

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  when: manual
  only:
    refs:
      - dev

#
# Main branch
#

main-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  tags:
    - qovery-2cpu-4gb
  only:
    refs:
      - main

main-set-ga:
  stage: deploy
  retry: 2
  script:
    - ./helper.sh set_release_ga
  tags:
    - qovery-2cpu-4gb
  when: manual
  only:
    refs:
      - main

main-deploy_engine:
  stage: deploy
  retry: 0
  script:
    - ./helper.sh release_to_prod
  when: manual
  tags:
    - qovery-2cpu-4gb
  only:
    refs:
      - main
