image: qoveryrd/ci:f6bf8e0099d208789027d571b783e466d0b3f1e8

variables:
  GIT_SUBMODULE_STRATEGY: recursive

services:
  - docker:dind

stages:
  - tests
  - build
  - release
  - set_ga
  - deploy_to_qovery_prod

before_script:
  - test -z $KUBERNETES_PORT || export DOCKER_HOST=tcp://127.0.0.1:2375

wip-fast-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh fast_tests
  only:
  - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/

wip-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  when: manual
  only:
    - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/

dev-full-tests:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_tests
  only:
    refs:
      - dev

dev-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  when: manual
  only:
    refs:
      - dev

dev-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  when: manual
  only:
    refs:
      - dev

master-build:
  stage: build
  retry: 1
  script:
    - ./helper.sh build_image
  only:
    refs:
      - master

master-release:
  stage: release
  retry: 1
  script:
    - ./helper.sh new_release
  only:
    refs:
      - master

master-set-ga:
  stage: set_ga
  retry: 2
  script:
    - ./helper.sh set_release_ga
  when: manual
  only:
    refs:
      - master

wip-deploy_engine:
  stage: deploy_to_qovery_prod
  retry: 0
  script:
    - ./helper.sh release_to_prod
  when: manual
  only:
    refs:
      - master