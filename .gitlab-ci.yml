image: public.ecr.aws/r3m4q3r9/qovery-ci:67b21e4-97d31ad

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  WORKSPACE_ROOT_DIR: $CI_PROJECT_DIR
  CARGO_HOME: $WORKSPACE_ROOT_DIR/.cargo
  GIT_DEPTH: 10
  ROLLBACK_IMAGE: ""

#cache: &global_cache
#  key: ${CI_COMMIT_REF_SLUG}
#  paths:
#    - $CARGO_HOME
#    - $WORKSPACE_ROOT_DIR/target
#  policy: pull

services:
  - docker:dind

stages:
  - build
  - tests
  - upgrade-dev
  - e2e-tests
  - downgrade-dev
  - release
  - deploy
  - deploy-all-clusters

#
# Merge request only
#

linter-mr:
  stage: build
  retry: 0
  script:
    - ./helper.sh lint
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    - merge_requests
  interruptible: true

build-mr:
  stage: build
  retry: 0
  script:
    - ./helper.sh build
  when: always
  tags:
    - 2cpu-4gmem-0g
  only:
    - merge_requests
  interruptible: true

all-self-hosted-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_self_hosted
  only:
  - merge_requests
  when: always
  tags:
    - 2cpu-4gmem-0g
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - linter-mr
    - build-mr
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/cloned-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

all-managed-services-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh all_managed_services
  only:
    - merge_requests
  when: manual
  tags:
    - 2cpu-4gmem-0g
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  dependencies:
    - linter-mr
    - build-mr
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/cloned-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true

test-all-mr:
  stage: tests
  retry: 0
  script:
    - ./helper.sh test_all
  only:
    - merge_requests
  dependencies:
    - linter-mr
    - build-mr
  when: manual
  tags:
    - qovery-2cpu-12gb
  except:
    variables:
      - $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      - $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
  artifacts:
    when: always
    reports:
      junit: $CI_PROJECT_DIR/cloned-engine/results.xml
    paths:
      - $CI_PROJECT_DIR/gitlab-log-utilities
      - $CI_PROJECT_DIR/.qovery-workspace
    expire_in: 1 week
  interruptible: true


