{%- if k8s_deploy_api_gateway == true %}
{% for namespace_key, gateway_http_routes in gateway_http_routes_per_namespace %}
{%- if gateway_http_routes|length >= 1 %}
{#
  Create one BackendTrafficPolicy per HTTPRoute part.
#}
{%- set num_routes = gateway_http_routes|length %}
{%- for route in gateway_http_routes %}
{%- set route_index = loop.index0 %}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ sanitized_name }}-traffic-policy{%- if num_routes > 1 %}-{{ route_index + 1 }}{%- endif %}
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/router-name: {{ sanitized_name }}
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ sanitized_name }}{%- if num_routes > 1 %}-{{ route_index + 1 }}{%- endif %}
  {%- if advanced_settings.network_gateway_api_sticky_session_enable == true %}
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      {%- if advanced_settings.network_gateway_api_sticky_session_type.Header is defined %}
      # Header-based affinity — use this when clients cannot persist cookies
      # across requests (e.g. MCP SDK clients keying off Mcp-Session-Id).
      type: Header
      header:
        name: {{ advanced_settings.network_gateway_api_sticky_session_type.Header.name }}
      {%- elif advanced_settings.network_gateway_api_sticky_session_type == "SourceIP" %}
      type: SourceIP
      {%- else %}
      type: Cookie
      cookie:
        name: INGRESSCOOKIE_QOVERY
        ttl: 85400s # 1 day
        attributes:
          secure: "true"
          samesite: Lax
      {%- endif %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_route_limit_rpm or advanced_settings.network_gateway_api_route_limit_rps %}
  rateLimit:
    type: Local
    local:
      rules:
      {%- if advanced_settings.network_gateway_api_route_limit_rpm %}
      # RPM limit
      - limit:
          requests: {{ advanced_settings.network_gateway_api_route_limit_rpm }}
          unit: Minute
        clientSelectors:
        {%- if advanced_settings.network_gateway_api_route_limit_source_cidrs %}
        {%- for h in advanced_settings.network_gateway_api_route_limit_source_cidrs | split(pat=",") %}
        - sourceCIDR:
            value: "{{ h | trim }}"
            type: Distinct
        {%- endfor %}
        {%- else %}
        - sourceCIDR:
            value: "0.0.0.0/0"
            type: Distinct
        {%- endif %}
        {%- if advanced_settings.network_gateway_api_route_limit_headers %}
        - headers:
          {%- for h in advanced_settings.network_gateway_api_route_limit_headers | split(pat=",") %}
          - name: "{{ h | trim }}"
            type: Distinct
          {%- endfor %}
        {%- endif %}
      {%- endif %}
      {%- if advanced_settings.network_gateway_api_route_limit_rps %}
      # RPS limit
      - limit:
          requests: {{ advanced_settings.network_gateway_api_route_limit_rps }}
          unit: Second
        clientSelectors:
        {%- if advanced_settings.network_gateway_api_route_limit_source_cidrs %}
        {%- for h in advanced_settings.network_gateway_api_route_limit_source_cidrs | split(pat=",") %}
        - sourceCIDR:
            value: "{{ h | trim }}"
            type: Distinct
        {%- endfor %}
        {%- else %}
        - sourceCIDR:
            value: "0.0.0.0/0"
            type: Distinct
        {%- endif %}
        {%- if advanced_settings.network_gateway_api_route_limit_headers %}
        - headers:
          {%- for h in advanced_settings.network_gateway_api_route_limit_headers | split(pat=",") %}
          - name: "{{ h | trim }}"
            type: Distinct
          {%- endfor %}
        {%- endif %}
      {%- endif %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_custom_http_errors is defined and advanced_settings.network_gateway_api_custom_http_errors %}
  responseOverride:
    {%- for code in advanced_settings.network_gateway_api_custom_http_errors | split(pat=",") %}
    - match:
        statusCodes:
          - type: Value
            value: {{ code | trim }}
      response:
        contentType: text/html
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: {{ sanitized_name }}-error-pages
            key: {{ code | trim }}.html
    {%- endfor %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_circuit_breaker_max_connections or advanced_settings.network_gateway_api_circuit_breaker_max_pending_requests or advanced_settings.network_gateway_api_circuit_breaker_max_parallel_requests %}
  circuitBreaker:
    {%- if advanced_settings.network_gateway_api_circuit_breaker_max_connections %}
    maxConnections: {{ advanced_settings.network_gateway_api_circuit_breaker_max_connections }}
    {%- endif %}
    {%- if advanced_settings.network_gateway_api_circuit_breaker_max_pending_requests %}
    maxPendingRequests: {{ advanced_settings.network_gateway_api_circuit_breaker_max_pending_requests }}
    {%- endif %}
    {%- if advanced_settings.network_gateway_api_circuit_breaker_max_parallel_requests %}
    maxParallelRequests: {{ advanced_settings.network_gateway_api_circuit_breaker_max_parallel_requests }}
    {%- endif %}
  {%- endif %}
  {%- if resolved_gateway_api_retry_num_retries or resolved_gateway_api_retry_num_retries == 0 %}
  retry:
    numRetries: {{ resolved_gateway_api_retry_num_retries }}
    {%- if resolved_gateway_api_retry_per_try_timeout_seconds or resolved_gateway_api_retry_per_try_timeout_seconds == 0 %}
    perRetry:
      timeout: {{ resolved_gateway_api_retry_per_try_timeout_seconds }}s
    {%- endif %}
    {%- if resolved_gateway_api_retry_retry_on_triggers | length > 0 or resolved_gateway_api_retry_http_status_codes | length > 0 %}
    retryOn:
      {%- if resolved_gateway_api_retry_retry_on_triggers | length > 0 %}
      triggers:
        {%- for trigger in resolved_gateway_api_retry_retry_on_triggers %}
        - {{ trigger }}
        {%- endfor %}
      {%- endif %}
      {%- if resolved_gateway_api_retry_http_status_codes | length > 0 %}
      httpStatusCodes:
        {%- for status_code in resolved_gateway_api_retry_http_status_codes %}
        - {{ status_code }}
        {%- endfor %}
      {%- endif %}
    {%- endif %}
  {%- endif %}
  {%- set service_request_timeout = advanced_settings.network_gateway_api_http_request_timeout_seconds %}
  {%- set service_idle_timeout = advanced_settings.network_gateway_api_http_connection_idle_timeout_seconds %}
  {%- set service_max_stream_duration = advanced_settings.network_gateway_api_http_max_stream_duration_seconds %}
  {%- set cluster_request_timeout = cluster_envoy_gateway_api_http_request_timeout_seconds %}
  {%- set cluster_idle_timeout = cluster_envoy_gateway_api_http_connection_idle_timeout_seconds %}
  {%- set cluster_max_stream_duration = cluster_envoy_gateway_api_http_max_stream_duration_seconds %}
  {%- if service_request_timeout or service_idle_timeout or service_max_stream_duration or cluster_request_timeout or cluster_idle_timeout or cluster_max_stream_duration %}
  timeout:
    http:
      {%- if service_request_timeout %}
      requestTimeout: {{ service_request_timeout }}s
      {%- elif cluster_request_timeout %}
      requestTimeout: {{ cluster_request_timeout }}s
      {%- endif %}
      {%- if service_idle_timeout %}
      connectionIdleTimeout: {{ service_idle_timeout }}s
      {%- elif cluster_idle_timeout %}
      connectionIdleTimeout: {{ cluster_idle_timeout }}s
      {%- endif %}
      {%- if service_max_stream_duration %}
      maxStreamDuration: {{ service_max_stream_duration }}s
      {%- elif cluster_max_stream_duration %}
      maxStreamDuration: {{ cluster_max_stream_duration }}s
      {%- endif %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_tcp_keepalive_idle_time_seconds or advanced_settings.network_gateway_api_tcp_keepalive_interval_seconds %}
  tcpKeepalive:
    {%- if advanced_settings.network_gateway_api_tcp_keepalive_idle_time_seconds %}
    idleTime: {{ advanced_settings.network_gateway_api_tcp_keepalive_idle_time_seconds }}s
    {%- endif %}
    {%- if advanced_settings.network_gateway_api_tcp_keepalive_interval_seconds %}
    interval: {{ advanced_settings.network_gateway_api_tcp_keepalive_interval_seconds }}s
    {%- endif %}
    probes: 3
  {%- endif %}
{%- endfor %}
{%- endif %}
{%- endfor %}
{%- endif %}
