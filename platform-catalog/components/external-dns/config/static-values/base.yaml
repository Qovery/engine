# Source 1 — reviewed Qovery DNS behavior for Services and the Gateway API stack.
annotationFilter: "external-dns.alpha.kubernetes.io/exclude notin (true)"
triggerLoopOnEvent: true
policy: sync
txtPrefix: qvy-

deploymentStrategy:
  type: RollingUpdate
image:
  repository: public.ecr.aws/r3m4q3r9/pub-mirror-external-dns
provider: pdns
sources:
  - service
  - gateway-httproute
  - gateway-grpcroute
# HACK(QOV-2106): ExternalDNS still watches TLSRoute through the deprecated v1alpha2 API,
# while the installed Gateway API CRDs serve it only at v1. Re-enable gateway-tlsroute after
# https://github.com/kubernetes-sigs/external-dns/issues/6247 is fixed upstream and the chart is bumped.
# Envoy Gateway installs ListenerSet through envoy-gateway-crd.
enableGatewayListenerSets: true

extraArgs:
  pdns-api-key: "$(PDNS_API_KEY)"
env:
  - name: PDNS_API_KEY
    valueFrom:
      secretKeyRef:
        name: external-dns-secret
        key: pdns_api_key

serviceMonitor:
  enabled: false
resources:
  limits:
    cpu: 50m
    memory: 100Mi
  requests:
    cpu: 50m
    memory: 100Mi
