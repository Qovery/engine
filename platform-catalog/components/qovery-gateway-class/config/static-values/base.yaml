# Source 1 — public and private Qovery GatewayClass defaults from the legacy demo chart values.
# HACK(QOV-2454): Pin each proxy directly to preserve Replace semantics without mergeType.
# Remove once Envoy Gateway ships the patched Envoy image by default.
# https://qovery.atlassian.net/browse/QOV-2454
envoyImage: docker.io/envoyproxy/envoy:distroless-v1.39.5

gatewayClass:
  qoveryPublic:
    enable: true
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: null
      targetMemoryUtilizationPercentage: null
    accessLog:
      format: ""
    affinity: {}
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
        topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
        topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
    tolerations: []
    pdb:
      enabled: true
      minAvailable: null
      maxUnavailable: 1
  qoveryPrivate:
    enable: true
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: null
      targetMemoryUtilizationPercentage: null
    accessLog:
      format: ""
    affinity: {}
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
        topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
        topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
    tolerations: []
    pdb:
      enabled: true
      minAvailable: null
      maxUnavailable: 1
