# Synthetic legacy effective values. No live cluster identifiers or credentials.
clusterName: example-eks
securityGroupId: sg-0123456789abcdef0
amiSelectorTermsAlias: al2023@v20250807
diskSize: 50Gi
diskIops: 3500
diskThroughput: 200
storageClass: gp3
explicitSubnetIds:
  - subnet-0123456789abcdef0
  - subnet-0123456789abcdef1
global_node_pools:
  terminationGracePeriod: 8h
tags:
  ClusterId: "11111111"
  ClusterLongId: 11111111-1111-4111-8111-111111111111
  OrganizationId: "22222222"
  OrganizationLongId: 22222222-2222-4222-8222-222222222222
  Region: eu-west-3
  aws-apn-id: pc:synthetic-example
  Owner: platform-team
defaultNodePool:
  requirements:
    - {key: kubernetes.io/arch, operator: In, values: [amd64, arm64]}
    - {key: karpenter.k8s.aws/instance-family, operator: In, values: [m6i, m6g]}
    - {key: karpenter.k8s.aws/instance-size, operator: In, values: [large, xlarge]}
    - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
  consolidateAfter: 2m
  limits: {maxCpu: "160", maxMemory: 640Gi}
stableNodePool:
  requirements:
    - {key: kubernetes.io/arch, operator: In, values: [amd64, arm64]}
    - {key: karpenter.k8s.aws/instance-family, operator: In, values: [m6i, m6g]}
    - {key: karpenter.k8s.aws/instance-size, operator: In, values: [large, xlarge]}
    - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
  consolidateAfter: 45s
  limits: {maxCpu: "80", maxMemory: 320Gi}
  consolidation:
    budgets:
      - {nodes: "0", reasons: [Underutilized], duration: 24h, schedule: "0 0 * * *"}
