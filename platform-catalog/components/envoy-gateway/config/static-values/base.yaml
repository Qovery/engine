# Source 1 — the reviewed demo and BYOK-safe Envoy Gateway controller configuration.
global:
  images:
    envoyProxy:
      # HACK(QOV-2454): Remove once Envoy Gateway ships the patched Envoy image by default.
      # https://qovery.atlassian.net/browse/QOV-2454
      image: docker.io/envoyproxy/envoy:distroless-v1.39.5

config:
  envoyGateway:
    gateway:
      controllerName: qovery.com/gateway-controller
    extensionApis:
      enableLua: true
    logging:
      level:
        default: warn

# CRDs are owned by the dedicated envoy-gateway-crd release so upgrades are explicit.
crds:
  enabled: false

service:
  annotations: {}

hpa:
  enabled: false

deployment:
  replicas: 1
  envoyGateway:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

podDisruptionBudget:
  maxUnavailable: 1
