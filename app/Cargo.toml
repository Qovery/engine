[package]
name = "app"
version = "0.1.0"
authors = ["Romaric Philogene <evoxmusic@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "engine_grpc"
path = "src/main_grpc.rs"

[features]
default = []

# To split from unit tests
unit-tests = []
test-functional = []
test-full = ["test-functional"]


[dependencies]
qovery-engine = { path = "../lib-engine" }
crossbeam-channel = "0.5.8"
serde_json = "1.0.105"
uuid = { version = "1.4.1", features = ["v4", "serde"] }
chrono = "0.4.28"
ctrlc = { version = "3.4.1", features = ["termination"] } # sig term handler wrapper
retry = "2.0.0"
dirs = "5.0.1"
url = "2.4.1"
regex = "1"
anyhow = "1.0.75"
scopeguard = "1.2.0"
reqwest = { version = "0.11.20", features = ["blocking", "json", "gzip"] }
serde = "1.0.188"
clap = { version = "4.4.2", features = ["derive", "env"] }

# Webserver (For Prometheus, Healthcheck, ...)
tokio = { version = "1.32.0", features = ["full"] }
tokio-stream = "0.1.14"
warp = "0.3.5"
once_cell = "1.18.0"
prometheus = { git = "https://github.com/tikv/rust-prometheus", rev = "ac86a264223c8d918a43e739ca3c48bb4aaedb90", features = ["process"] }

# Kubernetes
kube = { version = "0.88.1", features = ["default"] }
k8s-openapi = { version = "0.21.1", default-features = false, features = ["v1_27"] }

# GRPC
tonic = { version = "0.10.0", features = ["tls", "tls-roots", "gzip", "transport"] }
prost = "0.12.1"
prost-types = "0.12.1"
tower = "0.4.13"
futures-util = "0.3.28"

# tracing
tracing = { version = "0.1.37", features = ["log"] }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "fmt", "local-time"] }
tracing-appender = "0.2.3"

# To load .env file into env variables
dotenv = "0.15.0"
# To get build info (commit, version, ...) at runtime
shadow-rs = { version = "0.31.1", features = [] }

[dev-dependencies]
reqwest = { version = "0.11.20", features = ["blocking"] }


[build-dependencies]
tonic-build = { version = "0.10.0", features = ["prost"] }
shadow-rs = { version = "0.31.1", features = [] }
