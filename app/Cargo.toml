[package]
name = "app"
version = "0.1.0"
authors = ["Romaric Philogene <evoxmusic@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "engine_grpc"
path = "src/main_grpc.rs"

[features]
default = []

# To split from unit tests
unit-tests = []
test-functional = []
test-full = ["test-functional"]


[dependencies]
qovery-engine = { path = "../lib-engine" }
crossbeam-channel = "0.5.4"
serde_json = "1.0.81"
uuid = { version = "1.0.0", features = ["v4", "serde"] }
chrono = "0.4.19"
ctrlc = { version = "3.2.2", features = ["termination"] } # sig term handler wrapper
retry = "1.3.1"
dirs = "4.0.0"
url = "2.2.2"
regex = "1"
anyhow = "1.0.68"
scopeguard = "1.1.0"
reqwest = { version = "0.11.14", features = ["blocking", "json", "gzip"] }
serde = "1.0.152"

# Webserver (For Prometheus, Healthcheck, ...)
tokio = { version = "1.23.0", features = ["full"] }
tokio-stream = "0.1.11"
warp = "0.3.2"
lazy_static = "1.4.0"
prometheus = { git = "https://github.com/tikv/rust-prometheus", rev = "ac86a264223c8d918a43e739ca3c48bb4aaedb90", features = ["process"] }

# GRPC
tonic = { version = "0.8.3", features = ["tls", "tls-roots", "gzip", "transport"] }
prost = "0.11.5"
prost-types = "0.11.5"
tower = "0.4.13"
futures-util = "0.3.25"

# tracing
tracing = { version = "0.1.26", features = ["log"] }
tracing-subscriber = { version = "0.2.18", features = ["env-filter"] }

# To load .env file into env variables
dotenv = "0.15.0"

[dev-dependencies]
reqwest = { version = "0.11.10", features = ["blocking"] }


[build-dependencies]
tonic-build = { version = "0.8.4", features = ["prost"] }
