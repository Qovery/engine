[package]
name = "app"
version = "0.1.0"
authors = ["Romaric Philogene <evoxmusic@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "engine_grpc"
path = "src/main_grpc.rs"

[[bin]]
name = "engine_post_renderer"
path = "src/main_post_renderer.rs"

[features]
default = []

# To split from unit tests
unit-tests = []
test-functional = []
test-full = ["test-functional"]


[dependencies]
qovery-engine = { path = "../lib-engine" }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = "0.4.41"
dirs = "6.0.0"
retry = "2.1.0"
url = "2.5.4"
anyhow = "1.0.98"
scopeguard = "1.2.0"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "gzip", "zstd", "rustls-tls-native-roots-no-provider"] }
serde = "1.0.219"
serde_yaml = "0.9.34"
clap = { version = "4.5.38", features = ["derive", "env"] }
rustls = "0.23.27"

# Webserver (For Prometheus, Healthcheck, ...)
tokio = { version = "1.45.0", features = ["full"] }
tokio-stream = "0.1.17"
warp = "0.3.7"
once_cell = "1.21.3"
prometheus = { git = "https://github.com/tikv/rust-prometheus", rev = "ac86a264223c8d918a43e739ca3c48bb4aaedb90", features = ["process"] }

# Kubernetes
kube = { version = "1.0.0", features = ["default"] }
k8s-openapi = { version = "0.25.0", default-features = false, features = ["v1_31"] }

# GRPC
tonic = { version = "0.13.1", features = ["tls-aws-lc", "tls-native-roots", "zstd"] }
prost = "0.13.5"
prost-types = "0.13.5"
tower = "0.5.2"
futures-util = "0.3.31"

# tracing
tracing = { version = "0.1.41", features = ["log"] }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "local-time"] }
tracing-appender = "0.2.3"

# To load .env file into env variables
dotenv = "0.15.0"
# To get build info (commit, version, ...) at runtime
shadow-rs = { version = "1.1.1", features = [] }
serde_path_to_error = "0.1.17"

[dev-dependencies]
reqwest = { version = "0.12.15", features = ["blocking"] }
hyper-util = { version = "0.1.11", features = ["tokio"] }
tower = { version = "0.5.2", features = ["util"] }


[build-dependencies]
tonic-build = { version = "0.13.1", features = ["prost"] }
shadow-rs = { version = "1.1.1", features = [] }
