charts:
  - name: cert-manager
    version: v0.16.0
    repo_name: jetstack
  - name: external-dns
    repo_name: bitnami
    version: 3.4.0
  - name: fluent-bit
    repo_name: lifen
    version: 2.8.0
    no_sync: true
    comment: |
      Fluent bit should be removed in favor to loki stack
      Custom stuff have been made to be able to support ES managed by AWS
  - name: grafana
    version: 5.3.4
    no_sync: true
    comment: |
      Dashboard have been set into it as the chart suggest but it's a problem with helm-freeze
      Need to look if we can move them out of this repo
  - name: nginx-ingress
    version: 1.35.0
  - name: prometheus-operator
    version: 8.15.12
  - name: elasticsearch-curator
    version: 2.1.5
  - name: aws-node-termination-handler
    repo_name: aws
    dest: aws-bootstrap
    version: 0.8.0
  - name: aws-vpc-cni
    repo_name: aws
    dest: aws-bootstrap
    version: 1.0.9
  - name: aws-calico
    repo_name: aws
    dest: aws-bootstrap
    version: 0.3.1

repos:
  - name: stable
    url: https://kubernetes-charts.storage.googleapis.com
  - name: jetstack
    url: https://charts.jetstack.io
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: lifen
    url: https://honestica.github.io/lifen-charts
  - name: aws
    url: https://aws.github.io/eks-charts

destinations:
  - name: default
    path: common/bootstrap/charts
  - name: aws-bootstrap
    path: aws/bootstrap/charts

