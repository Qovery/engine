apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ required "auth.rootPassword is required" .Values.auth.rootPassword | b64enc | quote }}
  mysql-password: {{ required "auth.password is required" .Values.auth.password | b64enc | quote }}
