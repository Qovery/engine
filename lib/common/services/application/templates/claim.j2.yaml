---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ s.id }}
  namespace: {{ project_id }}
  labels:
    ownerId: {{ owner_id }}
    envId: {{ environment_id }}
    appId: {{ id }}
    diskId: {{ s.id }}
    diskType: {{ s.storage_type }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-ebs-{{ s.storage_type }}-{{ s.snapshot_retention_in_days }}
  resources:
    requests:
      storage: {{ s.size_in_gib }}Gi
#{%- endif %}
{%- endfor %}
