apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
  labels:
    ownerId: {{ owner_id }}
    envId: {{ environment_id }}
    appId: {{ id }}
spec:
  replicas: {{ total_instances }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      ownerId: {{ owner_id }}
      envId: {{ environment_id }}
      appId: {{ id }}
  template:
    metadata:
      labels:
        ownerId: {{ owner_id }}
        envId: {{ environment_id }}
        appId: {{ id }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {}
      containers:
        - name: {{ get_image_name(application_index) }}-{{ environment_id }}
          image: "{{ get_image_fullname(application_index) }}"
          env:
            {%- for key, value in environment_variables %}
            - name: {{ key }}
              value: {{ value }}
            {%- endfor %}
            {%- if is_private_port %}
          ports:
            - containerPort: {{ private_port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ private_port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ private_port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            {%- endif %}
          resources:
            limits:
              cpu: 125m
              memory: 256Mi
            requests:
              cpu: 125m
              memory: 256Mi
          volumeMounts:
{%- for s in storage %}
            - name: {{ s.id }}
              mountPath: {{ s.mount_point }}
{%- endfor %}
      volumes:
{%- for s in storage %}
        - name: {{ s.id }}
          persistentVolumeClaim:
            claimName: {{ s.id }}
{%- endfor %}
