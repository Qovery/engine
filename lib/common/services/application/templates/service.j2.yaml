{%- if qovery_env.applications[application_index]['private_port'] %}
apiVersion: v1
kind: Service
metadata:
  name: {{ applications[application_index]['id'] }}-{{ environment_id }}
  namespace: {{ project_id }}
  labels:
    ownerId: {{ owner_id }}
    appId: {{ applications[application_index]['id'] }}
    envId: {{ environment_id }}
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: {{ applications[application_index]['private_port'] }}
      targetPort: {{ applications[application_index]['private_port'] }}
  selector:
    ownerId: {{ owner_id }}
    appId: {{ applications[application_index]['id'] }}
    envId: {{ environment_id }}
{% endif %}
