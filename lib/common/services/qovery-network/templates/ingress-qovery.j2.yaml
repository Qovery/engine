{%- if qovery_env.routers|length > 0 %}
{%- for router in qovery_env.routers %}
{%- if router.public_port and router['routes'] and router['default_domain'] %}
---
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ router.name }}-{{ environment_id }}
  namespace: {{ project_id }}
  labels:
    ownerId: {{ owner_id }}
    routerId: {{ router.name }}
    envId: {{ environment_id }}
    fqdn: "{{ router['default_domain'] }}"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ router['default_domain'] }}
    external-dns.alpha.kubernetes.io/ttl: "300"
    external-dns.alpha.kubernetes.io/target: "{{ get_ingress_fqdn('nginx-ingress') }}"
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-qovery
    kubernetes.io/ingress.class: "nginx-qovery"
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - {{ router['default_domain'] }}
      secretName: le-{{ get_domain_id(router['default_domain']) }}-qovery-cert
  rules:
    - host: "{{ router['default_domain'] }}"
      http:
        paths:
        {%- for route in router['routes'] %}
        {% set application = qovery_env.get_application_by_name(route['application_name']) %}
          - path: {{ route['path'] }}
            backend:
              serviceName: "{{ application['id'] }}-{{ environment_id }}"
              servicePort: {{ application['private_port'] }}
        {%- endfor %}
{%- endif %}
{%- endfor %}
{%- endif %}
