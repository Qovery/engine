{%- if k8s_deploy_api_gateway == true %}
{%- if k8s_deploy_listenerset == true %}
{%- if certificate_alternative_names|length > 0 %}
{%- for namespace_key, http_hosts in http_hosts_per_namespace_gateway %}
{%- if http_hosts|length >= 1  %}
---
# Allow ListenerSet from this namespace to attach to the cluster gateway
{%- if k8s_use_v1beta1_reference_grant == true %}
apiVersion: gateway.networking.k8s.io/v1beta1 # To be removed once v1 is widely supported in GKE autopilot
{%- else %}
apiVersion: gateway.networking.k8s.io/v1
{%- endif %}
kind: ReferenceGrant
metadata:
  name: allow-listenerset-{{ sanitized_name }}-to-gateway
  namespace: qovery
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/router-name: {{ sanitized_name }}
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: {{ namespace_key }}
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: qovery-cluster-public-gateway
{%- endif %}
{%- endfor %}
{%- endif %}
{%- endif %}
{%- endif %}
