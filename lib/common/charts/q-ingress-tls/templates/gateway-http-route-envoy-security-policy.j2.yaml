{%- if k8s_deploy_api_gateway == true %}
{% for namespace_key, http_hosts in http_hosts_per_namespace_gateway %}
{%- if http_hosts|length >= 1  %}
{#
  Create one SecurityPolicy per HTTPRoute part.
  See gateway-http-route.j2.yaml for details on why routes are split.
#}
{%- set max_hosts_per_route = 1 %}
{%- set total_hosts = http_hosts|length %}
{%- set num_routes = (total_hosts / max_hosts_per_route)|round(method='ceil')|int %}
{%- for route_index in range(end=num_routes) %}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ sanitized_name }}-security-policy{%- if num_routes > 1 %}-{{ route_index + 1 }}{%- endif %}
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/router-name: {{ sanitized_name }}
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ sanitized_name }}{%- if num_routes > 1 %}-{{ route_index + 1 }}{%- endif %}
  {%- if advanced_settings.network_gateway_api_enable_cors == true %}
  cors:
    allowOrigins:
    {%- for o in advanced_settings.network_gateway_api_cors_allow_origin | split(pat=",") %}
    - "{{ o | trim }}"
    {%- endfor %}
    allowMethods:
    {%- for m in advanced_settings.network_gateway_api_cors_allow_methods | split(pat=",") %}
    - "{{ m | trim }}"
    {%- endfor %}
    allowHeaders:
    {%- for h in advanced_settings.network_gateway_api_cors_allow_headers | split(pat=",") %}
    - "{{ h | trim }}"
    {%- endfor %}
  {%- endif %}
  {%- if (advanced_settings.network_gateway_api_whitelist_source_range and advanced_settings.network_gateway_api_whitelist_source_range != "0.0.0.0/0") or advanced_settings.network_gateway_api_denylist_source_range %}
  authorization:
    {%- if advanced_settings.network_gateway_api_whitelist_source_range and advanced_settings.network_gateway_api_whitelist_source_range != "0.0.0.0/0" %}
    defaultAction: Deny
    {%- else %}
    defaultAction: Allow
    {%- endif %}
    rules:
    {%- if advanced_settings.network_gateway_api_whitelist_source_range and advanced_settings.network_gateway_api_whitelist_source_range != "0.0.0.0/0" %}
    - action: Allow
      principal:
        clientCIDRs:
        {%- for c in advanced_settings.network_gateway_api_whitelist_source_range | split(pat=",") %}
        - "{{ c | trim }}"
        {%- endfor %}
    {%- endif %}
    {%- if advanced_settings.network_gateway_api_denylist_source_range %}
    - action: Deny
      principal:
        clientCIDRs:
        {%- for c in advanced_settings.network_gateway_api_denylist_source_range | split(pat=",") %}
        - "{{ c | trim }}"
        {%- endfor %}
    {%- endif %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_basic_auth_env_var %}
  basicAuth:
    users:
      name: htaccess-{{ sanitized_name }}
  {%- endif %}
{%- endfor %}
{%- endif %}
{%- endfor %}
{%- endif %}