{%- if k8s_deploy_api_gateway == true %}
{% for namespace_key, http_hosts in http_hosts_per_namespace %}
{%- if http_hosts|length >= 1 %}
{%- if advanced_settings.network_gateway_api_custom_http_errors is defined and advanced_settings.network_gateway_api_custom_http_errors %}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ sanitized_name }}-error-pages
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
data:
  400.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>400 Bad Request</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                   display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
                   background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
            .container { text-align: center; padding: 2rem; }
            h1 { font-size: 6rem; margin: 0; font-weight: 700; }
            h2 { font-size: 2rem; margin: 1rem 0; font-weight: 400; }
            p { font-size: 1.1rem; opacity: 0.9; max-width: 500px; margin: 1rem auto; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>400</h1>
            <h2>Bad Request</h2>
            <p>The request could not be understood by the server due to malformed syntax.</p>
        </div>
    </body>
    </html>

  401.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
