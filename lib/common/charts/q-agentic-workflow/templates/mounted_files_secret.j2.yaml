{% for mounted_file in mounted_files -%}
---
# One Secret per file variable, mounted into the Job at `mount_path` by job.j2.yaml.
# `data` (not `stringData`): q-core already base64-encodes the content, so Kubernetes decodes once
# and the file lands as plaintext on disk. This is the plain single-encoding every other service
# uses for mounted files, not the engine-encodes/container-decodes convention secret.j2.yaml
# applies to the ai-runner contract variables.
apiVersion: v1
kind: Secret
metadata:
  name: {{ mounted_file.kube_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
type: Opaque
data:
  content: |
    {{ mounted_file.file_content_b64 }}
{% endfor -%}
