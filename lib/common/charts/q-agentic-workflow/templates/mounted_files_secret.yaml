{{- range $mounted_file := $.Values.mounted_files }}
---
# One Secret per file variable, mounted into the Job at `mount_path` by job.yaml.
# `data` (not `stringData`): q-core already base64-encodes the content, so Kubernetes decodes once
# and the file lands as plaintext on disk. This is the plain single-encoding every other service
# uses for mounted files, not the engine-encodes/container-decodes convention secret.yaml
# applies to the ai-runner contract variables.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mounted_file.kube_name }}
  namespace: {{ $.Values.namespace }}
  labels:
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
type: Opaque
data:
  content: {{ $mounted_file.file_content_b64 | quote }}
{{- end }}
