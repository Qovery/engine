---
apiVersion: v1
kind: Secret
metadata:
  name: {{ service.kube_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
type: Opaque
# `stringData` (not `data`) on purpose: the engine already base64-encodes every value
# (see `get_environment_variables`), and the container base64-decodes it (`ai-runner/src/engine_env.rs`).
# A `data:` field would make Kubernetes base64-decode the value a second time at `envFrom` injection,
# stripping the engine's encoding so the container receives plaintext and its decode fails
# ("Invalid padding"). `stringData` stores the value verbatim, so the engine's single encoding
# reaches the container intact.
stringData:
  {%- for ev in environment_variables %}
  {{ ev.key }}: |-
    {{ ev.value }}
  {%- endfor %}
