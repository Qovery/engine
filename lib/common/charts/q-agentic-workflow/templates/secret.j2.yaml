---
apiVersion: v1
kind: Secret
metadata:
  name: {{ service.kube_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
type: Opaque
# `stringData` (not `data`) on purpose: the engine already base64-encodes every value
# (see `get_environment_variables`), and the container base64-decodes it (`ai-runner/src/engine_env.rs`).
# A `data:` field would make Kubernetes base64-decode the value a second time at `envFrom` injection,
# stripping the engine's encoding so the container receives plaintext and its decode fails
# ("Invalid padding"). `stringData` stores the value verbatim, so the engine's single encoding
# reaches the container intact.
stringData:
  {%- for ev in environment_variables %}
  {{ ev.key | yaml_encode }}: {{ ev.value | yaml_encode }}
  {%- endfor %}
{%- if user_environment_variables %}
# User-defined variables, `data` rather than `stringData`: unlike the contract vars above, nothing
# in the container decodes them, so Kubernetes has to. The engine encodes them on the way in (see
# `to_user_environment_variables`) and Kubernetes decodes once at `envFrom`, leaving plaintext in the
# process environment. Encoding also keeps arbitrary user values out of a block scalar, where a
# newline or a leading space would break the rendered YAML.
# `stringData` wins over `data` on a duplicate key, so a user variable can never shadow a contract
# var even if the engine-side reserved-name filter were to miss one.
data:
  {%- for ev in user_environment_variables %}
  {{ ev.key | yaml_encode }}: {{ ev.value | yaml_encode }}
  {%- endfor %}
{%- endif %}
{%- if registry.docker_json_config %}
---
# Pull secret for the image the engine built from the docker fragment. Absent when the Job runs the
# public base image. `data` here, unlike the Secret above: a dockerconfigjson is expected
# base64-encoded by Kubernetes, and the engine hands it over already encoded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ registry.secret_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
data:
  .dockerconfigjson: {{ registry.docker_json_config }}
type: kubernetes.io/dockerconfigjson
{%- endif %}
