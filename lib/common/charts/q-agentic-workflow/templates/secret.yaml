---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.service.kube_name }}
  namespace: {{ $.Values.namespace }}
  labels:
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
type: Opaque
# Contract values are base64-encoded by the engine and decoded by ai-runner.
# Keep them in `stringData` so Kubernetes does not decode them before the runner.
stringData:
  {{- range $ev := $.Values.environment_variables }}
  {{ $ev.key | toJson }}: {{ $ev.value | toJson }}
  {{- end }}
{{- if or $.Values.user_environment_variables $.Values.bedrock_credentials }}
# User and Bedrock values are decoded once by Kubernetes for the CLI.
# Reserved names prevent collisions with contract variables.
data:
  {{- range $ev := $.Values.user_environment_variables }}
  {{ $ev.key | toJson }}: {{ $ev.value | toJson }}
  {{- end }}
  {{- range $ev := $.Values.bedrock_credentials }}
  {{ $ev.key | toJson }}: {{ $ev.value | toJson }}
  {{- end }}
{{- end }}
{{- if and $.Values.registry $.Values.registry.docker_json_config }}
---
# Pull secret for the image the engine built from the docker fragment. Absent when the Job runs the
# public base image. `data` here, unlike the Secret above: a dockerconfigjson is expected
# base64-encoded by Kubernetes, and the engine hands it over already encoded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.registry.secret_name }}
  namespace: {{ $.Values.namespace }}
  labels:
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
data:
  .dockerconfigjson: {{ $.Values.registry.docker_json_config | quote }}
type: kubernetes.io/dockerconfigjson
{{- end }}
