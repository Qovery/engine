{{- /*
  One ListenerSet with one HTTPS listener for one hostname.
  A ListenerSet only accepts routes of its own namespace, so there is one per route namespace.
  It carries no cert-manager annotation: the Certificate below is the only owner of the TLS Secret,
  so cert-manager's Gateway shim must not create a second Certificate for the same Secret.
*/ -}}
{{- range $namespace := $.Values.namespaces }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ toJson $.Values.name }}
  namespace: {{ toJson $namespace }}
  labels:
    {{- include "qovery.hostnameListenerSetLabels" $ | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: qovery-cluster-public-gateway
    namespace: qovery
  listeners:
  - name: https
    hostname: {{ toJson $.Values.hostname }}
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ toJson $.Values.tls_secret_name }}
        namespace: {{ toJson $namespace }}
{{- end }}
