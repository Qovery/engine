{%- if service.storages | length == 0 and not service.autoscaling and service.min_instances != service.max_instances and service.advanced_settings.hpa_cpu_average_utilization_percent >= 0 %}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ service.name }}
  namespace: {{ namespace }}
  labels:
    envId: {{ environment_short_id }}
    qovery.com/service-id: {{ service.long_id }}
    qovery.com/service-type: {{ service.type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    app.kubernetes.io/name: {{ service.name }}
    app.kubernetes.io/instance: {{ service.long_id }}
    app.kubernetes.io/component: {{ service.type }}
    app.kubernetes.io/part-of: {{ namespace }}
    app.kubernetes.io/managed-by: qovery
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
  annotations:
    {%- for key, value in annotations_group.hpa %}
      {{ key }}: |-
         {{ value }}
      {%- endfor %}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ service.name }}
  minReplicas: {{ service.min_instances }}
  maxReplicas: {{ service.max_instances }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ service.advanced_settings.hpa_cpu_average_utilization_percent }}
    {%- if service.advanced_settings.hpa_memory_average_utilization_percent %}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ service.advanced_settings.hpa_memory_average_utilization_percent }}
    {%- endif %}
  {%- endif %}
