{{- if and (eq (len $.Values.service.storages) 0) (not ($.Values.service.autoscaling)) (ne $.Values.service.min_instances $.Values.service.max_instances) (ge (int $.Values.service.advanced_settings.hpa_cpu_average_utilization_percent) 0) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Values.service.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    envId: {{ $.Values.environment_short_id | quote }}
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: {{ $.Values.service.type | quote }}
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
    app.kubernetes.io/name: {{ $.Values.service.name | quote }}
    app.kubernetes.io/instance: {{ $.Values.service.long_id | quote }}
    app.kubernetes.io/component: {{ $.Values.service.type | quote }}
    app.kubernetes.io/part-of: {{ $.Values.namespace | quote }}
    app.kubernetes.io/managed-by: "qovery"
    app.kubernetes.io/version: {{ $.Values.service.image_tag_label | quote }}
    {{- range $key, $value := $.Values.labels_group.common }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
  annotations:
    {{- range $key, $value := $.Values.annotations_group.hpa }}
      {{ $key | toJson }}: {{ $value | toJson }}
      {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Values.service.name }}
  minReplicas: {{ $.Values.service.min_instances }}
  maxReplicas: {{ $.Values.service.max_instances }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.service.advanced_settings.hpa_cpu_average_utilization_percent }}
    {{- if $.Values.service.advanced_settings.hpa_memory_average_utilization_percent }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $.Values.service.advanced_settings.hpa_memory_average_utilization_percent }}
    {{- end }}
  {{- end }}
