{%- for external_secret in external_secrets %}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ external_secret.external_secret_kube_name }}
  namespace: {{ namespace }}
  labels:
    envId: {{ environment_short_id }}
    qovery.com/service-id: {{ service.long_id }}
    qovery.com/service-type: {{ service.type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  # Refresh secret only on deploy
  refreshInterval: "0"
  secretStoreRef:
    name: {{ external_secret.store_name }}
    kind: ClusterSecretStore
  target:
    name: {{ external_secret.external_secret_kube_name }}
    creationPolicy: Owner
  data:
    {%- for entry in external_secret.entries %}
    - secretKey: {{ entry.env_var_key }}
      remoteRef:
        key: {{ entry.remote_key }}
    {%- endfor %}
{%- endfor %}
