# global gateways, one public per cluster
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: qovery-cluster-public-gateway-envoy-proxy
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        {{- if .Values.envoyProxy.qoveryPublic.provider.kubernetes.envoyService.annotations }}
        annotations:
        {{- range $key, $value := .Values.envoyProxy.qoveryPublic.provider.kubernetes.envoyService.annotations }}
        {{- if $value }}
          {{ $key }}: {{ tpl ($value | toString) $ | quote }}
        {{- end }}
        {{- end }}
        {{- else }}
        annotations: {}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: qovery-cluster-public-gateway
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  {{- if .Values.gateway.qoveryPublic.annotations }}
  annotations:
  {{- range $key, $value := .Values.gateway.qoveryPublic.annotations }}
    {{ $key }}: {{ tpl ($value | toString) $ | quote }}
  {{- end }}
  {{- end }}
spec:
  gatewayClassName: qovery-public-gateway
  # Allow ListenerSets from all namespaces to attach to this Gateway
  allowedListeners:
    namespaces:
      from: All
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: qovery-cluster-public-gateway-envoy-proxy
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All  # Allow routes from all namespaces
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: letsencrypt-acme-qovery-cert
        namespace: "{{ .Values.certManagerNamespace }}"
