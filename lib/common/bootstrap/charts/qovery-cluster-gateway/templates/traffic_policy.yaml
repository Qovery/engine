apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: qovery-cluster-public-gateway-client-traffic-policy
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  {{- $numHops := -1 }}
  {{- if .Values.gateway.qoveryPublic }}
    {{- if .Values.gateway.qoveryPublic.xForwardedFor }}
      {{- if hasKey .Values.gateway.qoveryPublic.xForwardedFor "numberTrustedHops" }}
        {{- $rawNumHops := .Values.gateway.qoveryPublic.xForwardedFor.numberTrustedHops }}
        {{- if and (kindIs "string" $rawNumHops) (regexMatch "^-?[0-9]+$" (trim $rawNumHops)) }}
          {{- $numHops = int $rawNumHops }}
        {{- else if or (kindIs "int" $rawNumHops) (kindIs "int64" $rawNumHops) (kindIs "float64" $rawNumHops) }}
          {{- $numHops = int $rawNumHops }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if ge $numHops 0 }}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: {{ $numHops }}
  {{- end }}
  {{- $streamIdleTimeoutSeconds := -1 }}
  {{- if .Values.gateway.qoveryPublic }}
    {{- if .Values.gateway.qoveryPublic.timeout }}
      {{- if .Values.gateway.qoveryPublic.timeout.http }}
        {{- if hasKey .Values.gateway.qoveryPublic.timeout.http "streamIdleTimeoutSeconds" }}
          {{- $rawStreamIdleTimeoutSeconds := .Values.gateway.qoveryPublic.timeout.http.streamIdleTimeoutSeconds }}
          {{- if and (kindIs "string" $rawStreamIdleTimeoutSeconds) (regexMatch "^[0-9]+$" (trim $rawStreamIdleTimeoutSeconds)) }}
            {{- $streamIdleTimeoutSeconds = int $rawStreamIdleTimeoutSeconds }}
          {{- else if or (kindIs "int" $rawStreamIdleTimeoutSeconds) (kindIs "int64" $rawStreamIdleTimeoutSeconds) (kindIs "float64" $rawStreamIdleTimeoutSeconds) }}
            {{- $streamIdleTimeoutSeconds = int $rawStreamIdleTimeoutSeconds }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if ge $streamIdleTimeoutSeconds 0 }}
  timeout:
    http:
      streamIdleTimeout: "{{ $streamIdleTimeoutSeconds }}s"
  {{- end }}
  headers:
    enableEnvoyHeaders: true # add the "X-Envoy-" headers to requests and responses
    withUnderscoresAction: {{ .Values.gateway.qoveryPublic.withUnderscoresAction }} # avoid rejecting requests when intermediaries send underscored headers
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: qovery-cluster-public-gateway
  {{- if .Values.gateway.qoveryPublic.enableProxyProtocol }}
  proxyProtocol:
    optional: false
  {{- end }}
