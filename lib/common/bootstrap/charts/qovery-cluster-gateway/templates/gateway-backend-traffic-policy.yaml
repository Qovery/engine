{{- if .Values.gateway.qoveryPublic.enable }}
{{- if or .Values.gateway.qoveryPublic.customHttpErrors.default .Values.gateway.qoveryPublic.compression.enable }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: qovery-cluster-public-gateway-backend-traffic-policy
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: qovery-cluster-public-gateway
  {{- if .Values.gateway.qoveryPublic.customHttpErrors.default }}
  responseOverride:
    {{- range $code := split "," .Values.gateway.qoveryPublic.customHttpErrors.default }}
    - match:
        statusCodes:
          - type: Value
            value: {{ $code | trim }}
      response:
        contentType: text/html
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: qovery-cluster-gateway-default-error-pages
            key: {{ $code | trim }}.html
    {{- end }}
  {{- end }}
  {{- if .Values.gateway.qoveryPublic.compression.enable }}
  # Fallback for traffic without a route-level BackendTrafficPolicy, such as unmanaged routes.
  # Qovery-managed routes materialize this configuration in their own policy, which takes precedence.
  compressor:
    - type: Brotli
      brotli: {}
    - type: Zstd
      zstd: {}
    - type: Gzip
      gzip: {}
  {{- end }}
{{- end }}
{{- end }}
