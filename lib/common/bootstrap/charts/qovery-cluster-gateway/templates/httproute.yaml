---
# This route is created to expose DNS to ExternalDNS.
# ExternalDNS sees the hostname on the Route → creates DNS record
# No backend service needed
# Any request returns a harmless 404 (until you add real routes later)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-only-route
  namespace: {{ .Values.namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "{{ .Values.dns.domain }}"
spec:
  parentRefs:
    - name: qovery-cluster-public-gateway # TODO(benjamin): make it param
      namespace: qovery # TODO(benjamin): make it param
  hostnames:
    - "{{ .Values.dns.domain }}"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: "/__dns_only__"
