{{- $root := . -}}
{{- $ns := $root.Values.namespace | default $root.Release.Namespace -}}
{{- range $i, $a := $root.Values.alerts }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ regexReplaceAll "[^a-z0-9-]" (lower $a.long_id) "-" | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ns }}
  labels:
    release: kube-prometheus-stack
    alertmanager: main
    {{- with $root.Values.extraLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ default $root.Values.groupName "default.rules" }}
    {{- if or $a.interval $root.Values.interval }}
      interval: {{ default $a.interval $root.Values.interval }}
    {{- end }}
      rules:
        - alert: {{ $a.name }}
          expr: {{ $a.expr | quote }}
        {{- if $a.for }}
          for: {{ $a.for }}
        {{- end }}
        {{- if or $root.Values.commonLabels $a.labels }}
          labels:
          {{- with $root.Values.commonLabels }}
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $a.labels }}
{{ toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if or $root.Values.commonAnnotations $a.annotations }}
          annotations:
          {{- with $root.Values.commonAnnotations }}
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $a.annotations }}
{{ toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
---
{{- end }}