{{- $root := . -}}
{{- if $root.Values.receivers }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $root.Values.alertManagerConfigName | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Values.namespace | default $root.Release.Namespace }}
  labels:
    alertmanager: main
spec:
  route:
    receiver: default
    routes:
{{- range $i, $rcv := $root.Values.receivers }}
      - matchers:
          - name: {{ $rcv.matcher_label }}
            value: "true"
            matchType: "="
        receiver: {{ $rcv.id }}
        continue: true
{{- end }}
  receivers:
    - name: default
{{- range $i, $rcv := $root.Values.receivers }}
{{- $rcvName := $rcv.id }}
{{- $rcvSafe := regexReplaceAll "[^a-z0-9-]" (lower $rcvName) "-" }}
{{- $secret := $rcv.id | trunc 63 | trimSuffix "-" }}
    - name: {{ $rcvName }}
    {{- if $rcv.slack }}
      slackConfigs:
        - channel: {{ $rcv.slack.channel }}
          title: |
               {{ `{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .CommonLabels.alertname | default "Alert" }}` }}
          text: |
               {{ `{{ range .Alerts }}*Alert:* {{ .Labels.alertname | default "Unknown" }}
               {{ with .Annotations.summary }}📊 *{{ . }}*{{ else }}{{ with .Annotations.description }}📊 *{{ . }}*{{ end }}{{ end }}
               {{ with .Labels.container }}• Container: {{ . }}{{ end }}
               {{ with .Labels.namespace }}• Namespace: {{ . }}{{ end }}
               • Since: {{ .StartsAt.Format "15:04:05" }}
               ---
               {{ end }}` }}
{{/*          title: "Alert: {{`{{ .GroupLabels.alertname }}`}}"*/}}
{{/*          text: "{{`{{ range .Alerts }}{{ .Annotations.description }}{{ end }}`}}"*/}}
          sendResolved: {{ default true $rcv.slack.sendResolved }}
          groupBy:
            - alertname                                                                                                                                                                                                                                                                                        │
            - qovery_alert_long_id                                                                                                                                                                                                                                                                             │
            - qovery_target_id
          groupInterval: 5m                                                                                                                                                                                                                                                                                  │
          groupWait: 30s
          repeatInterval: 4h
          apiURL:
            name: {{ $secret }}
            key: "url"
    {{- end }}
{{- end }}
{{- end }}