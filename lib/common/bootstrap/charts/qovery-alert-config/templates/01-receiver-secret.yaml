{{- $root := . -}}
{{- range $i, $rcv := $root.Values.receivers }}
{{- $rcvName := required (printf "receivers[%d].name is required" $i) $rcv.name -}}
{{- $rcvSafe := regexReplaceAll "[^a-z0-9-]" (lower $rcvName) "-" -}}
{{- $secret := $rcv.id| trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $root.Values.namespace | default $root.Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
  {{- if $root.Values.labels }}
  labels:
{{ toYaml $root.Values.labels | indent 4 }}
  {{- end }}
type: Opaque
stringData:
{{- if $rcv.slack }}
  url: {{ required (printf "receivers[%d].slack.webhookURL is required" $i) $rcv.slack.webhookURL | quote }}
{{- end }}
{{- if $rcv.email }}
  {{- if $rcv.email.authPassword }}
  smtp-password: {{ $rcv.email.authPassword | quote }}
  {{- end }}
{{- end }}
---
{{- end }}