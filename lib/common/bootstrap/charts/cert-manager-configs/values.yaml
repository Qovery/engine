# Supported providers: cloudflare
externalDnsProvider: ""

# List of wildcard DNS to support
managedDns: []

# Namespace where it should be deployed
namespace: "cert-manager"

# Required provider info for ACME DNS challenge
provider:
  cloudflare:
    apiToken: ""
    email: ""

# Let's encrypt info
acme:
  letsEncrypt:
    isTest: false
    emailReport: ""
    stagingUrl: "https://acme-staging-v02.api.letsencrypt.org/directory"
    productionUrl: "https://acme-v02.api.letsencrypt.org/directory"
