{{- if or (and (eq .Values.provider "pdns") .Values.pdns.apiKey) (and (eq .Values.provider "cloudflare") (or .Values.cloudflare.apiToken .Values.cloudflare.apiKey)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "external-dns.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: Helm
type: Opaque
data:
  {{- if eq .Values.provider "cloudflare" }}
  {{- if .Values.cloudflare.apiToken }}
  cloudflare_api_token: {{ .Values.cloudflare.apiToken | b64enc | quote }}
  {{- else }}
  cloudflare_api_key: {{ .Values.cloudflare.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.cloudflare.email }}
  cloudflare_email: {{ .Values.cloudflare.email | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.provider "pdns" }}
  pdns_api_key: {{ .Values.pdns.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
