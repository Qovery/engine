{{- if .Values.rbac.create -}}
kind: Role
apiVersion: rbac.authorization.k8s.io/{{ .Values.rbac.apiVersion }}
metadata:
  name: {{ include "qovery-operator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qovery-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - patch
  # Worker PDBs are owned by their Jobs and garbage-collected with them.
  # The operator does not delete or list PDBs; it retrieves them by Job name.
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
{{- end }}
