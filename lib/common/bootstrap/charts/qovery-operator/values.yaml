replicaCount: 1
rolloutStrategy: RollingUpdate

image:
  repository: public.ecr.aws/r3m4q3r9/qovery-operator
  pullPolicy: IfNotPresent
  tag: ""

namespace: "qovery"

labels:
  app: qovery-operator

environmentVariables:
  RUST_LOG: "info"
  GRPC_SERVER: ""
  ORGANIZATION_ID: ""
  CLUSTER_ID: ""
  CLUSTER_JWT_TOKEN: ""
  QOVERY_ENGINE_WORKER_IMAGE_REPOSITORY: "public.ecr.aws/r3m4q3r9/engine"
  QOVERY_ENGINE_WORKER_IMAGE_TAG_SUFFIX: ""

metrics:
  port: 8080
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

probes:
  enabled: false
  liveness:
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 10
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

workerServiceAccount:
  create: true
  annotations: {}
  name: "qovery-engine-worker"
  automountServiceAccountToken: true

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

rbac:
  create: true
  apiVersion: v1

workerRbac:
  create: true
  clusterAdmin: true
  clusterRoleName: cluster-admin
