{{- if eq .Values.provider "aws" }}
{{- if include "qovery-storage-class.renderable" (dict "root" $ "name" "aws-ebs-gp3-0") }}
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: aws-ebs-gp3-0
  annotations:
    qovery.com/source: platform-catalog
  labels:
    aws-type: "gp3"
    qovery-type: "ssd"
    reclaim: "0"
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  encrypted: 'true'
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
{{- end }}
