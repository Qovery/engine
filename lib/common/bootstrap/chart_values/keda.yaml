# Qovery configuration for KEDA
# CRDs are managed separately by keda-crd chart
crds:
  install: false

serviceAccount:
  create: true
  name: keda-operator
  annotations:
     eks.amazonaws.com/role-arn: set-by-engine-code

resources:
  operator: { }
  metricServer: { }
  webhooks: { }

operator:
  replicaCount: set-by-engine-code
  # Tolerations for Qovery infrastructure nodegroup
  tolerations:
    - key: "node.qovery.com/infrastructure"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  # Affinity to prefer infrastructure nodegroup
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.qovery.com/infrastructure
                operator: In
                values:
                  - "true"

metricsServer:
  replicaCount: set-by-engine-code
  serviceAccount:
    create: true
    name: keda-metrics-server
    annotations:
       eks.amazonaws.com/role-arn: set-by-engine-code
  tolerations:
    - key: "node.qovery.com/infrastructure"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.qovery.com/infrastructure
                operator: In
                values:
                  - "true"

webhooks:
  enabled: true
  replicaCount: set-by-engine-code
  tolerations:
    - key: "node.qovery.com/infrastructure"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.qovery.com/infrastructure
                operator: In
                values:
                  - "true"

# Prometheus monitoring integration (set dynamically by engine)
prometheus:
  operator:
    enabled: set-by-engine-code
    serviceMonitor:
      enabled: set-by-engine-code
    prometheusRule:
      enabled: set-by-engine-code
  metricServer:
    enabled: set-by-engine-code
    serviceMonitor:
      enabled: set-by-engine-code

# Qovery labels
additionalLabels:
  qovery.com/managed: "true"

podLabels:
  admission.datadoghq.com/enabled: "false"
