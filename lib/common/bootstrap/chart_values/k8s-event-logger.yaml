image:
  repository: public.ecr.aws/r3m4q3r9/k8s-event-logger-rs
  tag: 483ac1b3

resources:
  limits:
    cpu: 500m
    memory: 384Mi
  requests:
    cpu: 50m
    memory: 32Mi

args:
  - --ignore-update=false

rbac:
  rules:
    - apiGroups: [""]
      resources: [
        "events", "pods", "nodes", "services", "endpoints",
        "persistentvolumes", "persistentvolumeclaims",
        "namespaces", "configmaps"
      ]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [ "policy" ]
      resources: [ "poddisruptionbudgets" ]
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [ "autoscaling.k8s.io" ]
      resources: [ "verticalpodautoscalers" ]
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["metrics.k8s.io"]
      resources: ["nodes", "pods"]
      verbs: ["get", "list"]
    - apiGroups: ["events.k8s.io"]
      resources: ["events"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [ "elbv2.k8s.aws" ]
      resources: ["targetgroupbindings"]
      verbs: [ "get","list","watch" ]
    - apiGroups: ["karpenter.sh"]
      resources: ["nodeclaims", "nodepools"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [ "coordination.k8s.io" ]
      resources: [ "leases" ]
      verbs: [ "get", "list", "watch" ]
    - apiGroups: [ "cert-manager.io" ]
      resources: [ "issuers", "certificates", "certificaterequests", "clusterissuers" ]
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["gateway.networking.k8s.io"]
      resources: ["httproutes", "gateways"]
      verbs: ["get", "list", "watch"]
