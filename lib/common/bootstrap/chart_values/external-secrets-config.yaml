# Array representing the ClusterSecretStores configurations
configurations:
  # Example with AWS IAM Role (IRSA - IAM Roles for Service Accounts)
  # - name: my-aws-irsa
  #   type: aws-iam
  #   region: us-east-1
  #   roleArn: arn:aws:iam::123456789012:role/my-external-secrets-role
  #   serviceAccount:
  #     create: true
  #     name: my-service-account
  #     namespace: external-secrets-system  # Optional, defaults to Release.Namespace
  #     annotations: {}  # Optional additional annotations

  # Example with AWS Static Credentials
  # - name: my-aws-static
  #   type: aws-static
  #   region: us-east-1
#   accessKeyId: EXAMPLEACCESSKEYID
#   secretAccessKey: EXAMPLESECRETACCESSKEY
  #   secretName: aws-static-credentials  # If not provided, will use "{name}-credentials"
  #   secretNamespace: external-secrets-system  # Optional, defaults to Release.Namespace