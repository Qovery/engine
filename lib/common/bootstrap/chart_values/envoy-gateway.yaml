config:
  envoyGateway:
    gateway:
      controllerName: qovery.com/gateway-controller

service:
  annotations: {} # set-by-engine

hpa:
  enabled: false # set-by-engine
  minReplicas: 1 # set-by-engine
  maxReplicas: 1 # set-by-engine

deployment:
  envoyGateway:
    resources:
      limits:
        cpu: set-by-engine-code
        memory: set-by-engine-code
      requests:
        cpu: set-by-engine-code
        memory: set-by-engine-code
  pod:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: control-plane
                  operator: In
                  values:
                    - envoy-gateway
            topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  maxUnavailable: 1 # set-by-engine
