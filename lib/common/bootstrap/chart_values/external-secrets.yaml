installCRDs: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 50m
    memory: 128Mi

# IRSA configuration
# For EKS: If uses AUTOMATIC or ROLE_ARN => create service account having the ARN role
# For GCP: If uses AUTOMATIC => create service account
serviceAccount:
  create: set-by-engine-code
  name: set-by-engine-code

webhook:
  create: true
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - external-secrets-webhook
            topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  certManager:
    enabled: true
    cert:
      issuerRef:
        group: cert-manager.io
        kind: "Issuer"
        name: "self-signed-eso-webhook-issuer"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 64Mi

# Disable explicitly cert-controller
certController:
  create: false
