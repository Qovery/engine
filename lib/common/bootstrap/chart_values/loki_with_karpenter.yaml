backend:
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "karpenter.sh/capacity-type"
              operator: "NotIn"
              values: [ "spot" ]

singleBinary:
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "karpenter.sh/capacity-type"
              operator: "NotIn"
              values: [ "spot" ]

loki:
  podAnnotations: {
    karpenter.sh/do-not-disrupt: "true"
  }
