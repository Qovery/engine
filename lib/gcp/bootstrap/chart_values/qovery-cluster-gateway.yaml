dns:
  domain: set-by-engine-code

certManagerNamespace: "qovery"

gateway:
  qoveryPublic:
    enable: true
    enableProxyProtocol: false
    xForwardedFor:
      numberTrustedHops: null
    customHttpErrors:
      default: null
    compression:
      enable: true
    defaultBackend:
      enable: false
      image: null
      tag: null

infrastructure:
  annotations:

# metrics are enabled only when prometheus is installed
metrics:
  enabled: set-by-engine-code
  podMonitor:
    enabled: set-by-engine-code
    additionalLabels:
      release: kube-prometheus-stack
