# TODO: Remove `ingress` once the NGINX to Gateway API rollout is complete.
sources:
  - service
  - ingress
  - gateway-httproute
  - gateway-grpcroute
  # - gateway-tlsroute
# HACK(QOV-2106): external-dns 0.21.0 watches TLSRoute through the deprecated
# `gateway.networking.k8s.io/v1alpha2` API, while current Gateway API CRDs only serve it at `v1`.
# Re-enable `gateway-tlsroute` after upstream fixes
# https://github.com/kubernetes-sigs/external-dns/issues/6247 and bump the chart.

# Envoy Gateway installs the ListenerSet CRD through envoy-gateway-crd.
enableGatewayListenerSets: true
