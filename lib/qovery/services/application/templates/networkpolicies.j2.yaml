---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ qovery_env.applications[application_index]['id'] }}-{{ qovery_env.environment_id }}-default
  namespace: {{ qovery_env.project_id }}
  labels:
    ownerId: {{ qovery_env.owner_id }}
    appId: {{ qovery_env.applications[application_index]['id'] }}
    envId: {{ qovery_env.environment_id }}
spec:
  # Deny all ingress by default to this application
  podSelector:
    matchLabels:
      appId: {{ qovery_env.applications[application_index]['id'] }}
      ownerId: {{ qovery_env.owner_id }}
      envId: {{ qovery_env.environment_id }}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ qovery_env.applications[application_index]['id'] }}-{{ qovery_env.environment_id }}-app-access
  namespace: {{ qovery_env.project_id }}
  labels:
    ownerId: {{ qovery_env.owner_id }}
    appId: {{ qovery_env.applications[application_index]['id'] }}
    envId: {{ qovery_env.environment_id }}
spec:
  # Then allow some ingress to this application
  podSelector:
    matchLabels:
      appId: {{ qovery_env.applications[application_index]['id'] }}
      ownerId: {{ qovery_env.owner_id }}
      envId: {{ qovery_env.environment_id }}
  ingress:
  # Allow ingress from same environment
  - from:
    - podSelector:
        matchLabels:
          ownerId: {{ qovery_env.owner_id }}
          envId: {{ qovery_env.environment_id }}

  # Allow ingress from everywhere but only to application port
  {% if qovery_env.applications[application_index]['private_port'] %}
  - ports:
    - port: {{ qovery_env.applications[application_index]['private_port'] }}
  {% endif %}
  # FIXME(sileht): Previous rule is not perfect as other pods/namespaces can
  # access to the application port without going through the Ingress object,
  # but that's not critical neither
  # Only way to fix that is to allow lb and kube-proxy to access the namespace/pods explictly via IP, eg:
  # - from:
  #   - ipBlock:
  #       cidr: 10.0.99.179/32
  #   - ipBlock:
  #       cidr: 10.0.28.216/32
  #   - ipBlock:
  #       cidr: 10.0.98.42/32
  #   - ipBlock:
  #       cidr: 10.0.59.208/32
  # Since user pods, kube-proxy, and lbs are all in 10.0.0.0/8 we can't write generic rule like:
  #   - ipBlock:
  #       cidr: 0.0.0.0/0
  #       except: [10.0.0.0/8]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ qovery_env.applications[application_index]['id'] }}-{{ qovery_env.environment_id }}-deny-aws-metadata-server
  namespace: {{ qovery_env.project_id }}
  labels:
    ownerId: {{ qovery_env.owner_id }}
    appId: {{ qovery_env.applications[application_index]['id'] }}
    envId: {{ qovery_env.environment_id }}
spec:
  podSelector:
    matchLabels:
      appId: {{ qovery_env.applications[application_index]['id'] }}
      ownerId: {{ qovery_env.owner_id }}
      envId: {{ qovery_env.environment_id }}
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          - 169.254.169.254/32
