fullnameOverride: loki
loki:
  auth_enabled: false
  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
  query_scheduler:
    # the TSDB index dispatches many more, but each individually smaller, requests.
    # We increase the pending request queue sizes to compensate.
    max_outstanding_requests_per_tenant: 32768
  querier:
    # Each `querier` component process runs a number of parallel workers to process queries simultaneously.
    # You may want to adjust this up or down depending on your resource usage
    # (more available cpu and memory can tolerate higher values and vice versa),
    # but we find the most success running at around `16` with tsdb
    max_concurrent: 16
  schemaConfig:
    configs:
      # set the schema for the index (2020 version can be deleted on a fresh install)
      - from: 2020-05-15
        store: boltdb-shipper
        object_store: set-by-engine-code
        schema: v11
        index:
          prefix: index_
          period: 24h
      - from: 2022-01-11
        store: boltdb-shipper
        object_store: set-by-engine-code
        schema: v12
        index:
          prefix: index_
          period: 24h
      - from: 2025-10-14
        store: tsdb
        object_store: set-by-engine-code
        schema: v13
        index:
          prefix: index_
          period: 24h
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
    metricsInstance:
      enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  grafanaAgent:
    enabled: false
  lokiCanary:
    enabled: false
test:
  enabled: false
gateway:
  enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir: {}
    - name: storage
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /data
    - name: storage
      mountPath: /var/loki
