defaultRules:
  create: true
  rules:
    alertmanager: "set-by-engine-code"
    etcd: false
    configReloaders: true
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeProxy: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeStateMetrics: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    windows: false

kube-state-metrics:
  image:
    registry: public.ecr.aws/r3m4q3r9
    repository: pub-mirror-kube-state-metrics
  prometheus:
    monitor:
      enabled: true
      honorLabels: true
  metricLabelsAllowlist:
    - pods=[qovery.com/project-id,qovery.com/environment-id,qovery.com/service-id,qovery.com/deployment-id]
    - horizontalpodautoscalers=[qovery.com/service-id]
    - jobs=[qovery.com/service-id,qovery.com/deployment-id]
    - cronjobs=[qovery.com/service-id]
    - services=[qovery.com/service-id]
    - deployments=[qovery.com/service-id]
    - statefulsets=[qovery.com/service-id]
    - ingresses=[qovery.com/associated-service-id]
    - persistentvolumeclaims=[qovery.com/service-id]
  collectors:
    - certificatesigningrequests
    - cronjobs
    - daemonsets
    - deployments
    - endpoints
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - limitranges
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code

  # Enable RBAC for Gateway API resources
  rbac:
    extraRules:
      - apiGroups: [ "gateway.networking.k8s.io" ]
        resources:
          - gatewayclasses
          - gateways
          - httproutes
        verbs: [ "list", "watch" ]

  # Enable custom resource monitoring for HTTPRoute
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
            metricNamePrefix: kube_httproute
            labelsFromPath:
              httproute_name: [ metadata, name ]
              httproute_namespace: [ metadata, namespace ]
            metrics:
              - name: labels
                help: "Kubernetes labels converted to Prometheus labels"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      # Export all HTTPRoute labels including qovery.com/*
                      "*": [ metadata, labels ]


crds:
  enabled: false

alertmanager:
  enabled: "set-by-engine-code"
  podDisruptionBudget:
    enabled: true
  alertmanagerSpec:
    replicas: 2
    resources:
      limits:
        cpu: set-by-engine-code
        memory: set-by-engine-code
      requests:
        cpu: set-by-engine-code
        memory: set-by-engine-code

grafana:
  enabled: false
  serviceMonitor:
    enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubelet:
  serviceMonitor:
    resource: true
    # From kubernetes 1.18, /metrics/resource/v1alpha1 renamed to /metrics/resource
    resourcePath: "/metrics/resource"

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true

prometheus:
  enabled: true
  podDisruptionBudget:
    enabled: "set-by-engine-code"
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
  prometheusSpec:
    image:
      registry: public.ecr.aws/r3m4q3r9
      repository: pub-mirror-prometheus
    # Replica label to be used by thanos
    replicaExternalLabelName: "replica"
    serviceDiscoveryRole: "EndpointSlice"
    thanos:
      objectStorageConfig:
         secret:
           type: S3
           config:
             bucket: "set-by-engine-code"
             region: "set-by-engine-code"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    retentionSize: "7GB" # prometheus db
    walCompression: true
    externalUrl: set-by-engine-code
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: set-by-engine-code
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "8Gi"
    resources:
      limits:
        cpu: set-by-engine-code
        memory: set-by-engine-code
      requests:
        cpu: set-by-engine-code
        memory: set-by-engine-code
    replicas: set-by-engine-code

prometheusOperator:
  priorityClassName: qovery-high-priority
  prometheusConfigReloader:
    image:
      registry: public.ecr.aws/r3m4q3r9
      repository: pub-mirror-prometheus-config-reloader
  thanosImage:
    registry: public.ecr.aws/r3m4q3r9
    repository: pub-mirror-thanos
  image:
    registry: public.ecr.aws/r3m4q3r9
    repository: pub-mirror-prometheus-operator
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false

prometheus-node-exporter:
  image:
    registry: public.ecr.aws/r3m4q3r9
    repository: pub-mirror-prometheus-node-exporter
  priorityClassName: set-by-engine-code
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code
  prometheus:
    monitor:
      enabled: false

additionalPrometheusRules:
  - name: nginx.rules
    groups:
      - name: nginx-quantiles
        interval: 30s
        rules:
          - record: nginx:request_duration:rate5m
            expr: sum by (le, ingress) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m]))
          - record: nginx:request_p50:5m
            expr: histogram_quantile(0.5, nginx:request_duration:rate5m)
          - record: nginx:request_p95:5m
            expr: histogram_quantile(0.95, nginx:request_duration:rate5m)
          - record: nginx:request_p99:5m
            expr: histogram_quantile(0.99, nginx:request_duration:rate5m)

  - name: nginx.core
    groups:
      - name: nginx-requests-rates
        interval: 30s
        rules:
          - record: nginx:req_rate:5m
            expr: sum by (ingress) (rate(nginx_ingress_controller_requests[5m]))

          - record: nginx:req_rate:5m_by_status
            expr: sum by (ingress, status) (rate(nginx_ingress_controller_requests[5m]))

          - record: nginx:req_rate:5m_by_path_status
            expr: sum by (ingress, path, status) (rate(nginx_ingress_controller_requests[5m]))

      - name: nginx-requests-increase
        interval: 5m
        rules:
          - record: nginx:req_inc:5m
            expr: sum by (ingress) (increase(nginx_ingress_controller_requests[5m]))

          - record: nginx:req_inc:5m_by_status
            expr: sum by (ingress, status) (increase(nginx_ingress_controller_requests[5m]))

      - name: nginx-sizes
        interval: 30s
        rules:
          - record: nginx:req_bytes_rate:5m
            expr: sum by (ingress) (rate(nginx_ingress_controller_request_size_sum[5m]))
          - record: nginx:resp_bytes_rate:5m
            expr: sum by (ingress) (rate(nginx_ingress_controller_response_size_sum[5m]))

          - record: nginx:req_size_avg_bytes:5m
            expr: nginx:req_bytes_rate:5m / clamp_min(nginx:req_rate:5m, 1)
          - record: nginx:resp_size_avg_bytes:5m
            expr: nginx:resp_bytes_rate:5m / clamp_min(nginx:req_rate:5m, 1)

  - name: envoy-proxy.rules
    groups:
      - name: envoy-proxy-quantiles
        interval: 30s
        rules:
          - record: envoy_proxy:request_duration:rate5m
            expr: sum by (le, httproute_name, envoy_response_code_class) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))
          - record: envoy_proxy:request_p50:5m
            expr: histogram_quantile(0.5, envoy_proxy:request_duration:rate5m)
          - record: envoy_proxy:request_p95:5m
            expr: histogram_quantile(0.95, envoy_proxy:request_duration:rate5m)
          - record: envoy_proxy:request_p99:5m
            expr: histogram_quantile(0.99, envoy_proxy:request_duration:rate5m)

  - name: envoy-proxy.core
    groups:
      - name: envoy-proxy-requests-rates
        interval: 30s
        rules:
          - record: envoy_proxy:req_rate:5m
            expr: sum by (httproute_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))

          - record: envoy_proxy:req_rate:5m_by_status
            expr: sum by (httproute_name, envoy_response_code) (rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))

      - name: envoy-proxy-requests-increase
        interval: 5m
        rules:
          - record: envoy_proxy:req_inc:5m
            expr: sum by (httproute_name) (increase(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))

          - record: envoy_proxy:req_inc:5m_by_status
            expr: sum by (httproute_name, envoy_response_code) (increase(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))


      - name: envoy-proxy-sizes
        interval: 30s
        rules:
          - record: envoy_proxy:req_bytes_rate:5m
            expr: sum by (httproute_name) (rate(envoy_cluster_upstream_cx_tx_bytes_total{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))

          - record: envoy_proxy:resp_bytes_rate:5m
            expr: sum by (httproute_name) (rate(envoy_cluster_upstream_cx_rx_bytes_total{envoy_cluster_name=~"httproute/.*", httproute_name!~".*-ssl-redirect"}[5m]))

          - record: envoy_proxy:req_size_avg_bytes:5m
            expr: envoy_proxy:req_bytes_rate:5m / clamp_min(envoy_proxy:req_rate:5m, 1)

          - record: envoy_proxy:resp_size_avg_bytes:5m
            expr: envoy_proxy:resp_bytes_rate:5m / clamp_min(envoy_proxy:req_rate:5m, 1)
