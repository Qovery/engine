defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: true
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeProxy: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeStateMetrics: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    windows: false

crds:
  enabled: false

alertmanager:
  enabled: false

nodeExporter:
  enabled: false # ToDo: check this
coreDns:
  enabled: false # Handled by AKS

kubeDns:
  enabled: false # Handled by AKS

grafana:
  enabled: false
  serviceMonitor:
    enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubelet:
  serviceMonitor:
    resource: true

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 90d
    retentionSize: "40GB"
    walCompression: true
    externalUrl: set-by-engine-code
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: set-by-engine-code
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "50Gi"
    resources:
      limits:
        cpu: set-by-engine-code
        memory: set-by-engine-code
      requests:
        cpu: set-by-engine-code
        memory: set-by-engine-code
    replicas: set-by-engine-code

prometheusOperator:
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false

prometheus-node-exporter:
  priorityClassName: set-by-engine-code
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code
  prometheus:
    monitor:
      enabled: false
