{%- if qovery_env.applications[application_index]['private_port'] %}
apiVersion: v1
kind: Service
metadata:
  name: {{ qovery_env.applications[application_index]['id'] }}-{{ qovery_env.environment_id }}
  namespace: {{ qovery_env.project_id }}
  labels:
    ownerId: {{ qovery_env.owner_id }}
    appId: {{ qovery_env.applications[application_index]['id'] }}
    envId: {{ qovery_env.environment_id }}
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: {{ qovery_env.applications[application_index]['private_port'] }}
      targetPort: {{ qovery_env.applications[application_index]['private_port'] }}
  selector:
    ownerId: {{ qovery_env.owner_id }}
    appId: {{ qovery_env.applications[application_index]['id'] }}
    envId: {{ qovery_env.environment_id }}
{% endif %}
