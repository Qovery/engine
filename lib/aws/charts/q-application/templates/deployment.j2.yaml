---
apiVersion: v1
kind: Secret
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
  labels:
    ownerId: {{ owner_id }}
    envId: {{ environment_id }}
    appId: {{ id }}
    app: {{ name }}
type: Opaque
stringData:
{%- for ev in environment_variables %}
    {{ ev.key }}: "{{ ev.value }}"
{%- endfor %}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
  labels:
    ownerId: {{ owner_id }}
    envId: {{ environment_id }}
    appId: {{ id }}
    app: {{ name }}
spec:
  replicas: {{ total_instances }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      ownerId: {{ owner_id }}
      envId: {{ environment_id }}
      appId: {{ id }}
      app: {{ name }}
  template:
    metadata:
      labels:
        ownerId: {{ owner_id }}
        envId: {{ environment_id }}
        appId: {{ id }}
        app: {{ name }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                    - {{ name }}
                  - key: "envId"
                    operator: In
                    values:
                    - {{ environment_id }}
              topologyKey: "kubernetes.io/hostname"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {}
      containers:
        - name: {{ name }}
          image: "{{ image_name_with_tag }}"
          env:
            {%- for ev in environment_variables %}
            - name: "{{ ev.key }}"
              valueFrom:
                secretKeyRef:
                  name: {{ name }}
                  key: {{ ev.key }}
            {%- endfor %}
            {%- if private_port %}
          ports:
            - containerPort: {{ private_port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ private_port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ private_port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            {%- endif %}
          resources:
            limits:
              cpu: {{ total_cpus }}
              memory: {{ total_ram_in_mib }}Mi
            requests:
              cpu: {{ total_cpus }}
              memory: {{ total_ram_in_mib }}Mi
{%- if is_storage %}
          volumeMounts:
{%- for s in storage %}
            - name: {{ s.id }}
              mountPath: {{ s.mount_point }}
{%- endfor %}
{%- endif %}
{%- if is_storage %}
      volumes:
{%- for s in storage %}
        - name: {{ s.id }}
          persistentVolumeClaim:
            claimName: {{ s.id }}
{%- endfor %}
{%- endif %}
