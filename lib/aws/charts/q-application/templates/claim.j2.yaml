{%- if is_storage %}
{%- for s in storage %}
{% if clone %}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ s.id }}
  namespace: {{ namespace }}
  labels:
    ownerId: {{ owner_id }}
    envId: {{ environment_id }}
    appId: {{ id }}
    diskId: {{ s.id }}
    diskType: {{ s.storage_type }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-ebs-{{ s.storage_type }}-{{ s.snapshot_retention_in_days }}
  dataSource:
    name: {{ s.id }}
    kind: PersistentVolumeClaim
  resources:
    requests:
      storage: {{ disk['size_in_gib'] }}Gi
{% else %}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ s.id }}
  namespace: {{ namespace }}
  labels:
    ownerId: {{ owner_id }}
    envId: {{ environment_id }}
    appId: {{ id }}
    diskId: {{ s.id }}
    diskType: {{ s.storage_type }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-ebs-{{ s.storage_type }}-{{ s.snapshot_retention_in_days }}
  resources:
    requests:
      storage: {{ s.size_in_gib }}Gi
{%- endif %}
{%- endfor %}
{%- endif %}
