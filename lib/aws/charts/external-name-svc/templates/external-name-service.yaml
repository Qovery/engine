kind: Service
apiVersion: v1
metadata:
  # This service is used for deployed services that do not have ingress like database
  # It is used to provide to the end user a endpoint with desired name
  name: dns-{{.Values.app_id}}
  labels:
    appId: {{.Values.app_id}}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.target_hostname }}
spec:
  type: ExternalName
  externalName: {{ .Values.source_fqdn }}
