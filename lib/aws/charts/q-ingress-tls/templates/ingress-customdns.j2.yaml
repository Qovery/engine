{%- for custom_domain in custom_domains %}
---
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ name }}-{{ custom_domain.domain_hash }}
  namespace: {{ namespace }}
  labels:
    ownerId: {{ owner_id }}
    routerId: {{ name }}
    envId: {{ environment_id }}
    fqdn: "{{ custom_domain.domain }}"
    fqdnId: {{ custom_domain.domain_hash }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    kubernetes.io/tls-acme: "true"
    cert-manager.io/issuer: "{{ custom_domain.domain_hash }}"
    kubernetes.io/ingress.class: "nginx-{{ project_id }}"
    external-dns.alpha.kubernetes.io/hostname: {{ custom_domain.target_domain }}
    external-dns.alpha.kubernetes.io/ttl: "300"
{%- if not pre_validation %}
    external-dns.alpha.kubernetes.io/target: "{{ qovery_env.get_ingress_fqdn(qovery_env.project_id) }}"
{%- endif %}
spec:
  tls:
    - hosts:
        - {{ custom_domain.domain }}
        - {{ custom_domain.target_domain }}
      secretName: le-{{ custom_domain.domain_hash }}-custom-cert
  rules:
    - host: "{{ custom_domain.target_domain }}"
      http:
        paths:
        {%- for route in routes %}
          - path: {{ route.path }}
            backend:
              serviceName: "{{ route.application_name }}"
              servicePort: {{ route.application_port }}
        {%- endfor %}
    - host: "{{ custom_domain.domain }}"
      http:
        paths:
        {%- for route in routes %}
          - path: {{ route.path }}
            backend:
              serviceName: "{{ route.application_name }}"
              servicePort: {{ route.application_port }}
        {%- endfor %}
{%- endfor %}
