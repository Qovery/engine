clusterName: set-by-engine-code

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: set-by-engine-code

replicaCount: set-by-engine-code

enableServiceMutatorWebhook: set-by-engine-code
enableCertManager: true

# Since VPA is activated for this chart, HPA is not relevant here.
# Number of replicas is customizable via cluster advanced settings.
autoscaling:
  enabled: false
#   minReplicas: set-by-engine-code
#   maxReplicas: set-by-engine-code

resources:
  limits:
    cpu: set-by-engine-code
    memory: set-by-engine-code
  requests:
    cpu: set-by-engine-code
    memory: set-by-engine-code