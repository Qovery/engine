gatewayClass:
  qoveryPublic:
    enable: set-by-engine
    accessLog:
      format: set-by-engine
    hpa:
      enabled: set-by-engine
      minReplicas: set-by-engine
      maxReplicas: set-by-engine
      targetCPUUtilizationPercentage: set-by-engine
      targetMemoryUtilizationPercentage: set-by-engine
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "karpenter.sh/nodepool"
                  operator: "In"
                  values: ["stable"]
                - key: "karpenter.sh/capacity-type"
                  operator: "NotIn"
                  values: ["spot"]
    tolerations:
      - key: "nodepool/stable"
        operator: "Exists"
        effect: "NoSchedule"
  qoveryPrivate:
    enable: set-by-engine
    accessLog:
      format: set-by-engine
    hpa:
      enabled: set-by-engine
      minReplicas: set-by-engine
      maxReplicas: set-by-engine
      targetCPUUtilizationPercentage: set-by-engine
      targetMemoryUtilizationPercentage: set-by-engine
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "karpenter.sh/nodepool"
                  operator: "In"
                  values: ["stable"]
                - key: "karpenter.sh/capacity-type"
                  operator: "NotIn"
                  values: ["spot"]
    tolerations:
      - key: "nodepool/stable"
        operator: "Exists"
        effect: "NoSchedule"
