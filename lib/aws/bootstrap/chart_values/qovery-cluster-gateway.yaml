dns:
  domain: set-by-engine-code

certManagerNamespace: "cert-manager"

gateway:
  qoveryPublic:
    enable: true
    enableProxyProtocol: true
    withUnderscoresAction: "DropHeader"
    xForwardedFor:
      numberTrustedHops: null
      trustedCIDRs: []
    timeout:
      http:
        streamIdleTimeoutSeconds: null
    customHttpErrors:
      default: null
    compression:
      enable: true
    defaultBackend:
      enable: false
      image: null
      tag: null

envoyProxy:
  qoveryPublic:
    provider:
      kubernetes:
        envoyService:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: "external"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "set-by-engine-code"
            service.beta.kubernetes.io/aws-load-balancer-name: "set-by-engine-code"
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
            service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
            service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "set-by-engine-code"
            service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
            # Can use AWS defaults or set via AWS Load Balancer Controller configuration.
            # This entry is intentionally placed on EnvoyProxy envoyService annotations,
            # not Gateway.spec.infrastructure.annotations, to avoid Gateway's max-8 validation limit.
            # service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "target_health_state.unhealthy.connection_termination.enabled=false,target_health_state.unhealthy.draining_interval_seconds=300"

# metrics are enabled only when prometheus is installed
metrics:
  enabled: set-by-engine-code
  podMonitor:
    enabled: set-by-engine-code
    additionalLabels:
      release: kube-prometheus-stack
