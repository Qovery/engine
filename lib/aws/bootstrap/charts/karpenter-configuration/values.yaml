# Default values for karpenter-configuration.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

clusterName: ""

securityGroupId: ""

diskSize: 0Gi
diskIops: null
diskThroughput: null
storageClass: gp3

capacity_type: []
explicitSubnetIds: []

amiSelectorTermsAlias: ""
gpuAmiSelectorTermsName: ""
kubernetesVersion: ""
isBottlerocket: false
amiFamily: AL2023

isCustomAmi: false
customAmiId: ""
customAmiName: ""

gpuAmiFamily: AL2023
gpuIsBottlerocket: false

tags:
  ClusterId: ""
  ClusterLongId: ""
  OrganizationId: ""
  OrganizationLongId: ""
  Region: ""

# to configure all the node pools (later we can have a section by node pool)
global_node_pools:
  requirements: []
  terminationGracePeriod: 1h
stableNodePool:
  consolidateAfter: 30s
  consolidation:
    budgets: []
  limits:
    maxCpu: ""
    maxMemory: ""
defaultNodePool:
  consolidateAfter: 1m
  limits:
    maxCpu: ""
    maxMemory: ""
gpuNodePool:
  enable: false
  consolidateAfter: 30s
  requirements: []
  consolidation:
    budgets: []
  limits:
    maxCpu: ""
    maxMemory: ""
  diskSize: 100Gi
  diskIops: null
  diskThroughput: null
