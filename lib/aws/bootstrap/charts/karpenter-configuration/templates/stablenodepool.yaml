apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: stable
spec:
  template:
    spec:
      requirements:
        {{- range .Values.stableNodePool.requirements }}
        - key: "{{ .key }}"
          operator: "{{ .operator }}"
          values:
            {{- range .values }}
            - "{{ . }}"
            {{- end }}
          {{- if .minValues }}
          minValues: {{ .minValues }}
          {{- end }}
        {{- end }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: {{ .Values.stableNodePool.taintKey | quote }}
          effect: NoSchedule
      expireAfter: 720h # 30 * 24h = 720h
      terminationGracePeriod: {{ .Values.global_node_pools.terminationGracePeriod }}
  disruption:
    consolidationPolicy: {{ .Values.stableNodePool.consolidationPolicy | default "WhenEmptyOrUnderutilized" }}
    consolidateAfter: {{ .Values.stableNodePool.consolidateAfter }}
    budgets:
      # By default, 10% is set: it applies for any kind of disruption (Empty, Drifted, Underutilized)
      - nodes: 10%
      # Core adds zero-node budgets for Underutilized consolidation and, when configured,
      # for Drifted replacements during the daily blocking window.
      {{- range .Values.stableNodePool.consolidation.budgets }}
      - nodes: {{ .nodes | quote }}
        reasons:
          {{- range .reasons }}
          - "{{ . }}"
          {{- end }}
        duration: {{ .duration }}
        schedule: {{ .schedule | quote }}
      {{- end }}
  {{- if not (and (empty .Values.stableNodePool.limits.maxCpu) (empty .Values.stableNodePool.limits.maxMemory)) }}
  limits:
    cpu: {{ .Values.stableNodePool.limits.maxCpu }}
    memory: {{ .Values.stableNodePool.limits.maxMemory }}
  {{- end }}
  weight: 10
