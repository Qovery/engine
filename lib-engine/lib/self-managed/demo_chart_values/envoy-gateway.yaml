global:
  images:
    envoyProxy:
      # HACK(QOV-2454): Pin the security-patched Envoy image until Envoy Gateway ships it.
      # TODO(QOV-2454): Remove this override when the chart includes Envoy v1.39.5 or newer.
      # https://qovery.atlassian.net/browse/QOV-2454
      image: docker.io/envoyproxy/envoy:distroless-v1.39.5

config:
  envoyGateway:
    gateway:
      controllerName: qovery.com/gateway-controller
    extensionApis:
      enableLua: true
    logging:
      level:
        default: warn

# CRDs are installed by the dedicated envoy-gateway-crd chart.
crds:
  enabled: false

service:
  annotations: {}

hpa:
  enabled: false

deployment:
  replicas: 1
  envoyGateway:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

podDisruptionBudget:
  maxUnavailable: 1
