dns:
  domain: set-by-engine-code

certManagerNamespace: "qovery"

gateway:
  qoveryPublic:
    enable: true
    enableProxyProtocol: false
    proxyProtocol:
      optional: true
    withUnderscoresAction: "DropHeader"
    xForwardedFor:
      numberTrustedHops: null
      trustedCIDRs: []
    timeout:
      http:
        streamIdleTimeoutSeconds: null
    customHttpErrors:
      default: null
    compression:
      enable: true
    defaultBackend:
      enable: false
      image: null
      tag: null

envoyProxy:
  qoveryPublic:
    accessLog:
      format: "set-by-engine"
    provider:
      kubernetes:
        envoyDeployment:
          pod:
            affinity: null
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: topology.kubernetes.io/zone
                maxSkew: 1
                whenUnsatisfiable: ScheduleAnyway
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: kubernetes.io/hostname
                maxSkew: 1
                whenUnsatisfiable: ScheduleAnyway
            tolerations: null
        envoyHpa: {}
        envoyPDB:
          maxUnavailable: 1
        envoyService:
          annotations: {}

# metrics are enabled only when prometheus is installed
metrics:
  enabled: set-by-engine-code
  podMonitor:
    enabled: set-by-engine-code
    additionalLabels:
      release: kube-prometheus-stack
