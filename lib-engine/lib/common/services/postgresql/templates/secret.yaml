apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql18.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "postgresql18.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ required "auth.password is required" .Values.auth.password | b64enc | quote }}
