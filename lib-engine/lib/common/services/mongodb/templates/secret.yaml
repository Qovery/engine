apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
data:
  mongodb-root-password: {{ required "auth.rootPassword is required" .Values.auth.rootPassword | b64enc | quote }}
  mongodb-password: {{ required "auth.password is required" .Values.auth.password | b64enc | quote }}
