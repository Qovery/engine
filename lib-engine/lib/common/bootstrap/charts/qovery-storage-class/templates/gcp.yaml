{{- end }}
{{- if include "qovery-storage-class.renderable" (dict "root" $ "name" "gcp-pd-standard") }}
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: gcp-pd-standard
  annotations:
    qovery.com/source: platform-catalog
  labels:
    qovery-type: "hdd"
provisioner: pd.csi.storage.gke.io
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: pd-standard
{{- end }}
{{- end }}
