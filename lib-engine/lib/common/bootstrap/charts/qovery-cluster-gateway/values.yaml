dns:
  domain: ""

certManagerNamespace: "cert-manager"

gateway:
  qoveryPublic:
    enable: true
    annotations: {}
    enableProxyProtocol: true
    proxyProtocol:
      optional: true
    withUnderscoresAction: "DropHeader"
    xForwardedFor:
      numberTrustedHops: null
      trustedCIDRs: []
    timeout:
      http:
        streamIdleTimeoutSeconds: null
    customHttpErrors:
      default: ""
    compression:
      enable: true
    defaultBackend:
      enable: false
      image: null
      tag: null

envoyProxy:
  qoveryPublic:
    provider:
      kubernetes:
        envoyService:
          annotations: {}

metrics:
  enabled: false
  podMonitor:
    enabled: false
    additionalLabels:
      release: kube-prometheus-stack
