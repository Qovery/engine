{{- if .Values.gateway.qoveryPublic.enable }}
{{- if or .Values.gateway.qoveryPublic.customHttpErrors.default .Values.gateway.qoveryPublic.compression.enable }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: qovery-cluster-public-gateway-backend-traffic-policy
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: qovery-cluster-public-gateway
  {{- if .Values.gateway.qoveryPublic.customHttpErrors.default }}
  responseOverride:
    {{- range $code := split "," .Values.gateway.qoveryPublic.customHttpErrors.default }}
    - match:
        statusCodes:
          - type: Value
            value: {{ $code | trim }}
      response:
        contentType: text/html
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: qovery-cluster-gateway-default-error-pages
            key: {{ $code | trim }}.html
    {{- end }}
  {{- end }}
  {{- if .Values.gateway.qoveryPublic.compression.enable }}
  compressor:
    # Brotli compression with quality=6 (matches nginx brotli-level: 6)
    - type: Brotli
      brotli:
        quality: 6
    # Zstd compression with level=6 (default is 3)
    - type: Zstd
      zstd:
        compression_level: 6
    # Gzip compression with level=6 (matches nginx gzip-level: 6)
    - type: Gzip
      gzip:
        compression_level: COMPRESSION_LEVEL_6
  {{- end }}
{{- end }}
{{- end }}
