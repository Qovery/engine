{{- with .Values.gateway.qoveryPublic.clientValidation }}
  {{- with .caCertificates }}
    {{- range . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | quote }}
type: Opaque
data:
  ca.crt: {{ .caCrt | b64enc }}
    {{- end }}
  {{- end }}
{{- end }}
