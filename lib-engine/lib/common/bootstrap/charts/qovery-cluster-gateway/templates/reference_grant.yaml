---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: qovery-cluster-allow-gateway-to-cert-manager-secrets
  namespace: cert-manager
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: qovery
  to:
  - group: ""
    kind: Secret
    name: letsencrypt-acme-qovery-cert