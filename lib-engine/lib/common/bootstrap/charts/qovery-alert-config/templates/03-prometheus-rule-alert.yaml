{{- $root := . -}}
{{- $ns := $root.Values.namespace | default $root.Release.Namespace -}}
{{- range $i, $target := $root.Values.targets }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ regexReplaceAll "[^a-z0-9-]" (lower $target.id) "-" | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ns }}
  labels:
    release: kube-prometheus-stack
    alertmanager: main
    app.kubernetes.io/managed-by: qovery-alert-config
    qovery_target_id: {{ $target.target_id | quote }}
    qovery_target_type: {{ $target.target_type | quote }}
    {{- with $root.Values.extraLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ default $root.Values.groupName (printf "%s.rules" $target.target_type) }}
    {{- if $root.Values.interval }}
      interval: {{ $root.Values.interval }}
    {{- end }}
      rules:
      {{- range $j, $a := $target.alerts }}
        - alert: {{ $a.name }}
          expr: {{ $a.expr | quote }}
        {{- if $a.for }}
          for: {{ $a.for }}
        {{- end }}
          labels:
            namespace: {{ $target.namespace | quote }}
            qovery_alert_long_id: {{ $a.alert_long_id | quote }}
            qovery_target_id: {{ $target.target_id | quote }}
            qovery_target_type: {{ $target.target_type | quote }}
            qovery_version: {{ $a.version | quote }}
          {{- with $root.Values.commonLabels }}
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $a.labels }}
{{ toYaml . | nindent 12 }}
          {{- end }}
        {{- if or $root.Values.commonAnnotations $a.annotations }}
          annotations:
          {{- with $root.Values.commonAnnotations }}
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $a.annotations }}
{{ toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
---
{{- end }}