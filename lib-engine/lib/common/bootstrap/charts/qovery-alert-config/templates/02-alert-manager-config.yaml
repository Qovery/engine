{{- $root := . -}}
{{- if $root.Values.receivers }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $root.Values.alertManagerConfigName | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Values.namespace | default $root.Release.Namespace }}
  labels:
    alertmanager: main
spec:
  route:
    receiver: default
    groupBy:
      - qovery_target_id
    routes:
{{- range $i, $rcv := $root.Values.receivers }}
      - matchers:
          - name: {{ $rcv.matcher_label }}
            value: "true"
            matchType: "="
        receiver: {{ $rcv.id }}
        continue: true
{{- end }}
  receivers:
    - name: default
{{- range $i, $rcv := $root.Values.receivers }}
{{- $rcvName := $rcv.id }}
{{- $rcvSafe := regexReplaceAll "[^a-z0-9-]" (lower $rcvName) "-" }}
{{- $secret := $rcv.id | trunc 63 | trimSuffix "-" }}
    - name: {{ $rcvName }}
    {{- if $rcv.slack }}
      slackConfigs:
        - channel: {{ $rcv.slack.channel }}
          title: >-
            {{`
            {{ .CommonAnnotations.qovery_target_name }}{{ if gt (len .Alerts.Firing) 0 }} - {{ len .Alerts.Firing }} alert(s) firing{{ end }}
            `}}
          titleLink: {{`https://console.qovery.com/organization/{{ .CommonAnnotations.qovery_organization_long_id }}/alerting/issues`}}
          text: >-
            {{`{{ range $i, $alert := .Alerts }}
            {{ if eq $alert.Status "firing" }}🔥{{ else }}✅{{ end }} {{ if $alert.Annotations.qovery_alert_display_name }}{{ $alert.Annotations.qovery_alert_display_name }}{{ else }}{{ $alert.Labels.alertname }}{{ end }} - {{ if $alert.Annotations.description }}{{ $alert.Annotations.description }}{{ end }} - {{ $alert.Annotations.severity }} Severity
            {{ if $alert.Annotations.summary }}
               {{ $alert.Annotations.summary }}
            {{ end }}

            {{ end }}`}}
          footer: "Please review the service in the Qovery console"
          actions:
            - type: button
              text: "All issues"
              url: "{{`https://console.qovery.com/organization/{{ .CommonAnnotations.qovery_organization_long_id }}/alerting/issues`}}"
            - type: button
              text: "Service Monitoring"
              url: "{{`{{ $alert := index .Alerts 0 }}{{.CommonAnnotations.qovery_target_base_url}}/application/{{ .CommonLabels.qovery_target_id }}/monitoring/dashboard?isLiveUpdateEnabled=0&startDate={{ $alert.StartsAt.Format \"2006-01-02T15:04:05.000Z\" }}&endDate={{ $alert.StartsAt.Format \"2006-01-02T15:04:05.000Z\" }}&timeRange=custom`}}"
            - type: button
              text: "Service Logs"
              url: "{{`{{ $alert := index .Alerts 0 }}{{.CommonAnnotations.qovery_target_base_url}}/logs/{{ .CommonLabels.qovery_target_id }}/service-logs?isLiveUpdateEnabled=0&startDate={{ $alert.StartsAt.Format \"2006-01-02T15:04:05.000Z\" }}&endDate={{ $alert.StartsAt.Format \"2006-01-02T15:04:05.000Z\" }}&timeRange=custom`}}"
          sendResolved: {{ default true $rcv.slack.sendResolved }}
          groupInterval: 5m
          groupWait: 30s
          repeatInterval: 4h
          apiURL:
            name: {{ $secret }}
            key: "url"
    {{- end }}
    {{- if $rcv.email }}
      emailConfigs:
        - to: {{ required (printf "receivers[%d].email.to is required" $i) $rcv.email.to | quote }}
          from: {{ required (printf "receivers[%d].email.from is required" $i) $rcv.email.from | quote }}
          smarthost: {{ required (printf "receivers[%d].email.smarthost is required" $i) $rcv.email.smarthost | quote }}
          {{- if $rcv.email.authUsername }}
          authUsername: {{ $rcv.email.authUsername | quote }}
          {{- end }}
          {{- if $rcv.email.authPassword }}
          authPassword:
            name: {{ $secret }}
            key: "smtp-password"
          {{- end }}
          requireTLS: {{ default true $rcv.email.requireTLS }}
          sendResolved: {{ default true $rcv.email.sendResolved }}
          headers:
            - key: "Subject"
              value: >-
                {{`[{{ .Status }}] {{ .CommonAnnotations.qovery_target_name }}{{ if gt (len .Alerts.Firing) 0 }} - {{ len .Alerts.Firing }} alert(s) firing{{ end }}`}}
          html: >-
            {{`<!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                .alert { padding: 15px; margin: 10px 0; border-radius: 5px; }
                .firing { background-color: #ffebee; border-left: 4px solid #f44336; }
                .resolved { background-color: #e8f5e9; border-left: 4px solid #4caf50; }
                .alert-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
                .alert-description { margin: 5px 0; }
                .alert-summary { margin: 5px 0; color: #666; }
                .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ccc; color: #666; font-size: 12px; }
                .button { display: inline-block; padding: 10px 20px; margin: 5px; background-color: #5e35b1; color: white; text-decoration: none; border-radius: 4px; }
              </style>
            </head>
            <body>
              <h2>{{ .CommonAnnotations.qovery_target_name }}</h2>
              {{ range .Alerts }}
              <div class="alert {{ if eq .Status "firing" }}firing{{ else }}resolved{{ end }}">
                <div class="alert-title">
                  {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }}
                  {{ if .Annotations.qovery_alert_display_name }}{{ .Annotations.qovery_alert_display_name }}{{ else }}{{ .Labels.alertname }}{{ end }}
                  {{ if .Annotations.severity }}- {{ .Annotations.severity }} Severity{{ end }}
                </div>
                {{ if .Annotations.description }}
                <div class="alert-description">{{ .Annotations.description }}</div>
                {{ end }}
                {{ if .Annotations.summary }}
                <div class="alert-summary">{{ .Annotations.summary }}</div>
                {{ end }}
              </div>
              {{ end }}
              <div class="footer">
                <p>View all issues in the Qovery console:</p>
                <a href="https://console.qovery.com/organization/{{ .CommonAnnotations.qovery_organization_long_id }}/alerting/issues" class="button">View All Issues</a>
                {{ $alert := index .Alerts 0 }}
                <a href="{{ .CommonAnnotations.qovery_target_base_url }}/application/{{ .CommonLabels.qovery_target_id }}/monitoring/dashboard?isLiveUpdateEnabled=0&startDate={{ $alert.StartsAt.Format "2006-01-02T15:04:05.000Z" }}&endDate={{ $alert.StartsAt.Format "2006-01-02T15:04:05.000Z" }}&timeRange=custom" class="button">Service Monitoring</a>
                <a href="{{ .CommonAnnotations.qovery_target_base_url }}/logs/{{ .CommonLabels.qovery_target_id }}/service-logs?isLiveUpdateEnabled=0&startDate={{ $alert.StartsAt.Format "2006-01-02T15:04:05.000Z" }}&endDate={{ $alert.StartsAt.Format "2006-01-02T15:04:05.000Z" }}&timeRange=custom" class="button">Service Logs</a>
              </div>
            </body>
            </html>`}}
    {{- end }}
{{- end }}
{{- end }}