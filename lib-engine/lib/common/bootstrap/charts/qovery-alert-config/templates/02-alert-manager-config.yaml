{{- $root := . -}}
{{- if $root.Values.receivers }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $root.Values.alertManagerConfigName | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Values.namespace | default $root.Release.Namespace }}
  labels:
    alertmanager: main
spec:
  route:
    receiver: default
    routes:
{{- range $i, $rcv := $root.Values.receivers }}
      - matchers:
          - name: {{ $rcv.matcher_label }}
            value: "true"
            matchType: "="
        receiver: {{ $rcv.id }}
        continue: true
{{- end }}
  receivers:
    - name: default
{{- range $i, $rcv := $root.Values.receivers }}
{{- $rcvName := $rcv.id }}
{{- $rcvSafe := regexReplaceAll "[^a-z0-9-]" (lower $rcvName) "-" }}
{{- $secret := $rcv.id | trunc 63 | trimSuffix "-" }}
    - name: {{ $rcvName }}
    {{- if $rcv.slack }}
      slackConfigs:
        - channel: {{ $rcv.slack.channel }}
          title: >-
             {{`{{ if .CommonLabels.alertname }}`}}{{`{{ .CommonLabels.alertname }}`}}
             {{`{{ else if .GroupLabels.alertname }}`}}{{`{{ .GroupLabels.alertname }}`}}
             {{`{{ else if .Alerts }}`}}{{`{{ (index .Alerts 0).Labels.alertname }}`}}
             {{`{{ else }}`}}Alert{{`{{ end }}`}}
          text: >-
             {{`{{ if .CommonAnnotations.summary }}`}}
               {{`{{ .CommonAnnotations.summary }}`}}
             {{`{{ else if .CommonAnnotations.description }}`}}
               {{`{{ .CommonAnnotations.description }}`}}
             {{`{{ else if .Alerts }}`}}
               {{`{{ (index .Alerts 0).Annotations.description }}`}}
             {{`{{ end }}`}}
             {{` {{ range .Alerts }}`}}
             {{` *Alert:* {{ .Labels.alertname }}`}}
             {{` *Severity:* {{ .Annotations.severity }}`}}
             {{` *TargetType:* {{ .CommonLabels.qovery_target_type }}`}}
             {{` *TargetId:* {{ .CommonLabels.qovery_target_id }}`}}
             {{` *Description:* {{ .Annotations.description }}`}}
             {{` *Summary:* {{ .Annotations.summary }}`}}
             {{` *runbook_url:* {{ .Annotations.runbook_url }}`}}
             {{`{{ end }}`}}
          sendResolved: {{ default true $rcv.slack.sendResolved }}
          groupBy:
            - alertname                                                                                                                                                                                                                                                                                        │
            - qovery_alert_long_id                                                                                                                                                                                                                                                                             │
            - qovery_target_id
          groupInterval: 5m                                                                                                                                                                                                                                                                                  │
          groupWait: 30s
          repeatInterval: 4h
          apiURL:
            name: {{ $secret }}
            key: "url"
    {{- end }}
{{- end }}
{{- end }}