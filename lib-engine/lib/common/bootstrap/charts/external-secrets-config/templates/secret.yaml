{{- range .Values.authentications }}
{{- if eq .type "aws-static" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-credentials" .name) .secretName }}
  {{- if .secretNamespace }}
  namespace: {{ .secretNamespace }}
  {{- else }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .accessKeyId | quote }}
  secret-access-key: {{ .secretAccessKey | quote }}
{{- else if eq .type "gcp-static" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-credentials" .name) .secretName }}
  {{- if .secretNamespace }}
  namespace: {{ .secretNamespace }}
  {{- else }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
type: Opaque
stringData:
  credentials: {{ .jsonCredentials | toJson | quote }}
{{- end }}
{{- end }}
