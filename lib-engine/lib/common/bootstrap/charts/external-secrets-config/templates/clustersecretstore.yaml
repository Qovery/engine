{{- range .Values.authentications }}
{{- if eq .type "aws-iam" }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
    qovery.com/secret-manager-access-id: {{ .secretManagerAccessId }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .serviceAccount.name }}
            {{- if .serviceAccount.namespace }}
            namespace: {{ .serviceAccount.namespace }}
            {{- else }}
            namespace: {{ $.Release.Namespace }}
            {{- end }}
{{- else if eq .type "aws-static" }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
    qovery.com/secret-manager-access-id: {{ .secretManagerAccessId }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .region }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ default (printf "%s-credentials" .name) .secretName }}
            key: access-key-id
            {{- if .secretNamespace }}
            namespace: {{ .secretNamespace }}
            {{- else }}
            namespace: {{ $.Release.Namespace }}
            {{- end }}
          secretAccessKeySecretRef:
            name: {{ default (printf "%s-credentials" .name) .secretName }}
            key: secret-access-key
            {{- if .secretNamespace }}
            namespace: {{ .secretNamespace }}
            {{- else }}
            namespace: {{ $.Release.Namespace }}
            {{- end }}
{{- else if eq .type "gcp-workload-identity" }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
    qovery.com/secret-manager-access-id: {{ .secretManagerAccessId }}
spec:
  provider:
    gcpsm:
      projectID: {{ .projectId | quote }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: {{ .serviceAccount.name }}
            {{- if .serviceAccount.namespace }}
            namespace: {{ .serviceAccount.namespace }}
            {{- else }}
            namespace: {{ $.Release.Namespace }}
            {{- end }}
{{- else if eq .type "gcp-static" }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels:
    {{- include "external-secrets-config.labels" $ | nindent 4 }}
    qovery.com/secret-manager-access-id: {{ .secretManagerAccessId }}
spec:
  provider:
    gcpsm:
      projectID: {{ .projectId | quote }}
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: {{ default (printf "%s-credentials" .name) .secretName }}
            key: credentials
            {{- if .secretNamespace }}
            namespace: {{ .secretNamespace }}
            {{- else }}
            namespace: {{ $.Release.Namespace }}
            {{- end }}
{{- end }}
{{- end }}
