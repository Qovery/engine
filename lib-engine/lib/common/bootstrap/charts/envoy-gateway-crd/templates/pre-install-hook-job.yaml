{{- if .Values.preInstallHook.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pre-install-{{ .Release.Revision | default "1" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-pre-install
      restartPolicy: OnFailure
      containers:
        - name: delete-validating-admission-policy
          image: {{ .Values.preInstallHook.image.repository }}:{{ .Values.preInstallHook.image.tag }}
          imagePullPolicy: {{ .Values.preInstallHook.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Checking for Gateway API ValidatingAdmissionPolicy..."

              # Delete the ValidatingAdmissionPolicyBinding first (if it exists)
              if kubectl get validatingadmissionpolicybinding safe-upgrades.gateway.networking.k8s.io 2>/dev/null; then
                echo "Deleting ValidatingAdmissionPolicyBinding: safe-upgrades.gateway.networking.k8s.io"
                kubectl delete validatingadmissionpolicybinding safe-upgrades.gateway.networking.k8s.io --ignore-not-found=true
              else
                echo "ValidatingAdmissionPolicyBinding not found, skipping"
              fi

              # Delete the ValidatingAdmissionPolicy (if it exists)
              if kubectl get validatingadmissionpolicy safe-upgrades.gateway.networking.k8s.io 2>/dev/null; then
                echo "Deleting ValidatingAdmissionPolicy: safe-upgrades.gateway.networking.k8s.io"
                kubectl delete validatingadmissionpolicy safe-upgrades.gateway.networking.k8s.io --ignore-not-found=true
              else
                echo "ValidatingAdmissionPolicy not found, skipping"
              fi

              echo "Pre-install hook completed successfully"
          resources:
            # GKE Autopilot requires both requests and limits to be set
            {{- if .Values.preInstallHook.resources }}
            {{- toYaml .Values.preInstallHook.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
            {{- end }}
          securityContext:
            # GKE Autopilot compatible security context
            {{- if .Values.preInstallHook.securityContext }}
            {{- toYaml .Values.preInstallHook.securityContext | nindent 12 }}
            {{- else }}
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            {{- end }}
      {{- with .Values.preInstallHook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.preInstallHook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
