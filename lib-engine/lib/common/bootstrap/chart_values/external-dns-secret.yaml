## @param namespace Namespace where the secret will be created
namespace: set-by-engine-code

## @param provider DNS provider type (cloudflare, pdns, route53)
provider: set-by-engine-code

## PowerDNS configuration
pdns:
  ## @param pdns.apiKey PowerDNS API key
  apiKey: null # set-by-engine-code

## Cloudflare configuration
cloudflare:
  ## @param cloudflare.apiToken Cloudflare API token (recommended method)
  apiToken: null # set-by-engine-code
  ## @param cloudflare.apiKey Cloudflare API key (legacy method, requires email)
  apiKey: null # set-by-engine-code
  ## @param cloudflare.email Cloudflare email (required for API key method)
  email: null # set-by-engine-code

## AWS Route 53 configuration
route53:
  ## @param route53.accessKeyId AWS Access Key ID
  accessKeyId: null # set-by-engine-code
  ## @param route53.secretAccessKey AWS Secret Access Key
  secretAccessKey: null # set-by-engine-code
  ## @param route53.region AWS region
  region: null # set-by-engine-code
