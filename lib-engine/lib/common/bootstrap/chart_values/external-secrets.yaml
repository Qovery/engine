installCRDs: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 50m
    memory: 128Mi

# IRSA configuration
# For EKS: If uses AUTOMATIC or ARN_ROLE => create service account having the ARN role
# For GCP: If uses AUTOMATIC => create service account
serviceAccount:
  create: set-by-engine-code
  name: set-by-engine-code

webhook:
  create: true
  certManager:
    enabled: true
    cert:
      issuerRef:
        group: cert-manager.io
        kind: "Issuer"
        name: "self-signed-eso-webhook-issuer"
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 20m
      memory: 32Mi

# Disable explicitly cert-controller
certController:
  create: false
