# remove if you don't want to use a custom image
loki:
  podLabels: {}
  # remove if you don't want to use a custom image
  image:
    registry: set-by-engine-code
    repository: set-by-engine-code
    tag: "3.7.1"
  # set if you want to use authentication
  auth_enabled: false
  commonConfig:
    # for simple usage, without high throughput, you can use the 1 replica only
    # note: replication is assured by the storage backend
    replication_factor: 1
  server:
    # Loki caps gRPC messages at 4MB by default. In SimpleScalable mode the querier streams
    # query results back to the query-frontend over gRPC; large results (wide time ranges /
    # high-cardinality streams) exceed 4MB and fail with:
    #   "error notifying frontend about finished query"
    #   err="grpc: received message larger than max (7522145 vs. 4194304)"
    # Raise both directions to 25MB (applies to every component sharing this config).
    grpc_server_max_recv_msg_size: 26214400
    grpc_server_max_send_msg_size: 26214400
  ingester:
    chunk_idle_period: 3m
    chunk_block_size: 262144
    chunk_retain_period: 1m
  limits_config:
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 30
    # Loki 3.x defaults max_line_size to 256KB (2.x was unlimited); apps emitting
    # bigger single lines got their entries rejected with 400 and dropped by Alloy.
    # Truncate instead of reject so oversized lines are kept up to 1MB.
    max_line_size: 1MB
    max_line_size_truncate: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_concurrent_tail_requests: 100
    split_queries_by_interval: 0 # Best performance on single pod
    max_query_lookback: 12w
    retention_period: set-by-engine-code
  compactor:
    working_directory: /var/loki/retention
    compaction_interval: 10m
    retention_enabled: set-by-engine-code
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    # required in Loki 3.x when retention_enabled is true
    delete_request_store: set-by-engine-code
  query_scheduler:
    # the TSDB index dispatches many more, but each individually smaller, requests.
    # We increase the pending request queue sizes to compensate.
    max_outstanding_requests_per_tenant: 32768
  querier:
    # Each `querier` component process runs a number of parallel workers to process queries simultaneously.
    # You may want to adjust this up or down depending on your resource usage
    # (more available cpu and memory can tolerate higher values and vice versa),
    # but we find the most success running at around `16` with tsdb
    max_concurrent: 16
  schemaConfig:
    configs:
      # set the schema for the index (2020 version can be deleted on a fresh install)
      - from: 2020-05-15
        store: boltdb-shipper
        object_store: set-by-engine-code
        schema: v11
        index:
          prefix: index_
          period: 24h
      - from: 2022-01-11
        store: boltdb-shipper
        object_store: set-by-engine-code
        schema: v12
        index:
          prefix: index_
          period: 24h
      - from: 2025-10-14
        store: tsdb
        object_store: set-by-engine-code
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    # configure the object storage backend
    bucketNames:
      chunks: set-by-engine-code
      ruler: set-by-engine-code
      admin: set-by-engine-code
    type: set-by-engine-code
    s3:
      s3: set-by-engine-code
      region: set-by-engine-code
      s3ForcePathStyle: set-by-engine-code
      insecure: set-by-engine-code
    gcs:
      chunkBufferSize: 0
      requestTimeout: "0s"
      enableHttp2: true
    azure:
      account_name: set-by-engine-code
      container_name: set-by-engine-code
      use_federated_token: true # Use federated token for authentication
  storage_config:
    gcs:
      bucket_name: set-by-engine-code
    boltdb_shipper:
      # shared_store removed in Loki 3.x
      active_index_directory: /var/loki/index
      resync_interval: 5s
      cache_location: /var/loki/boltdb-cache
    tsdb_shipper:
      # shared_store removed in Loki 3.x
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
    azure:
      account_name: set-by-engine-code
      container_name: set-by-engine-code
      use_federated_token: true # Use federated token for authentication

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
    metricsInstance:
      enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

test:
  enabled: false

gateway:
  enabled: false

sidecar:
  rules:
    enabled: set-by-engine-code

# singleBinary is disabled here (replicas: 0) for object-storage clusters;
# the loki_single_binary overlay flips it back on when deployment_mode = SingleBinary.
deploymentMode: SimpleScalable

singleBinary:
  replicas: 0
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code

write:
  replicas: 1
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code
  persistence:
    # emptyDir avoids requiring a PVC provisioner (no durability needed here).
    volumeClaimsEnabled: false

read:
  replicas: 1
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code

backend:
  replicas: 1
  resources:
    limits:
      cpu: set-by-engine-code
      memory: set-by-engine-code
    requests:
      cpu: set-by-engine-code
      memory: set-by-engine-code
  persistence:
    volumeClaimsEnabled: false

serviceAccount:
  name: null
  labels: {}
  annotations: {}
