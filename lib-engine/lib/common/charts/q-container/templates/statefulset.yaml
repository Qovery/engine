{{- if gt (len $.Values.service.storages) 0 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Values.service.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    envId: {{ $.Values.environment_short_id | quote }}
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: {{ $.Values.service.type | quote }}
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
    qovery.com/deployment-id: {{ $.Values.deployment_id | quote }}
    app.kubernetes.io/name: {{ $.Values.service.name | quote }}
    app.kubernetes.io/instance: {{ $.Values.service.long_id | quote }}
    app.kubernetes.io/component: {{ $.Values.service.type | quote }}
    app.kubernetes.io/part-of: {{ $.Values.namespace | quote }}
    app.kubernetes.io/managed-by: "qovery"
    app.kubernetes.io/version: {{ $.Values.service.image_tag_label | quote }}
    {{- range $key, $value := $.Values.labels_group.common }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
  annotations:
    releaseTime: {{ dateInZone "2006-01-02 15:04:05Z" (now) "UTC"| quote }}
    {{- range $key, $value := $.Values.annotations_group.stateful_set }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
spec:
  replicas: {{ $.Values.service.min_instances }}
  serviceName: {{ $.Values.service.name }}
  selector:
    matchLabels:
      {{- if $.Values.service.legacy_deployment_matchlabels }}
      app: {{ $.Values.service.name | quote }}
      appId: {{ $.Values.service.short_id | quote }}
      envId: {{ $.Values.environment_short_id | quote }}
      ownerId: FAKE
      {{- else }}
      qovery.com/service-id: {{ $.Values.service.long_id | quote }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- if $.Values.service.legacy_deployment_matchlabels }}
        app: {{ $.Values.service.name | quote }}
        appId: {{ $.Values.service.short_id | quote }}
        ownerId: FAKE
        {{- end }}
        envId: {{ $.Values.environment_short_id | quote }}
        qovery.com/service-id: {{ $.Values.service.long_id | quote }}
        qovery.com/service-type: {{ $.Values.service.type | quote }}
        qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
        qovery.com/project-id: {{ $.Values.project_long_id | quote }}
        app.kubernetes.io/name: {{ $.Values.service.name | quote }}
        app.kubernetes.io/instance: {{ $.Values.service.long_id | quote }}
        app.kubernetes.io/component: {{ $.Values.service.type | quote }}
        app.kubernetes.io/part-of: {{ $.Values.namespace | quote }}
        app.kubernetes.io/managed-by: "qovery"
        app.kubernetes.io/version: {{ $.Values.service.image_tag_label | quote }}
        {{- range $key, $value := $.Values.labels_group.common }}
        {{ $key | toJson }}: {{ $value | toJson }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config-mount-files: {{ include (print $.Template.BasePath "/mounted_files_secret.yaml") . | sha256sum }}
        {{- if $.Values.service.legacy_deployment_matchlabels }}
        appCommitId: {{ $.Values.service.version | quote }}
        {{- end }}
        qovery.com/service-version: {{ $.Values.service.version | quote }}
        {{- range $key, $value := $.Values.annotations_group.pods }}
        {{ $key | toJson }}: {{ $value | toJson }}
        {{- end }}
    spec:
      {{- if $.Values.service.tolerations }}
      tolerations:
      {{- range $key, $value := $.Values.service.tolerations }}
        - key: {{ $key | toJson }}
          operator: "Exists"
          effect: {{ $value | toJson }}
      {{- end }}
      {{- end }}
      affinity:
        {{- if $.Values.service.advanced_settings.deployment_affinity_node_required }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
        {{- range $key, $value := $.Values.service.advanced_settings.deployment_affinity_node_required }}
              - key: {{ $key | toJson }}
                operator: In
                values:
                - {{ $value | toJson }}
        {{- end }}
        {{- end }}
        podAntiAffinity:
          {{- if eq $.Values.service.advanced_settings.deployment_antiaffinity_pod "Required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
              - key: "qovery.com/service-id"
                operator: In
                values:
                - {{ $.Values.service.long_id | quote }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchExpressions:
                  - key: "qovery.com/service-id"
                    operator: In
                    values:
                    - {{ $.Values.service.long_id | quote }}
          {{- end }}
      {{- if ne $.Values.service.advanced_settings.deployment_topology_spread_zone "Disabled" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ $.Values.service.advanced_settings.deployment_topology_spread_zone }}
          labelSelector:
            matchLabels:
              qovery.com/service-id: {{ $.Values.service.long_id | quote }}
      {{- end }}
      automountServiceAccountToken: {{ $.Values.service.advanced_settings.security_automount_service_account_token }}
      {{- if ne $.Values.service.advanced_settings.security_service_account_name "" }}
      serviceAccountName: {{ $.Values.service.advanced_settings.security_service_account_name | toJson }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $.Values.service.advanced_settings.deployment_termination_grace_period_seconds }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      {{- if and $.Values.registry $.Values.registry.secret_name }}
      imagePullSecrets:
        - name: {{ $.Values.registry.secret_name }}
      {{- end }}
      containers:
        - name: {{ $.Values.service.name }}
          image: {{ $.Values.service.image_full | quote }}
          {{- if $.Values.service.entrypoint }}
          command:
            - {{ $.Values.service.entrypoint | toJson }}
          {{- end }}
          args:
            {{- range $arg := $.Values.service.command_args }}
            - {{ $arg | toJson }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $.Values.service.name }}
          {{- if gt (len $.Values.external_secrets) 0 }}
          env:
            {{- range $external_secret := $.Values.external_secrets }}
              {{- range $entry := $external_secret.entries }}
              {{- if not ($entry.mount_path) }}
            - name: {{ $entry.env_var_key | toJson }}
              valueFrom:
                secretKeyRef:
                  name: {{ $external_secret.external_secret_kube_name }}
                  key: {{ $entry.env_var_key | toJson }}
              {{- else }}
            - name: {{ $entry.env_var_key | toJson }}
              value: {{ $entry.mount_path | toJson }}
              {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          ports:
            {{- range $port := $.Values.service.ports }}
            - containerPort: {{ $port.port }}
              name: "p{{ $port.port }}"
              protocol: {{ if eq $port.protocol.type "UDP" }}"UDP"{{ else }}"TCP"{{ end }}
            {{- end }}
          {{- if $.Values.service.readiness_probe }}
          readinessProbe:
            {{- if $.Values.service.readiness_probe.type.tcp }}
            tcpSocket:
              port: {{ $.Values.service.readiness_probe.port }}
              host: {{ $.Values.service.readiness_probe.type.tcp.host | toJson }}
            {{- end }}
            {{- if $.Values.service.readiness_probe.type.http }}
            httpGet:
              port: {{ $.Values.service.readiness_probe.port }}
              path: {{ $.Values.service.readiness_probe.type.http.path | toJson }}
              scheme: {{ $.Values.service.readiness_probe.type.http.scheme }}
            {{- end }}
            {{- if $.Values.service.readiness_probe.type.exec }}
            exec:
              command:
              {{- range $cmd := $.Values.service.readiness_probe.type.exec.commands }}
              - {{ $cmd | toJson }}
              {{- end }}
            {{- end }}
            {{- if $.Values.service.readiness_probe.type.grpc }}
            grpc:
              port: {{ $.Values.service.readiness_probe.port }}
              service: {{ $.Values.service.readiness_probe.type.grpc.service | toJson }}
            {{- end }}
            initialDelaySeconds: {{ $.Values.service.readiness_probe.initial_delay_seconds }}
            periodSeconds: {{ $.Values.service.readiness_probe.period_seconds }}
            timeoutSeconds: {{ $.Values.service.readiness_probe.timeout_seconds }}
            successThreshold: {{ $.Values.service.readiness_probe.success_threshold }}
            failureThreshold: {{ $.Values.service.readiness_probe.failure_threshold }}
          {{- end }}
          {{- if $.Values.service.liveness_probe }}
          livenessProbe:
            {{- if $.Values.service.liveness_probe.type.tcp }}
            tcpSocket:
              port: {{ $.Values.service.liveness_probe.port }}
              host: {{ $.Values.service.liveness_probe.type.tcp.host | toJson }}
            {{- end }}
            {{- if $.Values.service.liveness_probe.type.http }}
            httpGet:
              port: {{ $.Values.service.liveness_probe.port }}
              path: {{ $.Values.service.liveness_probe.type.http.path | toJson }}
              scheme: {{ $.Values.service.liveness_probe.type.http.scheme }}
            {{- end }}
            {{- if $.Values.service.liveness_probe.type.exec }}
            exec:
              command:
              {{- range $cmd := $.Values.service.liveness_probe.type.exec.commands }}
              - {{ $cmd | toJson }}
              {{- end }}
            {{- end }}
            {{- if $.Values.service.liveness_probe.type.grpc }}
            grpc:
              port: {{ $.Values.service.liveness_probe.port }}
              service: {{ $.Values.service.liveness_probe.type.grpc.service | toJson }}
            {{- end }}
            initialDelaySeconds: {{ $.Values.service.liveness_probe.initial_delay_seconds }}
            periodSeconds: {{ $.Values.service.liveness_probe.period_seconds }}
            timeoutSeconds: {{ $.Values.service.liveness_probe.timeout_seconds }}
            successThreshold: {{ $.Values.service.liveness_probe.success_threshold }}
            failureThreshold: {{ $.Values.service.liveness_probe.failure_threshold }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: {{ $.Values.service.advanced_settings.security_read_only_root_filesystem }}
          resources:
            limits:
              {{- if $.Values.service.cpu_limit_in_milli }}
              cpu: {{ $.Values.service.cpu_limit_in_milli }}
              {{- end }}
              memory: {{ $.Values.service.ram_limit_in_mib }}
              {{- if and ($.Values.service.gpu_limit) (gt (int $.Values.service.gpu_limit) 0) }}
              nvidia.com/gpu: {{ $.Values.service.gpu_limit }}
              {{- end }}
              {{- if $.Values.service.ephemeral_storage_in_gib }}
              ephemeral-storage: {{ $.Values.service.ephemeral_storage_in_gib }}
              {{- end }}
            requests:
              cpu: {{ $.Values.service.cpu_request_in_milli }}
              memory: {{ $.Values.service.ram_request_in_mib }}
              {{- if and ($.Values.service.gpu_request) (gt (int $.Values.service.gpu_request) 0) }}
              nvidia.com/gpu: {{ $.Values.service.gpu_request }}
              {{- end }}
              {{- if $.Values.service.ephemeral_storage_in_gib }}
              ephemeral-storage: {{ $.Values.service.ephemeral_storage_in_gib }}
              {{- end }}
          lifecycle:
            {{- if gt (len $.Values.service.advanced_settings.deployment_lifecycle_post_start_exec_command) 0 }}
            postStart:
              exec:
                command: {{ $.Values.service.advanced_settings.deployment_lifecycle_post_start_exec_command | toJson }}
            {{- end }}
            {{- if gt (len $.Values.service.advanced_settings.deployment_lifecycle_pre_stop_exec_command) 0 }}
            preStop:
              exec:
                command: {{ $.Values.service.advanced_settings.deployment_lifecycle_pre_stop_exec_command | toJson }}
            {{- end }}
          volumeMounts:
{{- range $s := $.Values.service.storages }}
            {{- if $.Values.service.legacy_volumeclaim_template }}
            - name: {{ $s.id }}
            {{- else }}
            - name: {{ $s.long_id }}
            {{- end }}
              mountPath: {{ $s.mount_point | toJson }}
{{- end }}
{{- range $mounted_file := $.Values.mounted_files }}
            - mountPath: {{ $mounted_file.mount_path | toJson }}
              subPath: content
              name: {{ $mounted_file.kube_name }}
              readOnly: true
{{- end }}
            {{- range $external_secret := $.Values.external_secrets }}
              {{- range $entry := $external_secret.entries }}
              {{- if $entry.mount_path }}
            - mountPath: {{ $entry.mount_path | toJson }}
              subPath: {{ $entry.mount_path_relative | toJson }}
              name: {{ $entry.volume_name }}
              readOnly: true
              {{- end }}
              {{- end }}
            {{- end }}
      volumes:
{{- range $mounted_file := $.Values.mounted_files }}
        - name: {{ $mounted_file.kube_name }}
          secret:
            secretName: {{ $mounted_file.kube_name }}
{{- end }}
        {{- range $external_secret := $.Values.external_secrets }}
          {{- range $entry := $external_secret.entries }}
          {{- if $entry.mount_path }}
        - name: {{ $entry.volume_name }}
          secret:
            secretName: {{ $external_secret.external_secret_kube_name }}
            defaultMode: 420
            items:
              - key: {{ $entry.env_var_key | toJson }}
                path: {{ $entry.mount_path_relative | toJson }}
          {{- end }}
          {{- end }}
        {{- end }}
  volumeClaimTemplates:
{{- range $s := $.Values.service.storages }}
  - metadata:
      {{- if $.Values.service.legacy_volumeclaim_template }}
      name: {{ $s.id }}
      labels:
        ownerId: FAKE
        envId: {{ $.Values.environment_short_id | quote }}
        appId: {{ $.Values.service.short_id | quote }}
        diskId: {{ $s.id | quote }}
        diskType: {{ $s.storage_type | toJson }}
      {{- else }}
      name: {{ $s.long_id }}
      labels:
        envId: {{ $.Values.environment_short_id | quote }}
        qovery.com/service-id: {{ $.Values.service.long_id | quote }}
        qovery.com/service-type: {{ $.Values.service.type | quote }}
        qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
        qovery.com/project-id: {{ $.Values.project_long_id | quote }}
        qovery.com/disk-id: {{ $s.long_id | quote }}
        qovery.com/disk-type: {{ $s.storage_type | toJson }}
      {{- end }}
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: {{ $s.storage_type | toJson }}
      resources:
        requests:
          storage: {{ $s.size_in_gib }}Gi
{{- end }}
{{- end }}
