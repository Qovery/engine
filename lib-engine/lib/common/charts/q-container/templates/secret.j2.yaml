---
apiVersion: v1
kind: Secret
metadata:
  name: {{ service.name }}
  namespace: {{ namespace }}
  labels:
    envId: "{{ environment_short_id }}"
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "{{ service.type }}"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
    {%- for key, value in labels_group.common %}
    {{ key | yaml_encode }}: {{ value | yaml_encode }}
    {%- endfor %}
  annotations:
    {%- for key, value in annotations_group.secrets %}
    {{ key | yaml_encode }}: {{ value | yaml_encode }}
    {%- endfor %}
type: Opaque
data:
  {%- for ev in environment_variables %}
  {{ ev.key | yaml_encode }}: {{ ev.value | yaml_encode }}
  {%- endfor %}
---
{%- if registry.docker_json_config %}
apiVersion: v1
kind: Secret
metadata:
  name: {{ registry.secret_name }}
  namespace: {{ namespace }}
  labels:
    envId: "{{ environment_short_id }}"
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "{{ service.type }}"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
    {%- for key, value in labels_group.common %}
    {{ key | yaml_encode }}: {{ value | yaml_encode }}
    {%- endfor %}
  annotations:
    {%- for key, value in annotations_group.secrets %}
    {{ key | yaml_encode }}: {{ value | yaml_encode }}
    {%- endfor %}
data:
  .dockerconfigjson: {{ registry.docker_json_config }}
type: kubernetes.io/dockerconfigjson
{%- endif %}
