{%- if service.default_port %}
apiVersion: v1
kind: Service
metadata:
  name: {{ service.name }}
  namespace: {{ namespace }}
  labels:
    envId: {{ environment_short_id }}
    qovery.com/service-id: {{ service.long_id }}
    qovery.com/service-type: {{ service.type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    app.kubernetes.io/name: {{ service.name }}
    app.kubernetes.io/instance: {{ service.long_id }}
    app.kubernetes.io/version: {{ service.image_tag }}
    app.kubernetes.io/component: {{ service.type }}
    app.kubernetes.io/part-of: {{ namespace }}
    app.kubernetes.io/managed-by: qovery
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
  annotations:
    {%- for key, value in annotations_group.service %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  type: ClusterIP
  ports:
    {%- for port in service.ports %}
    - protocol: {% if port.protocol.type == "UDP" %}"UDP"{% else %}"TCP"{% endif %}
      name: "p{{ port.port }}"
      port: {{ port.port }}
      targetPort: {{ port.port }}
    {%- endfor %}
  selector:
    qovery.com/service-id: {{ service.long_id }}
{%- endif %}

{%- for l4_ports in service.ports_layer4_public %}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ service.name }}-public-{{ l4_ports.protocol | lower }}
  namespace: {{ namespace }}
  labels:
    envId: {{ environment_short_id }}
    qovery.com/service-id: {{ service.long_id }}
    qovery.com/service-type: {{ service.type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    app.kubernetes.io/name: {{ service.name }}
    app.kubernetes.io/instance: {{ service.long_id }}
    app.kubernetes.io/version: {{ service.image_tag }}
    app.kubernetes.io/component: {{ service.type }}
    app.kubernetes.io/part-of: {{ namespace }}
    app.kubernetes.io/managed-by: qovery
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "{{ l4_ports.hostnames | join(sep=",") }}"
    external-dns.alpha.kubernetes.io/ttl: "300"
    {%- for annotation in loadbalancer_l4_annotations %}
    {{ annotation | first }}: "{{ annotation | last }}"
    {%- endfor %}
    {%- for key, value in annotations_group.service %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    {%- for port in l4_ports.ports %}
    - protocol: {{ port.protocol.type }}
      name: "p{{ port.port }}"
      port: {{ port.port }}
      targetPort: {{ port.port }}
    {%- endfor %}
  selector:
    qovery.com/service-id: {{ service.long_id }}
{%- endfor %}