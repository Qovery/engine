---
apiVersion: v1
kind: Secret
metadata:
  name: {{ service.kube_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
type: Opaque
# Contract values are base64-encoded by the engine and decoded by ai-runner.
# Keep them in `stringData` so Kubernetes does not decode them before the runner.
stringData:
  {%- for ev in environment_variables %}
  {{ ev.key | yaml_encode }}: {{ ev.value | yaml_encode }}
  {%- endfor %}
{%- if user_environment_variables or bedrock_credentials %}
# User and Bedrock values are decoded once by Kubernetes for the CLI.
# Reserved names prevent collisions with contract variables.
data:
  {%- for ev in user_environment_variables %}
  {{ ev.key | yaml_encode }}: {{ ev.value | yaml_encode }}
  {%- endfor %}
  {%- for ev in bedrock_credentials %}
  {{ ev.key | yaml_encode }}: {{ ev.value | yaml_encode }}
  {%- endfor %}
{%- endif %}
{%- if registry.docker_json_config %}
---
# Pull secret for the image the engine built from the docker fragment. Absent when the Job runs the
# public base image. `data` here, unlike the Secret above: a dockerconfigjson is expected
# base64-encoded by Kubernetes, and the engine hands it over already encoded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ registry.secret_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
data:
  .dockerconfigjson: {{ registry.docker_json_config }}
type: kubernetes.io/dockerconfigjson
{%- endif %}
