---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ service.kube_name }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
    qovery.com/deployment-id: "{{ deployment_id }}"
    app.kubernetes.io/name: "{{ service.kube_name }}"
    app.kubernetes.io/instance: "{{ service.long_id }}"
    app.kubernetes.io/component: "agentic-workflow"
    app.kubernetes.io/part-of: "{{ namespace }}"
    app.kubernetes.io/managed-by: "qovery"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ service.max_duration_in_sec }}
  template:
    metadata:
      labels:
        qovery.com/service-id: "{{ service.long_id }}"
        qovery.com/service-type: "agentic-workflow"
        qovery.com/environment-id: "{{ environment_long_id }}"
        qovery.com/project-id: "{{ project_long_id }}"
        qovery.com/deployment-id: "{{ deployment_id }}"
        app.kubernetes.io/name: "{{ service.kube_name }}"
        app.kubernetes.io/instance: "{{ service.long_id }}"
        app.kubernetes.io/component: "agentic-workflow"
        app.kubernetes.io/part-of: "{{ namespace }}"
        app.kubernetes.io/managed-by: "qovery"
    spec:
      restartPolicy: Never
      volumes:
        - name: output
          emptyDir: {}
        - name: prompt
          configMap:
            name: {{ service.kube_name }}-prompt
      initContainers:
        - name: qovery-wait-container-output
          # https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/#pod-sidecar-containers
          restartPolicy: Always # this tells that the initContainer is a sidecar
          image: public.ecr.aws/r3m4q3r9/qovery-job-output-waiter:2025-07-15T14-06-16
          command: ["/qovery-job-output-waiter", "--watch"]
          volumeMounts:
            - name: output
              mountPath: /qovery-output
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      containers:
        - name: {{ service.kube_name }}
          image: "{{ service.image_full }}"
          volumeMounts:
            - name: output
              mountPath: /qovery-output
            - name: prompt
              mountPath: /qovery-agentic-workflow/prompt.txt
              subPath: prompt.txt
              readOnly: true
          envFrom:
            - secretRef:
                name: {{ service.kube_name }}
          env:
            # A Job runs the agent once and exits; force oneshot (the ai-runner default is `server`,
            # which starts a long-lived HTTP server and never processes the prompt). RUN_MODE is a
            # plain clap env var (NOT one of the base64-encoded contract vars), so it is set here in
            # plaintext, not via the Secret. See qovery-ai-runner `ai-runner/src/main.rs` (`Mode`).
            - name: RUN_MODE
              value: "oneshot"
            - name: PROMPT_FILE
              value: "/qovery-agentic-workflow/prompt.txt"
          resources:
            limits:
              {%- if service.cpu_limit_in_milli %}
              cpu: {{ service.cpu_limit_in_milli }}
              {%- else %}
              cpu: {{ service.cpu_request_in_milli }}
              {%- endif %}
              memory: {{ service.ram_limit_in_mib }}
            requests:
              cpu: {{ service.cpu_request_in_milli }}
              memory: {{ service.ram_request_in_mib }}
