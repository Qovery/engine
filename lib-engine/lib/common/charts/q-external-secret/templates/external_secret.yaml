{{- range $external_secret := .Values.external_secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $external_secret.external_secret_kube_name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  labels:
    qovery.com/service-id: {{ $.Values.service_id | quote }}
    qovery.com/service-type: {{ $.Values.service_type | quote }}
    qovery.com/environment-id: {{ $.Values.environment_id | quote }}
    qovery.com/project-id: {{ $.Values.project_id | quote }}
    qovery.com/store-name: {{ $external_secret.store_name | quote }}
spec:
  # Only refresh secrets when the metadata / specs change
  refreshPolicy: OnChange
  # Refresh secret only on deploy
  refreshInterval: "0"
  secretStoreRef:
    name: {{ $external_secret.store_name | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $external_secret.secret_name | quote }}
    # It results in not deleting the secret generated by ESO:
    # - New deploy is triggered: the previous secret is still present in case of service rollback
    # - External Secret is deleted: the engine will need to delete the target secrets
    creationPolicy: Orphan
  data:
    {{- range $entry := $external_secret.entries }}
    - secretKey: {{ $entry.env_var_key | quote }}
      remoteRef:
        key: {{ $entry.remote_key | quote }}
    {{- end }}
{{- end }}
