kind: Service
apiVersion: v1
metadata:
  # This service is used for deployed services that do not have ingress like database
  # It is used to provide to the end user an endpoint with desired name
  name: {{ .Values.service_name | quote }}
  labels:
    envId: {{ .Values.environment_id | quote }}
    envLongId: {{ .Values.environment_long_id | quote }}
    projectLongId: {{ .Values.project_long_id | quote }}
  {{ if .Values.app_id }}
    appId: {{ .Values.app_id | quote }}
    appLongId: {{ .Values.app_long_id | quote }}
  {{ end }}
  {{ if .Values.database_id }}
    databaseId: {{ .Values.database_id | quote }}
    databaseLongId: {{ .Values.database_long_id | quote }}
  {{ end }}
  {{ if .Values.publicly_accessible }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.source_fqdn | quote }}
  {{ end }}
spec:
  type: ExternalName
  externalName: {{ .Values.target_hostname | quote }}

