{%- if service.cronjob_schedule %}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ service.name }}
  namespace: {{ namespace }}
  labels:
    envId: "{{ environment_short_id }}"
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "job"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
    app.kubernetes.io/name: "{{ service.name }}"
    app.kubernetes.io/instance: "{{ service.long_id }}"
    app.kubernetes.io/component: "job"
    app.kubernetes.io/part-of: "{{ namespace }}"
    app.kubernetes.io/managed-by: "qovery"
    app.kubernetes.io/version: "{{ service.image_tag_label }}"
    {%- for key, value in labels_group.common %}
    {{ key | yaml_encode }}: {{ value | yaml_encode }}
    {%- endfor %}
  annotations:
    {%- for key, value in annotations_group.cronjob %}
    {{ key | yaml_encode }}: {{ value | yaml_encode }}
    {%- endfor %}
spec:
  schedule: {{ service.cronjob_schedule | yaml_encode }}
  timeZone: {{ service.cronjob_timezone | yaml_encode }}
  concurrencyPolicy: {{ service.advanced_settings.cronjob_concurrency_policy }}
  failedJobsHistoryLimit: {{ service.advanced_settings.cronjob_failed_jobs_history_limit }}
  successfulJobsHistoryLimit: {{ service.advanced_settings.cronjob_success_jobs_history_limit }}
  jobTemplate:
    metadata:
      name: {{ service.name }}
      labels:
        envId: "{{ environment_short_id }}"
        qovery.com/service-id: "{{ service.long_id }}"
        qovery.com/service-type: "job"
        qovery.com/environment-id: "{{ environment_long_id }}"
        qovery.com/project-id: "{{ project_long_id }}"
        app.kubernetes.io/name: "{{ service.name }}"
        app.kubernetes.io/instance: "{{ service.long_id }}"
        app.kubernetes.io/component: "job"
        app.kubernetes.io/part-of: "{{ namespace }}"
        app.kubernetes.io/managed-by: "qovery"
        app.kubernetes.io/version: "{{ service.image_tag_label }}"
        {%- for key, value in labels_group.common %}
        {{ key | yaml_encode }}: {{ value | yaml_encode }}
        {%- endfor %}
      annotations:
        qovery.com/service-version: {{ service.version }}
        {%- for key, value in annotations_group.job %}
        {{ key | yaml_encode }}: {{ value | yaml_encode }}
        {%- endfor %}
    spec:
      backoffLimit: {{ service.max_nb_restart }}
      activeDeadlineSeconds: {{ service.max_duration_in_sec }}
      {%- if service.advanced_settings.job_delete_ttl_seconds_after_finished %}
      ttlSecondsAfterFinished: {{ service.advanced_settings.job_delete_ttl_seconds_after_finished }}
      {%- endif %}
      parallelism: 1
      template:
        metadata:
          labels:
            envId: "{{ environment_short_id }}"
            qovery.com/service-id: "{{ service.long_id }}"
            qovery.com/service-type: "job"
            qovery.com/environment-id: "{{ environment_long_id }}"
            qovery.com/project-id: "{{ project_long_id }}"
            app.kubernetes.io/name: "{{ service.name }}"
            app.kubernetes.io/instance: "{{ service.long_id }}"
            app.kubernetes.io/component: "job"
            app.kubernetes.io/part-of: "{{ namespace }}"
            app.kubernetes.io/managed-by: "qovery"
            app.kubernetes.io/version: "{{ service.image_tag_label }}"
            {%- for key, value in labels_group.common %}
            {{ key | yaml_encode }}: {{ value | yaml_encode }}
            {%- endfor %}
          annotations:
            qovery.com/service-version: {{ service.version }}
            karpenter.sh/do-not-disrupt: "true"
            {%- for key, value in annotations_group.pods %}
            {{ key | yaml_encode }}: {{ value | yaml_encode }}
            {%- endfor %}
        spec:
          {%- if service.tolerations %}
          tolerations:
            {%- for key, value in service.tolerations %}
            - key: {{ key | yaml_encode }}
              operator: "Exists"
              effect: {{ value | yaml_encode }}
            {%- endfor %}
          {%- endif %}
          affinity:
            {%- if service.advanced_settings.deployment_affinity_node_required or service.deployment_affinity_node_preferred %}
            nodeAffinity:
              {%- if service.advanced_settings.deployment_affinity_node_required %}
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
              {%- for key, value in service.advanced_settings.deployment_affinity_node_required %}
                    - key: {{ key | yaml_encode }}
                      operator: In
                      values:
                      - {{ value | yaml_encode }}
              {%- endfor %}
              {%- endif %}
              {%- if service.deployment_affinity_node_preferred %}
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      {%- for key, value in service.deployment_affinity_node_preferred %}
                      - key: {{ key | yaml_encode }}
                        operator: In
                        values:
                        - {{ value | yaml_encode }}
                      {%- endfor %}
              {%- endif %}
            {%- endif %}
          restartPolicy: OnFailure
          automountServiceAccountToken: {{ service.advanced_settings.security_automount_service_account_token }}
          {%- if service.advanced_settings.security_service_account_name != "" %}
          serviceAccountName: {{ service.advanced_settings.security_service_account_name | yaml_encode }}
          {%- endif %}
          terminationGracePeriodSeconds: {{ service.advanced_settings.deployment_termination_grace_period_seconds }}
          {%- if service.advanced_settings.network_dns_ndots %}
          dnsConfig:
            options:
            - name: ndots
              # quoted deliberately: the setting is numeric but the API field is a string
              value: "{{ service.advanced_settings.network_dns_ndots }}"
          {%- endif %}
          {%- if registry %}
          imagePullSecrets:
            - name: {{ registry.secret_name }}
          {%- endif %}
          volumes:
            {%- for mounted_file in mounted_files %}
            - name: {{ mounted_file.kube_name }}
              secret:
                secretName: {{ mounted_file.kube_name }}
            {%- endfor %}
            {%- for external_secret in external_secrets %}
              {%- for entry in external_secret.entries %}
              {%- if entry.mount_path %}
            - name: {{ entry.volume_name }}
              secret:
                secretName: {{ external_secret.secret_name }}
                defaultMode: 420
                items:
                  - key: {{ entry.env_var_key | yaml_encode }}
                    path: {{ entry.mount_path_relative | yaml_encode }}
              {%- endif %}
              {%- endfor %}
            {%- endfor %}
          containers:
            - name: {{ service.name }}
              image: "{{ service.image_full }}"
          {%- if service.entrypoint %}
              command:
                - {{ service.entrypoint | yaml_encode }}
          {%- endif %}
              args:
                {%- for arg in service.command_args %}
                - {{ arg | yaml_encode }}
                {%- endfor %}
              volumeMounts:
                {%- for mounted_file in mounted_files %}
                - mountPath: {{ mounted_file.mount_path | yaml_encode }}
                  subPath: content
                  name: {{ mounted_file.kube_name }}
                  readOnly: true
                {%- endfor %}
                {%- for external_secret in external_secrets %}
                  {%- for entry in external_secret.entries %}
                  {%- if entry.mount_path %}
                - mountPath: {{ entry.mount_path | yaml_encode }}
                  subPath: {{ entry.mount_path_relative | yaml_encode }}
                  name: {{ entry.volume_name }}
                  readOnly: true
                  {%- endif %}
                  {%- endfor %}
                {%- endfor %}
              envFrom:
                - secretRef:
                    name: {{ service.name }}

              {%- if external_secrets|length > 0 %}
              env:
                {%- for external_secret in external_secrets %}
                  {%- for entry in external_secret.entries %}
                - name: {{ entry.env_var_key | yaml_encode }}
                    {%- if not entry.mount_path %}
                  valueFrom:
                    secretKeyRef:
                      name: {{ external_secret.secret_name }}
                      key: {{ entry.env_var_key | yaml_encode }}
                    {%- else %}
                  value: {{ entry.mount_path | yaml_encode }}
                    {%- endif %}
                  {%- endfor %}
                {%- endfor %}
              {%- endif %}
          {%- if service.default_port %}
              ports:
                - containerPort: {{ service.default_port }}
                  name: "p{{ service.default_port }}"
                  protocol: TCP
          {%- endif %}
              {%- if service.readiness_probe %}
              readinessProbe:
                {%- if service.readiness_probe.type.tcp %}
                tcpSocket:
                  port: {{ service.readiness_probe.port }}
                  host: {{ service.readiness_probe.type.tcp.host | yaml_encode }}
                {%- endif %}
                {%- if service.readiness_probe.type.http %}
                httpGet:
                  port: {{ service.readiness_probe.port }}
                  path: {{ service.readiness_probe.type.http.path | yaml_encode }}
                  scheme: {{ service.readiness_probe.type.http.scheme }}
                {%- endif %}
                {%- if service.readiness_probe.type.exec %}
                exec:
                  command:
                  {%- for cmd in service.readiness_probe.type.exec.commands %}
                  - {{ cmd | yaml_encode }}
                  {%- endfor %}
                {%- endif %}
                {%- if service.readiness_probe.type.grpc %}
                grpc:
                  port: {{ service.readiness_probe.port }}
                  service: {{ service.readiness_probe.type.grpc.service | yaml_encode }}
                {%- endif %}
                initialDelaySeconds: {{ service.readiness_probe.initial_delay_seconds }}
                periodSeconds: {{ service.readiness_probe.period_seconds }}
                timeoutSeconds: {{ service.readiness_probe.timeout_seconds }}
                successThreshold: {{ service.readiness_probe.success_threshold }}
                failureThreshold: {{ service.readiness_probe.failure_threshold }}
              {%- endif %}
              {%- if service.liveness_probe %}
              livenessProbe:
                {%- if service.liveness_probe.type.tcp %}
                tcpSocket:
                  port: {{ service.liveness_probe.port }}
                  host: {{ service.liveness_probe.type.tcp.host | yaml_encode }}
                {%- endif %}
                {%- if service.liveness_probe.type.http %}
                httpGet:
                  port: {{ service.liveness_probe.port }}
                  path: {{ service.liveness_probe.type.http.path | yaml_encode }}
                  scheme: {{ service.liveness_probe.type.http.scheme }}
                {%- endif %}
                {%- if service.liveness_probe.type.exec %}
                exec:
                  command:
                  {%- for cmd in service.liveness_probe.type.exec.commands %}
                  - {{ cmd | yaml_encode }}
                  {%- endfor %}
                {%- endif %}
                {%- if service.liveness_probe.type.grpc %}
                grpc:
                  port: {{ service.liveness_probe.port }}
                  service: {{ service.liveness_probe.type.grpc.service | yaml_encode }}
                {%- endif %}
                initialDelaySeconds: {{ service.liveness_probe.initial_delay_seconds }}
                periodSeconds: {{ service.liveness_probe.period_seconds }}
                timeoutSeconds: {{ service.liveness_probe.timeout_seconds }}
                successThreshold: {{ service.liveness_probe.success_threshold }}
                failureThreshold: {{ service.liveness_probe.failure_threshold }}
              {%- endif %}
              securityContext:
                readOnlyRootFilesystem: {{ service.advanced_settings.security_read_only_root_filesystem }}
              resources:
                limits:
                  {%- if service.cpu_limit_in_milli %}
                  cpu: {{ service.cpu_limit_in_milli }}
                  {%- endif %}
                  memory: {{ service.ram_limit_in_mib }}
                  {%- if service.gpu_limit and service.gpu_limit > 0 %}
                  nvidia.com/gpu: {{ service.gpu_limit }}
                  {%- endif %}
                  {%- if service.ephemeral_storage_in_gib %}
                  ephemeral-storage: {{ service.ephemeral_storage_in_gib }}
                  {%- endif %}
                requests:
                  cpu: {{ service.cpu_request_in_milli }}
                  memory: {{ service.ram_request_in_mib }}
                  {%- if service.gpu_request and service.gpu_request > 0 %}
                  nvidia.com/gpu: {{ service.gpu_request }}
                  {%- endif %}
                  {%- if service.ephemeral_storage_in_gib %}
                  ephemeral-storage: {{ service.ephemeral_storage_in_gib }}
                  {%- endif %}
  {%- endif %}
