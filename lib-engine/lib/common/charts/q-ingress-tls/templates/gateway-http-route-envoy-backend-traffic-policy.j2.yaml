{%- if k8s_deploy_api_gateway == true %}
{% for namespace_key, http_hosts in http_hosts_per_namespace %}
{%- if http_hosts|length >= 1  %}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ sanitized_name }}-traffic-policy
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ sanitized_name }}
  {%- if advanced_settings.network_gateway_api_sticky_session_enable == true %}
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: INGRESSCOOKIE_QOVERY
        ttl: 85400s # 1 day
        attributes:
          secure: "true"
          samesite: Lax
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_route_limit_rpm or advanced_settings.network_gateway_api_route_limit_rps %}
  rateLimit:
    type: Local
    local:
      rules:
      {%- if advanced_settings.network_gateway_api_route_limit_rpm %}
      # RPM limit
      - limit:
          requests: {{ advanced_settings.network_gateway_api_route_limit_rpm }}
          unit: Minute
        clientSelectors:
        {%- if advanced_settings.network_gateway_api_route_limit_source_cidrs %}
        {%- for h in advanced_settings.network_gateway_api_route_limit_source_cidrs | split(pat=",") %}
        - sourceCIDR:
            value: "{{ h | trim }}"
            type: Distinct
        {%- endfor %}
        {%- else %}
        - sourceCIDR:
            value: "0.0.0.0/0"
            type: Distinct
        {%- endif %}
        {%- if advanced_settings.network_gateway_api_route_limit_headers %}
        - headers:
          {%- for h in advanced_settings.network_gateway_api_route_limit_headers | split(pat=",") %}
          - name: "{{ h | trim }}"
            type: Distinct
          {%- endfor %}
        {%- endif %}
      {%- endif %}
      {%- if advanced_settings.network_gateway_api_route_limit_rps %}
      # RPS limit
      - limit:
          requests: {{ advanced_settings.network_gateway_api_route_limit_rps }}
          unit: Second
        clientSelectors:
        {%- if advanced_settings.network_gateway_api_route_limit_source_cidrs %}
        {%- for h in advanced_settings.network_gateway_api_route_limit_source_cidrs | split(pat=",") %}
        - sourceCIDR:
            value: "{{ h | trim }}"
            type: Distinct
        {%- endfor %}
        {%- else %}
        - sourceCIDR:
            value: "0.0.0.0/0"
            type: Distinct
        {%- endif %}
        {%- if advanced_settings.network_gateway_api_route_limit_headers %}
        - headers:
          {%- for h in advanced_settings.network_gateway_api_route_limit_headers | split(pat=",") %}
          - name: "{{ h | trim }}"
            type: Distinct
          {%- endfor %}
        {%- endif %}
      {%- endif %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_custom_http_errors is defined and advanced_settings.network_gateway_api_custom_http_errors %}
  responseOverride:
    {%- for code in advanced_settings.network_gateway_api_custom_http_errors | split(pat=",") %}
    - match:
        statusCodes:
          - type: Value
            value: {{ code | trim }}
      response:
        contentType: text/html
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: {{ sanitized_name }}-error-pages
            key: {{ code | trim }}.html
    {%- endfor %}
  {%- endif %}
  {%- if advanced_settings.network_gateway_api_circuit_breaker_max_connections or advanced_settings.network_gateway_api_circuit_breaker_max_pending_requests or advanced_settings.network_gateway_api_circuit_breaker_max_parallel_requests %}
  circuitBreaker:
    {%- if advanced_settings.network_gateway_api_circuit_breaker_max_connections %}
    maxConnections: {{ advanced_settings.network_gateway_api_circuit_breaker_max_connections }}
    {%- endif %}
    {%- if advanced_settings.network_gateway_api_circuit_breaker_max_pending_requests %}
    maxPendingRequests: {{ advanced_settings.network_gateway_api_circuit_breaker_max_pending_requests }}
    {%- endif %}
    {%- if advanced_settings.network_gateway_api_circuit_breaker_max_parallel_requests %}
    maxParallelRequests: {{ advanced_settings.network_gateway_api_circuit_breaker_max_parallel_requests }}
    {%- endif %}
  {%- endif %}
{%- endif %}
{%- endfor %}
{%- endif %}