{{- if (or $.Values.advanced_settings.network_ingress_basic_auth_env_var $.Values.advanced_settings.network_gateway_api_basic_auth_env_var) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: htaccess-{{ $.Values.sanitized_name }}
  namespace: {{ $.Values.namespace }}
  labels:
    qovery.com/service-id: {{ $.Values.long_id }}
    qovery.com/service-type: "router"
    qovery.com/environment-id: {{ $.Values.environment_long_id }}
    qovery.com/project-id: {{ $.Values.project_long_id }}
    {{- range $key, $value := $.Values.labels_group.common }}
    {{ (toJson $key) }}: {{ (toJson $value) }}
    {{- end }}
type: Opaque
data:
  # NGINX ingress consumes "auth", Envoy Gateway BasicAuth consumes ".htpasswd".
  # Keep both during migration while the two stacks coexist.
  auth: {{ $.Values.basic_auth_htaccess }}
  .htpasswd: {{ $.Values.basic_auth_htaccess }}
{{- end }}
