{%- if k8s_deploy_api_gateway == true %}
{% for namespace_key, http_hosts in http_hosts_per_namespace %}
{%- if http_hosts|length >= 1  %}
{#
  Split routes to comply with Kubernetes Gateway API limits:
  - Maximum 16 hostnames per HTTPRoute
  - Maximum 16 rules per HTTPRoute

  Why 8 hosts per route?
  - Each host generates 2 hostnames (original + new-gateway-api variant)
  - Each host generates 2 rules (main path + service prefix path for backward compatibility)
  - 8 hosts × 2 = 16 hostnames and 16 rules (at the Kubernetes limit)

  When you have >8 hosts, multiple HTTPRoute resources are created:
  - router-name (for 1-8 hosts)
  - router-name-1, router-name-2, ... (for >8 hosts)
#}
{%- set max_hosts_per_route = 8 %}
{%- set total_hosts = http_hosts|length %}
{%- set num_routes = (total_hosts / max_hosts_per_route)|round(method='ceil')|int %}
{%- for route_index in range(end=num_routes) %}
{%- set start_idx = route_index * max_hosts_per_route %}
{%- set end_idx_calc = start_idx + max_hosts_per_route %}
{%- if end_idx_calc > total_hosts %}
{%- set end_idx = total_hosts %}
{%- else %}
{%- set end_idx = end_idx_calc %}
{%- endif %}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ sanitized_name }}{%- if num_routes > 1 %}-{{ route_index + 1 }}{%- endif %}
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/router-name: {{ sanitized_name }}
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
  annotations:
    kubernetes.io/tls-acme: "true"
    {%- if has_wildcard_domain == true %}
    external-dns.alpha.kubernetes.io/ttl: "300"
    {%- else %}
    external-dns.alpha.kubernetes.io/exclude: "true"
    {%- endif %}
    cert-manager.io/cluster-issuer: "letsencrypt-qovery"
    {%- for key, value in annotations_group.gateway_api_routes %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  parentRefs:
    {%- if certificate_alternative_names|length > 0 %}
    {%- if k8s_deploy_listenerset == true %}
    {%- for domain in certificate_alternative_names %}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ sanitized_name }}-listeners
      namespace: {{ namespace_key }}
      sectionName: {{ sanitized_name }}-{{ loop.index }}-https
    {%- endfor %}
    {%- endif %}
    - name: qovery-cluster-public-gateway
      namespace: qovery
      sectionName: https
    {%- if not advanced_settings.network_gateway_api_force_ssl_redirect or advanced_settings.network_gateway_api_force_ssl_redirect == "false" %}
    - name: qovery-cluster-public-gateway
      namespace: qovery
      sectionName: http
    {%- endif %}
    {%- else %}
    - name: qovery-cluster-public-gateway
      namespace: qovery
      sectionName: https
    {%- if not advanced_settings.network_gateway_api_force_ssl_redirect or advanced_settings.network_gateway_api_force_ssl_redirect == "false" %}
    - name: qovery-cluster-public-gateway
      namespace: qovery
      sectionName: http
    {%- endif %}
    {%- endif %}
  hostnames:
    {%- for host in http_hosts %}
    {%- if loop.index0 >= start_idx and loop.index0 < end_idx %}
    - "{{ host.domain_name }}"
    # TODO(QOV-1400): remove this code used for Gateway API double stack migration
    - "{{ host.domain_name | replace(from="-gtw.", to="-gtw.new-gateway-api.") }}"
    {%- endif %}
    {%- endfor %}
  rules:
    {%- for host in http_hosts %}
    {%- if loop.index0 >= start_idx and loop.index0 < end_idx %}
    # Rule 1: Main path with optional rewrite
    - backendRefs:
        - group: ""
          kind: Service
          name: "{{ host.service_name }}"
          port: {{ host.service_port }}
          weight: {{ host.weight }}
      matches:
        - path:
            type: {{ host.path_type }}
            value: "{{ host.path }}"
      filters:
       {%- if host.path_rewrite is defined and host.path_rewrite | trim %}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "{{ host.path_rewrite | trim }}"
       {%- endif %}
       {%- if advanced_settings.network_gateway_api_add_headers %}
        # Add custom response headers
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              {%- for header_name, header_value in advanced_settings.network_gateway_api_add_headers %}
              - name: "{{ header_name }}"
                value: "{{ header_value }}"
              {%- endfor %}
        {%- endif %}
        - type: RequestHeaderModifier
          requestHeaderModifier:
            {%- if advanced_settings.network_gateway_api_proxy_set_headers %}
            # Add custom request headers (proxy_set_header equivalent)
            add:
            {%- for header_name, header_value in advanced_settings.network_gateway_api_proxy_set_headers %}
            - name: "{{ header_name }}"
              value: "{{ header_value }}"
            {%- endfor %}
            {%- endif %}
            # Add Qovery specific headers for logging and tracing
            set:
            - name: "x-qovery-com-environment-id"
              value: "{{ environment_long_id }}"
            - name: "x-qovery-com-associated-service-id"
              value: "{{ associated_service_long_id }}"
     # Rule 2: Service name prefix path (for pre-migration compatibility)
    - backendRefs:
        - group: ""
          kind: Service
          name: "{{ host.service_name }}"
          port: {{ host.service_port }}
          weight: {{ host.weight }}
      matches:
        - path:
            type: PathPrefix
            value: /{{ associated_service_long_id }}/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
       {%- if advanced_settings.network_gateway_api_add_headers %}
        # Add custom response headers
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              {%- for header_name, header_value in advanced_settings.network_gateway_api_add_headers %}
              - name: "{{ header_name }}"
                value: "{{ header_value }}"
              {%- endfor %}
        {%- endif %}
        - type: RequestHeaderModifier
          requestHeaderModifier:
            {%- if advanced_settings.network_gateway_api_proxy_set_headers %}
            # Add custom request headers (proxy_set_header equivalent)
            add:
            {%- for header_name, header_value in advanced_settings.network_gateway_api_proxy_set_headers %}
            - name: "{{ header_name }}"
              value: "{{ header_value }}"
            {%- endfor %}
            {%- endif %}
            # Add Qovery specific headers for logging and tracing
            set:
            - name: "x-qovery-com-environment-id"
              value: "{{ environment_long_id }}"
            - name: "x-qovery-com-associated-service-id"
              value: "{{ associated_service_long_id }}"
    {%- endif %}
    {%- endfor %}
{%- endfor %}
{%- if advanced_settings.network_gateway_api_force_ssl_redirect and advanced_settings.network_gateway_api_force_ssl_redirect != "false" %}
{#
  SSL redirect routes are also split using the same logic.
  Each SSL redirect route matches the corresponding HTTPS route part.
#}
{%- for route_index in range(end=num_routes) %}
{%- set start_idx = route_index * max_hosts_per_route %}
{%- set end_idx_calc = start_idx + max_hosts_per_route %}
{%- if end_idx_calc > total_hosts %}
{%- set end_idx = total_hosts %}
{%- else %}
{%- set end_idx = end_idx_calc %}
{%- endif %}
---
# SSL redirect HTTPRoute (only when force_ssl_redirect is TRUE)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ sanitized_name }}-ssl-redir{%- if num_routes > 1 %}-{{ route_index + 1 }}{%- endif %}
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/router-name: {{ sanitized_name }}
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
  annotations:
    kubernetes.io/tls-acme: "true"
    {%- if has_wildcard_domain == true %}
    external-dns.alpha.kubernetes.io/ttl: "300"
    {%- else %}
    external-dns.alpha.kubernetes.io/exclude: "true"
    {%- endif %}
    cert-manager.io/cluster-issuer: "letsencrypt-qovery"
    {%- for key, value in annotations_group.gateway_api_routes %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
spec:
  parentRefs:
    - name: qovery-cluster-public-gateway
      namespace: qovery
      sectionName: http
  hostnames:
    {%- for host in http_hosts %}
    {%- if loop.index0 >= start_idx and loop.index0 < end_idx %}
    - "{{ host.domain_name }}"
    # TODO(QOV-1400): remove this code used for Gateway API double stack migration
    - "{{ host.domain_name | replace(from="-gtw.", to="-gtw.new-gateway-api.") }}"
    {%- endif %}
    {%- endfor %}
  rules:
  # Rule 1: Allow ACME HTTP-01 challenge requests to pass through without redirect.
  # cert-manager dynamically creates its own HTTPRoute with a more-specific path
  # (exact challenge token), which wins over this route by Gateway API precedence.
  # This rule exists to ensure the catch-all redirect below does NOT intercept
  # /.well-known/acme-challenge/ requests before cert-manager can handle them,
  # which would otherwise cause an infinite renewal loop every ~60 days.
  - matches:
      - path:
          type: PathPrefix
          value: /.well-known/acme-challenge/
  # Rule 2: Redirect all other HTTP traffic to HTTPS.
  - filters:
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          statusCode: 301
{%- endfor %}
{%- endif %}
{%- endif %}
{%- endfor %}
{%- endif %}
