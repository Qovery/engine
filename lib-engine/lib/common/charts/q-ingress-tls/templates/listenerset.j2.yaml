{%- if k8s_deploy_api_gateway == true %}
{%- if certificate_alternative_names|length > 0 %}
{%- for namespace_key, http_hosts in http_hosts_per_namespace %}
{%- if http_hosts|length >= 1  %}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ sanitized_name }}-listeners
  namespace: {{ namespace_key }}
  labels:
    qovery.com/service-id: {{ long_id }}
    qovery.com/service-type: "router"
    qovery.com/router-name: {{ sanitized_name }}
    qovery.com/associated-service-id: {{ associated_service_long_id }}
    qovery.com/associated-service-type: {{ associated_service_type }}
    qovery.com/environment-id: {{ environment_long_id }}
    qovery.com/project-id: {{ project_long_id }}
    {%- for key, value in labels_group.common %}
    {{ key }}: |-
       {{ value }}
    {%- endfor %}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-qovery"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: qovery-cluster-public-gateway
    namespace: qovery
  listeners:
  {%- for domain in certificate_alternative_names %}
  - name: {{ sanitized_name }}-{{ loop.index }}-https
    hostname: "{{ domain.domain }}"
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: router-tls-{{ id }}
        namespace: {{ namespace_key }}
  {%- endfor %}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- endif %}
