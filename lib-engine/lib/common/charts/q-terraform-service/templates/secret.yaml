---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.service.name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  labels:
    envId: {{ $.Values.environment_short_id | quote }}
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: "terraform-service"
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
    {{- range $key, $value := $.Values.labels_group.common }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
  annotations:
    {{- range $key, $value := $.Values.annotations_group.secrets }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
type: Opaque
data:
  {{- range $ev := $.Values.environment_variables }}
  {{ $ev.key | toJson }}: {{ $ev.value | toJson }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.backend_config.secret_name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  labels:
    envId: {{ $.Values.environment_short_id | quote }}
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: "terraform-service"
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
    {{- range $key, $value := $.Values.labels_group.common }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
  annotations:
    {{- range $key, $value := $.Values.annotations_group.secrets }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
type: Opaque
stringData:
  config: {{ join "\n" $.Values.backend_config.configs | toJson }}
---
{{- if and $.Values.registry $.Values.registry.docker_json_config }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.registry.secret_name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  labels:
    envId: {{ $.Values.environment_short_id | quote }}
    qovery.com/service-id: {{ $.Values.service.long_id | quote }}
    qovery.com/service-type: "terraform-service"
    qovery.com/environment-id: {{ $.Values.environment_long_id | quote }}
    qovery.com/project-id: {{ $.Values.project_long_id | quote }}
    {{- range $key, $value := $.Values.labels_group.common }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
  annotations:
    {{- range $key, $value := $.Values.annotations_group.secrets }}
    {{ $key | toJson }}: {{ $value | toJson }}
    {{- end }}
data:
  .dockerconfigjson: {{ $.Values.registry.docker_json_config | quote }}
type: kubernetes.io/dockerconfigjson
{{- end }}
