dns:
  domain: set-by-engine-code

certManagerNamespace: "qovery"

gateway:
  qoveryPublic:
    enable: true
    enableProxyProtocol: false # Proxy protocol disabled - not working correctly with Envoy Gateway v1.6.1, X-Forwarded-For header are still sent to the service
    proxyProtocol:
      optional: true
    withUnderscoresAction: "DropHeader"
    xForwardedFor:
      numberTrustedHops: null
      trustedCIDRs: []
    timeout:
      http:
        streamIdleTimeoutSeconds: null
    path:
      disableMergeSlashes: false
      escapedSlashesAction: "UnescapeAndRedirect"
    customHttpErrors:
      default: null
    compression:
      enable: true
    defaultBackend:
      enable: false
      image: null
      tag: null

envoyProxy:
  qoveryPublic:
    accessLog:
      format: "set-by-engine"
    provider:
      kubernetes:
        envoyDeployment:
          pod:
            affinity: null
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: topology.kubernetes.io/zone
                maxSkew: 1
                whenUnsatisfiable: ScheduleAnyway
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: kubernetes.io/hostname
                maxSkew: 1
                whenUnsatisfiable: ScheduleAnyway
            tolerations: null
        envoyHpa: {}
        envoyPDB:
          maxUnavailable: 1
        envoyService:
          annotations:
            # Proxy protocol is disabled due to compatibility issues with Envoy Gateway v1.6.1
            # The ClientTrafficPolicy.enableProxyProtocol feature doesn't properly configure Envoy listeners
            # Use X-Forwarded-For headers for client IP preservation instead
            service.beta.kubernetes.io/azure-load-balancer-enable-proxy-protocol: "false"
            # Reduce client-facing TCP RSTs on idle timeout during rollout/drain windows.
            service.beta.kubernetes.io/azure-load-balancer-disable-tcp-reset: "true"
            # Keep idle TCP flows longer on Standard LB to better absorb transient backend churn.
            service.beta.kubernetes.io/azure-load-balancer-tcp-idle-timeout: "30"

# metrics are enabled only when prometheus is installed
metrics:
  enabled: set-by-engine-code
  podMonitor:
    enabled: set-by-engine-code
    additionalLabels:
      release: kube-prometheus-stack
