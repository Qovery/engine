dns:
  domain: set-by-engine-code

certManagerNamespace: "cert-manager"

gateway:
  qoveryPublic:
    enable: true
    enableProxyProtocol: true
    proxyProtocol:
      optional: true
    withUnderscoresAction: "DropHeader"
    xForwardedFor:
      numberTrustedHops: null
      trustedCIDRs: []
    timeout:
      http:
        streamIdleTimeoutSeconds: null
    customHttpErrors:
      default: null
    compression:
      enable: true
    defaultBackend:
      enable: false
      image: null
      tag: null

envoyProxy:
  qoveryPublic:
    accessLog:
      format: "set-by-engine"
    provider:
      kubernetes:
        envoyDeployment:
          pod:
            affinity: null
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: topology.kubernetes.io/zone
                maxSkew: 1
                whenUnsatisfiable: ScheduleAnyway
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: kubernetes.io/hostname
                maxSkew: 1
                whenUnsatisfiable: ScheduleAnyway
            tolerations: null
        envoyHpa: {}
        envoyPDB:
          maxUnavailable: 1
        envoyService:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: "external"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "set-by-engine-code"
            service.beta.kubernetes.io/aws-load-balancer-name: "set-by-engine-code"
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
            service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
            service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "set-by-engine-code"
            service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
            # Set NLB target-group drain behavior on Envoy service annotations to reduce
            # TCP RSTs during pod/node rescheduling windows with externalTrafficPolicy=Local.
            # Keep this on EnvoyProxy envoyService annotations (not Gateway annotations)
            # to avoid Gateway's infrastructure annotation limit.
            # Keep draining values aligned with Envoy drainTimeout (currently 60s default).
            service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "deregistration_delay.timeout_seconds=60,target_health_state.unhealthy.connection_termination.enabled=false,target_health_state.unhealthy.draining_interval_seconds=60"

# metrics are enabled only when prometheus is installed
metrics:
  enabled: set-by-engine-code
  podMonitor:
    enabled: set-by-engine-code
    additionalLabels:
      release: kube-prometheus-stack
