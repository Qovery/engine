preset: application

prometheus_export:
  enabled: true


env:
  OTEL_EBPF_KUBE_CLUSTER_NAME: "set-by-engine-code"

config:
  create: true
  data:
    # reduce route cardinality (e.g. /user/123 → /user/:id)
    routes:
      unmatched: ignore

    # explicit Prometheus metrics exporter
    prometheus_export:
      buckets:
        duration_histogram: [ 0.01, 0.05, 0.2, 1, 5 ]
      port: 9090
      path: /metrics

    # enable Kubernetes metadata (usually true by default)
    attributes:
      kubernetes:
        enable: true

    # limit the instrumentation scope
    discovery:
      instrument:
        - k8s_pod_labels:
            "qovery.com/service-type": "container"
        - k8s_pod_labels:
            "qovery.com/service-type": "application"
      exclude_instrument:
        - k8s_namespace: "{kube-*,monitoring,observability}"
        - k8s_owner_name: "{prometheus*,grafana-agent*,loki*,tempo*,jaeger*}"

    # expose Beyla’s own internal metrics
    internal_metrics:
      prometheus:
        port: 6060
        path: /metrics

internal_metrics:
  enabled: true

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
  jobLabel: beyla
  endpoint:
    interval: 30s
    sampleLimit: 20000
    metricRelabelings:
      - action: keep
        sourceLabels: [ __name__ ]
        regex: 'http_server_request_duration_seconds_(bucket|sum|count)|http_server_(request|response)_body_size_bytes_(sum|count)'

      - action: keep
        sourceLabels: [ http_request_method ]
        regex: '(GET|POST|PUT|DELETE)|^$'

      - action: labelkeep
        regex: (__name__|job|instance|k8s_namespace_name|k8s_container_name|http_request_method|http_response_status_code|le)
  internalMetrics:
    endpoint:
      interval: 30s
      sampleLimit: 5000
      metricRelabelings:
        - action: labelkeep
          regex: (__name__|job|instance|k8s_container_name|http_response_status_code|http_request_method|http_route|le|k8s_namespace_name|service_name|service_namespace|server_address|server_port|k8s_deployment_name|k8s_kind)
priorityClassName: system-node-critical

tolerations:
  - operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: eks.amazonaws.com/compute-type
              operator: NotIn
              values: ["fargate"]