{{- if .Values.gpuNodePool.enable }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        nvidia.com/gpu.present: "true"
        feature.node.kubernetes.io/pci-10de.present: "true"
    spec:
      requirements:
        {{- range .Values.gpuNodePool.requirements }}
        - key: "{{ .key }}"
          operator: "{{ .operator }}"
          values:
            {{- range .values }}
            - "{{ . }}"
            {{- end }}
          {{- if .minValues }}
          minValues: {{ .minValues }}
          {{- end }}
        {{- end }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nodepool/gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          effect: NoSchedule
      expireAfter: 720h # 30 * 24h = 720h
      terminationGracePeriod: {{ .Values.global_node_pools.terminationGracePeriod }}
  disruption:
    consolidationPolicy: WhenEmpty # Better not to break long GPU jobs running
    consolidateAfter: 30s
    budgets:
      # By default, 10% is set: it applies for any kind of disruption (Empty, Drifted, Underutilized)
      - nodes: 10%
      # The consolidation budgets injected below contain:
      # - either a forbidden rule for Underutilized when the user hasn't configured any disruption period
      # - or some custom forbidden rules which are the complementary of what they configured on core side
      {{- range .Values.gpuNodePool.consolidation.budgets }}
      - nodes: {{ .nodes | quote }}
        reasons:
          {{- range .reasons }}
          - "{{ . }}"
          {{- end }}
        duration: {{ .duration }}
        schedule: {{ .schedule | quote }}
      {{- end }}
  {{- if not (and (empty .Values.gpuNodePool.limits.maxCpu) (empty .Values.gpuNodePool.limits.maxMemory)) }}
  limits:
    cpu: {{ .Values.gpuNodePool.limits.maxCpu }}
    memory: {{ .Values.gpuNodePool.limits.maxMemory }}
  {{- end }}
  weight: 10
{{- end }}