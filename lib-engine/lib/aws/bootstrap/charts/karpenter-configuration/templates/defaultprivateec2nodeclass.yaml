{{- if .Values.defaultPrivateNodePool.enable }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: qovery-default-private
spec:
  metadataOptions:
    # https://github.com/kubernetes/autoscaler/issues/3592
    # hop limit should be set to 2 for https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.4/deploy/installation/#using-the-amazon-ec2-instance-metadata-server-version-2-imdsv2
    httpPutResponseHopLimit: 2
  {{- if .Values.isCustomAmi }}
  amiFamily: {{ .Values.amiFamily }}
  amiSelectorTerms:
    {{- if .Values.customAmiId }}
    - id: {{ .Values.customAmiId }}
    {{- else }}
    - name: {{ .Values.customAmiName | quote }}
    {{- end }}
  {{- else }}
  amiSelectorTerms:
    - alias: {{ .Values.amiSelectorTermsAlias }}
  {{- end }}
  role: "KarpenterNodeRole-{{ .Values.clusterName }}"
  {{- with .Values.defaultPrivateNodePool.instanceStorePolicy }}
  instanceStorePolicy: {{ . }}
  {{- end }}
  # Nodes land on private subnets and keep egressing through the NAT gateways.
  # Selector tags are ANDed within a single term; each tag must be cluster-unique
  # because Karpenter tag discovery is account+region-wide.
  subnetSelectorTerms:
    - tags:
        ClusterId: "{{ .Values.tags.ClusterId }}"
        SubnetType: "workload"
        Public: "false"
  securityGroupSelectorTerms:
    # Always select the security group by ID, never by tag
    - id: {{ .Values.securityGroupId }}

  # configures storage devices for the instance
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        # Bottlerocket uses xvda for OS only: keep it small and fixed
        # User data goes to xvdb (see below)
        {{- if .Values.isBottlerocket }}
        volumeSize: 4Gi
        {{- else }}
        volumeSize: {{ .Values.diskSize }}
        {{- end }}
        volumeType: {{ .Values.storageClass }}
        {{- if and (eq .Values.storageClass "gp3") .Values.diskIops }}
        iops: {{ .Values.diskIops }}
        {{- end }}
        {{- if and (eq .Values.storageClass "gp3") .Values.diskThroughput }}
        throughput: {{ .Values.diskThroughput }}
        {{- end }}
        encrypted: true
        deleteOnTermination: true
    {{- if .Values.isBottlerocket }}
    # Bottlerocket uses a second volume for container data (images, logs)
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: {{ .Values.diskSize }}
        volumeType: {{ .Values.storageClass }}
        {{- if and (eq .Values.storageClass "gp3") .Values.diskIops }}
        iops: {{ .Values.diskIops }}
        {{- end }}
        {{- if and (eq .Values.storageClass "gp3") .Values.diskThroughput }}
        throughput: {{ .Values.diskThroughput }}
        {{- end }}
        encrypted: true
        deleteOnTermination: true
    {{- end }}

  # Optional, propagates tags to underlying EC2 resources
  tags:
    {{- range $key, $value := .Values.tags }}
       {{ $key }}: {{ $value }}
    {{- end }}

  {{- if .Values.defaultPrivateNodePool.cpuManagerPolicyStatic }}
  # Static CPU manager: Guaranteed pods with integer CPU requests (builder pods) get an
  # exclusive cpuset, so the CPU count they see matches their request, not the host size.
  # Karpenter merges this with its own generated config; keys Karpenter itself sets
  # (cluster, clusterDNS, maxPods, kubeReserved) win, cpuManagerPolicy is passed through.
  # amiFamily is the Karpenter family, custom AMIs included, and Karpenter merges userData for
  # AL2023 and Bottlerocket. Not rendered for AL2 (bootstrap.sh based, no nodeadm NodeConfig).
  {{- if eq .Values.amiFamily "Bottlerocket" }}
  userData: |
    [settings.kubernetes]
    cpu-manager-policy = "static"
  {{- else if eq .Values.amiFamily "AL2023" }}
  userData: |
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          cpuManagerPolicy: static
  {{- end }}
  {{- end }}
{{- end }}
