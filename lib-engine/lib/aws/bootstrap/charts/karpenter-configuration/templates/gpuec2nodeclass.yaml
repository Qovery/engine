{{- if .Values.gpuNodePool.enable }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: {{ .Values.amiFamily }}
  metadataOptions:
    httpPutResponseHopLimit: 2
  amiSelectorTerms:
    - name: "{{ .Values.gpuAmiSelectorTermsName }}"
      requirements:
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: Exists
  role: "KarpenterNodeRole-{{ .Values.clusterName }}"
  subnetSelectorTerms:
    {{- if .Values.explicitSubnetIds }}
    {{- range .Values.explicitSubnetIds }}
    - id: {{ . | quote }}
    {{- end }}
    {{- else }}
    - tags:
        karpenter.sh/discovery: "{{ .Values.clusterName }}"
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ .Values.securityGroupId | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        # Bottlerocket uses xvda for OS only: keep it small and fixed
        # User data goes to xvdb (see below)
        {{- if .Values.isBottlerocket }}
        volumeSize: 4Gi
        {{- else }}
        volumeSize: "{{ .Values.gpuNodePool.diskSize }}"
        {{- end }}
        volumeType: gp3
        {{- if .Values.gpuNodePool.diskIops }}
        iops: {{ .Values.gpuNodePool.diskIops }}
        {{- end }}
        {{- if .Values.gpuNodePool.diskThroughput }}
        throughput: {{ .Values.gpuNodePool.diskThroughput }}
        {{- end }}
        encrypted: true
        deleteOnTermination: true
    {{- if .Values.isBottlerocket }}
    # Bottlerocket uses a second volume for container data (images, logs)
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: "{{ .Values.gpuNodePool.diskSize }}"
        volumeType: gp3
        {{- if .Values.gpuNodePool.diskIops }}
        iops: {{ .Values.gpuNodePool.diskIops }}
        {{- end }}
        {{- if .Values.gpuNodePool.diskThroughput }}
        throughput: {{ .Values.gpuNodePool.diskThroughput }}
        {{- end }}
        encrypted: true
        deleteOnTermination: true
    {{- end }}
  tags:
    {{- range $key, $value := .Values.tags }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    NodeType: "GPU"
{{- end }}