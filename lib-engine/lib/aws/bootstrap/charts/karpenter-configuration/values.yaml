# Default values for karpenter-configuration.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

clusterName: ""
# Optional explicit role; empty retains the existing KarpenterNodeRole-<cluster> convention.
nodeRoleName: ""

securityGroupId: ""

diskSize: 0Gi
diskIops: null
diskThroughput: null
# Default node class (default, stable and cronjob pools): RAID0 when the default pool runs on local NVMe
instanceStorePolicy: ""
storageClass: gp3

capacity_type: []
explicitSubnetIds: []

amiSelectorTermsAlias: ""
gpuAmiSelectorTermsName: ""
kubernetesVersion: ""
isBottlerocket: false
amiFamily: AL2023

isCustomAmi: false
customAmiId: ""
customAmiName: ""

gpuAmiFamily: AL2023
gpuIsBottlerocket: false

tags:
  ClusterId: ""
  ClusterLongId: ""
  OrganizationId: ""
  OrganizationLongId: ""
  Region: ""

# to configure all the node pools (later we can have a section by node pool)
global_node_pools:
  terminationGracePeriod: 4h
stableNodePool:
  taintKey: nodepool/stable
  consolidationPolicy: WhenEmptyOrUnderutilized
  requirements: []
  consolidateAfter: 30s
  consolidation:
    budgets: []
  limits:
    maxCpu: ""
    maxMemory: ""
defaultNodePool:
  requirements: []
  consolidateAfter: 1m
  limits:
    maxCpu: ""
    maxMemory: ""
gpuNodePool:
  enable: false
  consolidateAfter: 30s
  requirements: []
  consolidation:
    budgets: []
  limits:
    maxCpu: ""
    maxMemory: ""
  diskSize: 100Gi
  diskIops: null
  diskThroughput: null
cronjobNodePool:
  taintKey: nodepool/cronjob
  enable: false
  consolidateAfter: 30s
  requirements: []
  consolidation:
    budgets: []
  limits:
    maxCpu: ""
    maxMemory: ""
# Egress-class pools (QOV-2107): opt-in (tainted), disabled unless the cluster
# receives an explicit override from core AND its network mode allows the pool.
defaultPublicNodePool:
  enable: false
  consolidateAfter: 1m
  # RAID0 (the only value Karpenter accepts) joins the local NVMe disks into one volume for kubelet
  # and container storage. No redundancy: one failed disk loses the data, fine since builds keep none.
  instanceStorePolicy: ""
  requirements: []
  limits:
    maxCpu: ""
    maxMemory: ""
defaultPrivateNodePool:
  enable: false
  consolidateAfter: 1m
  # RAID0 (the only value Karpenter accepts) joins the local NVMe disks into one volume for kubelet
  # and container storage. No redundancy: one failed disk loses the data, fine since builds keep none.
  instanceStorePolicy: ""
  requirements: []
  limits:
    maxCpu: ""
    maxMemory: ""
