---
apiVersion: v1
kind: Secret
metadata:
  name: {{ service.kube_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
type: Opaque
# Contract values stay base64 in `stringData`; ai-runner performs the decode.
stringData:
  {%- for ev in environment_variables %}
  {{ ev.key }}: |-
    {{ ev.value }}
  {%- endfor %}
{%- if user_environment_variables or bedrock_credentials %}
# User and Bedrock values use `data` so Kubernetes decodes them for the CLI.
# Reserved names prevent collisions with contract variables.
data:
  {%- for ev in user_environment_variables %}
  {{ ev.key }}: {{ ev.value }}
  {%- endfor %}
  {%- for ev in bedrock_credentials %}
  {{ ev.key }}: {{ ev.value }}
  {%- endfor %}
{%- endif %}
{%- if registry.docker_json_config %}
---
# Pull secret for a built image; Kubernetes expects its dockerconfigjson encoded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ registry.secret_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: "{{ service.long_id }}"
    qovery.com/service-type: "agentic-workflow"
    qovery.com/environment-id: "{{ environment_long_id }}"
    qovery.com/project-id: "{{ project_long_id }}"
data:
  .dockerconfigjson: {{ registry.docker_json_config }}
type: kubernetes.io/dockerconfigjson
{%- endif %}
