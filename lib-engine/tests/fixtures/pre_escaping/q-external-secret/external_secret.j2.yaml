{%- for external_secret in external_secrets %}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ external_secret.external_secret_kube_name }}
  namespace: {{ namespace }}
  labels:
    qovery.com/service-id: {{ service_id }}
    qovery.com/service-type: {{ service_type }}
    qovery.com/environment-id: {{ environment_id }}
    qovery.com/project-id: {{ project_id }}
    qovery.com/store-name: {{ external_secret.store_name }}
spec:
  # Only refresh secrets when the metadata / specs change
  refreshPolicy: OnChange
  # Refresh secret only on deploy
  refreshInterval: "0"
  secretStoreRef:
    name: {{ external_secret.store_name }}
    kind: ClusterSecretStore
  target:
    name: {{ external_secret.secret_name }}
    # It results in not deleting the secret generated by ESO:
    # - New deploy is triggered: the previous secret is still present in case of service rollback
    # - External Secret is deleted: the engine will need to delete the target secrets
    creationPolicy: Orphan
  data:
    {%- for entry in external_secret.entries %}
    - secretKey: {{ entry.env_var_key }}
      remoteRef:
        key: {{ entry.remote_key }}
    {%- endfor %}
{%- endfor %}
