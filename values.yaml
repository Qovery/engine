# Default values for qovery-engine.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: qoveryrd/engine
  pullPolicy: IfNotPresent
  tag: "9ec67b6f9783b9397c1c5c93de992b3b7b790b74"

namespace: "qovery"

imagePullSecrets: []

labels:
  app: qovery-engine

environmentVariables:
  ENGINE_RES_URL: "https://prod-qengine-resources.s3.eu-west-3.amazonaws.com/9ec67b6f9783b9397c1c5c93de992b3b7b790b74-lib.tgz"
  NATS_SERVER: "panic.qovery.com:4242"
  RUST_LOG: "DEBUG"
  LIB_ROOT_DIR: "/home/qovery/lib"

buildContainer:
  image: docker
  tag: 19.03.12-dind

terminationGracePeriodSeconds: 7200

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  privileged: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi


nodeSelector: {}

tolerations: []

affinity: {}
